    // Custom Scroll Reveal Component
    const Reveal = ({ children, delay = 0, className = "" }) => {
      const ref = useRef(null);
      const [isVisible, setIsVisible] = useState(false);

      useEffect(() => {
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setIsVisible(true);
              observer.unobserve(entry.target);
            }
          },
          { threshold: 0.15 }
        );
        if (ref.current) observer.observe(ref.current);
        return () => {
          if (ref.current) observer.unobserve(ref.current);
        };
      }, []);

      return (
        <div
          ref={ref}
          className={`transition-all duration-1000 ease-out ${
            isVisible ? "opacity-100 translate-y-0" : "opacity-0 translate-y-12"
          } ${className}`}
          style={{ transitionDelay: `${delay}ms` }}
        >
          {children}
        </div>
      );

    // Canvas-based Standard Model / Early Universe Particle Interaction Background
    const ParticleBackground = () => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        const resizeCanvas = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particlesArray = [];
        const smColors = ['#781919', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6']; 

        class Particle {
          constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.vx = (Math.random() - 0.5) * 2.5; 
            this.vy = (Math.random() - 0.5) * 2.5;
            this.radius = Math.random() * 2 + 1.5;
            this.color = smColors[Math.floor(Math.random() * smColors.length)];
          }

          update() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
            if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;
          }

          draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
            ctx.shadowBlur = 8;
            ctx.shadowColor = this.color;
          }
        }

        for (let i = 0; i < 90; i++) {
          particlesArray.push(new Particle());
        }

        for (let frame = 0; frame < 180; frame++) {
          for (let i = 0; i < particlesArray.length; i++) {
            particlesArray[i].update();
          }
        }

        const animate = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          
          for (let i = 0; i < particlesArray.length; i++) {
            particlesArray[i].update();
            particlesArray[i].draw();
            
            for (let j = i; j < particlesArray.length; j++) {
              const dx = particlesArray[i].x - particlesArray[j].x;
              const dy = particlesArray[i].y - particlesArray[j].y;
              const distance = Math.sqrt(dx * dx + dy * dy);
              
              if (distance < 130) {
                ctx.beginPath();
                ctx.strokeStyle = particlesArray[i].color; 
                ctx.globalAlpha = 1 - (distance / 130);
                ctx.lineWidth = 0.8;
                ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
                ctx.lineTo(particlesArray[j].x, particlesArray[j].y);
                ctx.stroke();
                ctx.globalAlpha = 1; 
                ctx.shadowBlur = 0; 
              }
            }
          }
          animationFrameId = requestAnimationFrame(animate);
        };

        animate();

        return () => {
          window.removeEventListener('resize', resizeCanvas);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return (
        <canvas 
          ref={canvasRef} 
          className="absolute inset-0 z-0 opacity-40 pointer-events-none" 
        />
      );
    };

              </section>

              {/* Interactive Research Section */}
              <section id="research" className="py-20 bg-cream-50 relative overflow-hidden">
                <div className="absolute top-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-stone-300 to-transparent"></div>
                <div className="max-w-6xl mx-auto px-6">
                  <Reveal>
                    <div className="text-center mb-12">
                      <h2 className="text-3xl font-bold text-stone-900 mb-4">Research Focus</h2>
                      <p className="text-stone-600 max-w-2xl mx-auto">
                        A few domain below to explore my theoretical models and phenomenological studies.
                      </p>
                    </div>
                  </Reveal>

                  <div className="grid md:grid-cols-3 gap-6 mb-8">
                    {researchInterests.map((item, idx) => (
                      <Reveal key={item.id} delay={idx * 150} className="h-full">
                        <button
                          onClick={() => setActiveResearch(item.id)}
                          className={`group w-full h-full text-left p-6 rounded-2xl transition-all duration-300 border ${
                            activeResearch === item.id 
                              ? 'bg-cream shadow-xl shadow-darkred-100 border-darkred-200 scale-105 z-10' 
                              : 'bg-cream/60 hover:bg-cream border-transparent hover:border-stone-200 hover:-translate-y-1 text-stone-500'
                          }`}
                        >
                          <div className={`mb-4 transition-transform duration-500 ${activeResearch === item.id ? 'scale-110' : ''}`}>
                            {item.icon}
                          </div>
                          <h3 className={`text-xl font-bold mb-2 transition-colors ${activeResearch === item.id ? 'text-darkred-900' : 'text-stone-700'}`}>
                            {item.title}
                          </h3>
                          {activeResearch === item.id && (
                            <p className="text-stone-600 text-sm mt-3 animate-fade-in">
                              {item.description}
                            </p>
                          )}
                        </button>
                      </Reveal>
                    ))}
                  </div>
                </div>
              </section>

              {/* Tabs Section (Experience, Education, Achievements) */}
              <section id="experience" className="py-20 bg-cream">
                <div className="max-w-4xl mx-auto px-6">
                  
                  {/* Tab Selector */}
                  <Reveal>
                    <div className="flex justify-center mb-16">
                      <div className="bg-cream-100 p-1.5 rounded-2xl inline-flex flex-wrap justify-center shadow-inner gap-1">
                        <button 
                          onClick={() => setActiveTab('experience')}
                          className={`px-4 py-3 md:px-6 md:py-3.5 rounded-xl font-bold transition-all flex items-center gap-2 ${activeTab === 'experience' ? 'bg-cream text-darkred-800 shadow-sm ring-1 ring-stone-200/50 scale-105' : 'text-stone-500 hover:text-stone-700 hover:bg-stone-200/50'}`}
                        >
                          <i className={`fa-solid fa-briefcase text-lg ${activeTab === 'experience' ? 'animate-bounce' : ''}`} style={activeTab === 'experience' ? {animationIterationCount: 2} : {}}></i>
                          <span className="hidden sm:inline">Professional</span> Experience
                        </button>
                        <button 
                          onClick={() => setActiveTab('education')}
                          className={`px-4 py-3 md:px-6 md:py-3.5 rounded-xl font-bold transition-all flex items-center gap-2 ${activeTab === 'education' ? 'bg-cream text-darkred-800 shadow-sm ring-1 ring-stone-200/50 scale-105' : 'text-stone-500 hover:text-stone-700 hover:bg-stone-200/50'}`}
                        >
                          <i className={`fa-solid fa-graduation-cap text-lg ${activeTab === 'education' ? 'animate-bounce' : ''}`} style={activeTab === 'education' ? {animationIterationCount: 2} : {}}></i>
                          Education <span className="hidden sm:inline">Background</span>
                        </button>
                        <button 
                          onClick={() => setActiveTab('achievements')}
                          className={`px-4 py-3 md:px-6 md:py-3.5 rounded-xl font-bold transition-all flex items-center gap-2 ${activeTab === 'achievements' ? 'bg-cream text-darkred-800 shadow-sm ring-1 ring-stone-200/50 scale-105' : 'text-stone-500 hover:text-stone-700 hover:bg-stone-200/50'}`}
                        >
                          <i className={`fa-solid fa-award text-lg ${activeTab === 'achievements' ? 'animate-bounce' : ''}`} style={activeTab === 'achievements' ? {animationIterationCount: 2} : {}}></i>
                          Key Achievements
                        </button>
                      </div>
                    </div>
                  </Reveal>

                  {/* Active Tab Content (Timeline) */}
                  <div className="space-y-8 relative before:absolute before:inset-0 before:ml-[1.125rem] before:h-full before:w-1 before:bg-gradient-to-b before:from-darkred-200 before:via-cream-200 before:to-transparent before:rounded-full">
                    {activeTab === 'achievements' ? (
                      achievements.map((item, idx) => (
                        <Reveal key={idx} delay={idx * 150}>
                          <div className="relative flex items-center gap-6 group">
                            <div className="flex items-center justify-center w-10 h-10 rounded-full border-4 border-cream bg-darkred-50 text-darkred-800 shadow-sm shrink-0 z-10 group-hover:bg-darkred-800 group-hover:text-cream transition-colors duration-300 relative">
                               <span className="absolute inline-flex h-full w-full rounded-full bg-darkred-200 opacity-0 group-hover:animate-ping"></span>
                               <i className="fa-solid fa-award text-sm relative z-10 group-hover:animate-pulse"></i>
                            </div>
                            <div className="flex-1 bg-cream p-5 md:p-6 rounded-2xl border border-stone-200 shadow-sm hover:shadow-xl hover:border-darkred-200 hover:-translate-y-1 transition-all duration-300">
                              <h4 className="text-lg font-bold text-stone-900 group-hover:text-darkred-800 transition-colors">{item}</h4>
                            </div>
                          </div>
                        </Reveal>
                      ))
                    ) : (
                      (activeTab === 'experience' ? experience : education).map((item, idx) => (
                        <Reveal key={idx} delay={idx * 150}>
                          <div className="relative flex items-start gap-6 group">
                            
                            {/* Timeline Node */}
                            <div className="mt-1 flex items-center justify-center w-10 h-10 rounded-full border-4 border-cream bg-darkred-50 text-darkred-800 shadow-sm shrink-0 z-10 group-hover:bg-darkred-800 group-hover:text-cream transition-colors duration-300 relative">
                               <span className="absolute inline-flex h-full w-full rounded-full bg-darkred-200 opacity-0 group-hover:animate-ping"></span>
                               {activeTab === 'experience' ? <i className="fa-solid fa-briefcase text-sm relative z-10"></i> : <i className="fa-solid fa-graduation-cap text-sm relative z-10"></i>}
                            </div>
                            
                            {/* Content Card */}
                            <div className="flex-1 bg-cream p-6 md:p-8 rounded-2xl border border-stone-200 shadow-sm hover:shadow-xl hover:border-darkred-200 hover:-translate-y-1 transition-all duration-300">
                              <div className="flex flex-col md:flex-row md:items-center justify-between mb-4 gap-3">
                                <h4 className="text-xl font-bold text-stone-900 group-hover:text-darkred-800 transition-colors">{item.role || item.degree}</h4>
                                <span className="inline-flex items-center px-3 py-1 bg-darkred-50 text-darkred-900 text-sm font-semibold rounded-full whitespace-nowrap group-hover:bg-darkred-100 transition-colors">
                                  {item.period}
                                </span>
                              </div>
                              <div className="text-stone-700 font-semibold mb-3 flex items-center gap-2">
                                <i className="fa-solid fa-location-dot text-stone-400 group-hover:text-darkred-400 transition-colors"></i>
                                {item.institution}
                              </div>
                              {item.description || item.details ? (
                                <p className="text-stone-600 leading-relaxed">
                                  {item.description || item.details}
                                </p>
                              ) : null}
                            </div>

                          </div>
                        </Reveal>
                      ))
                    )}
                  </div>

                </div>
              </section>

              {/* Publications */}
              <section id="publications" className="py-20 bg-cream-50 overflow-hidden">
                <div className="max-w-5xl mx-auto px-6">
                  <Reveal>
                    <div className="flex flex-col md:flex-row md:items-center justify-between mb-12 gap-4">
                      <h2 className="text-3xl font-bold text-stone-900 flex items-center gap-2 group cursor-default">
                        <i className="fa-solid fa-book-open text-3xl text-darkred-800 group-hover:animate-float"></i>
                        Selected Publications
                      </h2>
                      <div className="flex flex-wrap gap-2">
                        <a href="https://arxiv.org/search/?query=%22Shivam+Gola%22&searchtype=author" target="_blank" rel="noopener noreferrer" className="group px-3 py-1 bg-cream border border-stone-200 rounded-full text-xs font-medium text-stone-600 flex items-center gap-1 cursor-pointer hover:bg-darkred-50 hover:text-darkred-800 hover:border-darkred-200 transition-all">
                          arXiv <i className="fa-solid fa-arrow-up-right-from-square text-[10px] group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform"></i>
                        </a>
                        <a href="https://inspirehep.net/authors/1867679" target="_blank" rel="noopener noreferrer" className="group px-3 py-1 bg-cream border border-stone-200 rounded-full text-xs font-medium text-stone-600 flex items-center gap-1 cursor-pointer hover:bg-darkred-50 hover:text-darkred-800 hover:border-darkred-200 transition-all">
                          iNSPIRE-HEP <i className="fa-solid fa-arrow-up-right-from-square text-[10px] group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform"></i>
                        </a>
                        <a href="https://scholar.google.com/scholar?q=%22Shivam+Gola%22" target="_blank" rel="noopener noreferrer" className="group px-3 py-1 bg-cream border border-stone-200 rounded-full text-xs font-medium text-stone-600 flex items-center gap-1 cursor-pointer hover:bg-darkred-50 hover:text-darkred-800 hover:border-darkred-200 transition-all">
                          Google Scholar <i className="fa-solid fa-arrow-up-right-from-square text-[10px] group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform"></i>
                        </a>
                      </div>
                    </div>
                  </Reveal>

                  <Reveal delay={200}>
                    <div className="bg-cream p-8 md:p-10 rounded-3xl border border-stone-200 shadow-sm hover:shadow-md transition-shadow">
                      <ol className="list-decimal pl-5 space-y-6 text-stone-700 marker:text-darkred-800 marker:font-bold">
                        {publications.map((pub, idx) => (
                          <li key={idx} className="pl-3 leading-relaxed text-lg group hover:translate-x-2 transition-transform duration-300">
                            <span className="font-semibold text-stone-900 group-hover:text-darkred-900 transition-colors">{pub.authors}</span>.{" "}
                            <a href={pub.link} className="text-darkred-800 hover:text-darkred-600 relative inline-block after:content-[''] after:absolute after:w-full after:scale-x-0 after:h-0.5 after:bottom-0 after:left-0 after:bg-darkred-600 after:origin-bottom-right after:transition-transform after:duration-300 hover:after:scale-x-100 hover:after:origin-bottom-left">
                              "{pub.title}"
                            </a>
                            . <span className="italic text-stone-600">{pub.journal}</span>.
                          </li>
                        ))}
                      </ol>
                    </div>
                  </Reveal>
                </div>
              </section>
            </>
          )}

          {/* ----- ACTIVITIES PAGE CONTENT ----- */}
          {currentPage === 'activities' && (
            <div className="pt-24 pb-12 min-h-screen bg-cream animate-fade-in">
              <section id="conferences" className="py-10 bg-cream">
                <div className="max-w-5xl mx-auto px-6">
                  <Reveal>
                    <div className="flex items-center justify-center mb-10 group cursor-default">
                      <h2 className="text-3xl font-bold text-stone-900 flex items-center gap-3">
                        <i className="fa-solid fa-microphone-lines text-3xl text-darkred-800 group-hover:animate-pulse"></i>
                        Academic Activities
                      </h2>
                    </div>
                  </Reveal>

                  <Reveal delay={150}>
                    <div className="flex justify-center mb-10">
                      <div className="bg-cream-100 p-1.5 rounded-2xl inline-flex shadow-inner gap-1 border border-stone-100">
                        <button 
                          onClick={() => setActiveActivityTab('conferences')}
                          className={`px-5 py-2.5 md:px-8 md:py-3 rounded-xl font-bold transition-all flex items-center gap-2 ${activeActivityTab === 'conferences' ? 'bg-cream text-darkred-800 shadow-sm ring-1 ring-stone-200/50 scale-105' : 'text-stone-500 hover:text-stone-700 hover:bg-stone-200/50'}`}
                        >
                          <i className={`fa-solid fa-users text-lg ${activeActivityTab === 'conferences' ? 'animate-pulse' : ''}`}></i>
                          Conferences & Seminars
                        </button>
                        <button 
                          onClick={() => setActiveActivityTab('visits')}
                          className={`px-5 py-2.5 md:px-8 md:py-3 rounded-xl font-bold transition-all flex items-center gap-2 ${activeActivityTab === 'visits' ? 'bg-cream text-darkred-800 shadow-sm ring-1 ring-stone-200/50 scale-105' : 'text-stone-500 hover:text-stone-700 hover:bg-stone-200/50'}`}
                        >
                          <i className={`fa-solid fa-plane text-lg ${activeActivityTab === 'visits' ? 'animate-bounce' : ''}`} style={activeActivityTab === 'visits' ? {animationIterationCount: 2} : {}}></i>
                          Research Visits
                        </button>
                      </div>
                    </div>
                  </Reveal>

                  <Reveal delay={300}>
                    <div className="bg-cream-50 p-8 md:p-10 rounded-3xl border border-stone-200 shadow-sm">
                      <div className="space-y-8">
                        {(activeActivityTab === 'conferences' ? conferencesList : visitsList).map((item, idx) => (
                          <div key={idx} className="relative pl-6 border-l-2 border-darkred-200 group hover:border-darkred-500 transition-colors duration-300 animate-fade-in" style={{ animationDelay: `${idx * 0.05}s` }}>
                            <div className="absolute w-3 h-3 bg-darkred-300 rounded-full -left-[7px] top-1.5 ring-4 ring-cream-50 group-hover:bg-darkred-700 group-hover:scale-125 transition-all duration-300"></div>
                            <div className="flex flex-wrap items-center gap-3 mb-1">
                              <span className="px-2.5 py-0.5 bg-darkred-100 text-darkred-900 text-xs font-bold rounded uppercase tracking-wider group-hover:bg-darkred-200 transition-colors">
                                {item.type}
                              </span>
                              <span className="text-darkred-800 font-semibold text-sm">
                                {item.date}
                              </span>
                            </div>
                            <h3 className="text-xl font-bold text-stone-900 mb-2 group-hover:text-darkred-900 transition-colors">{item.title}</h3>
                            <p className="text-stone-700 leading-relaxed text-lg">
                              {item.details}
                            </p>
                          </div>
                        ))}
                      </div>
                    </div>
                  </Reveal>
                </div>
              </section>
            </div>
          )}

          {/* ----- BLOG & GALLERY PAGE CONTENT ----- */}
          {currentPage === 'blog' && (
            <div className="pt-24 pb-12 min-h-screen bg-cream animate-fade-in relative">
              <section id="blog" className="py-10 bg-cream">
                <div className="max-w-5xl mx-auto px-6">
                  <Reveal>
                    <div className="text-center mb-16 group cursor-default">
                      <h2 className="text-3xl font-bold text-stone-900 flex items-center justify-center gap-3">
                        <i className="fa-solid fa-camera-retro text-3xl text-darkred-800 group-hover:animate-bounce" style={{animationIterationCount: 2}}></i>
                        Travel & Photography
                      </h2>
                      <p className="text-stone-500 mt-3 max-w-xl mx-auto">Memories from various trips and places I've visited.</p>
                    </div>
                  </Reveal>

                  <div className="grid grid-cols-1 gap-16">
                    {blogPosts.map((post, idx) => (
                      <Reveal key={post.id} delay={idx * 150}>
                        <div className="bg-cream-50 rounded-[2rem] border border-stone-200 shadow-sm hover:shadow-xl transition-all duration-500 overflow-hidden flex flex-col group">
                          
                          {/* Image Gallery Area with Photogenic Layout */}
                          {post.images && post.images.length > 0 && (
                            <div className="bg-stone-200/40 p-6 md:p-10 relative overflow-hidden">
                               {/* Abstract background subtle blobs for vibe */}
                               <div className="absolute top-0 right-0 w-64 h-64 bg-darkred-200 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse-soft"></div>
                               <div className="absolute bottom-0 left-0 w-64 h-64 bg-amber-200 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-float"></div>

                              <div className={`grid gap-6 relative z-10 ${
                                post.images.length === 1 ? 'grid-cols-1 max-w-2xl mx-auto' : 
                                post.images.length === 2 ? 'grid-cols-1 sm:grid-cols-2' : 
                                'grid-cols-1 sm:grid-cols-2 md:grid-cols-3'
                              }`}>
                                {post.images.map((imgUrl, index) => {
                                  // Alternating polaroid rotation effect if multiple images exist
                                  const rotations = ['rotate-[-2deg]', 'rotate-[2deg]', 'rotate-[-1deg]', 'rotate-[1.5deg]'];
                                  const rotationClass = post.images.length > 1 ? rotations[index % 4] : '';
                                  
                                  return (
                                  <div 
                                    key={index} 
                                    className={`relative aspect-[4/3] overflow-hidden rounded-xl bg-stone-300 shadow-md border-[6px] border-white cursor-pointer group/img transition-all duration-500 hover:z-20 hover:shadow-2xl hover:scale-105 hover:rotate-0 ${rotationClass}`}
                                    onClick={() => setSelectedImage(imgUrl)}
                                  >
                                    <img 
                                      src={imgUrl} 
                                      alt={`${post.title} ${index + 1}`} 
                                      className="w-full h-full object-cover transition-transform duration-700 group-hover/img:scale-110" 
                                      onError={(e) => {
                                        // Smart fallback so it looks good when previewing without local files
                                        e.target.onerror = null; 
                                        e.target.src = "https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=800&q=80";
                                      }}
                                    />
                                    {/* Expand overlay */}
                                    <div className="absolute inset-0 bg-stone-900/0 group-hover/img:bg-stone-900/20 transition-all duration-300 flex items-center justify-center">
                                       <div className="bg-white/30 backdrop-blur-sm w-12 h-12 rounded-full flex items-center justify-center opacity-0 group-hover/img:opacity-100 scale-50 group-hover/img:scale-100 transition-all duration-300 shadow-lg">
                                         <i className="fa-solid fa-expand text-white text-xl drop-shadow-md"></i>
                                       </div>
                                    </div>
                                  </div>
                                )})}
                              </div>
                            </div>
                          )}

                          {/* Post Text Details */}
                          <div className="p-8 md:p-10 relative z-10 bg-cream-50">
                            <div className="flex items-center gap-3 mb-4">
                              <span className="px-3 py-1 bg-darkred-50 text-darkred-900 text-xs font-bold rounded-full uppercase tracking-wider">
                                {post.type}
                              </span>
                              <span className="text-stone-500 text-sm font-medium">
                                <i className="fa-regular fa-calendar mr-2"></i>{post.date}
                              </span>
                            </div>
                            <h3 className="text-3xl font-bold text-stone-900 mb-3 group-hover:text-darkred-800 transition-colors">{post.title}</h3>
                            {post.content && post.content.trim() !== "" && (
                               <p className="text-stone-600 leading-relaxed text-lg">
                                 {post.content}
                               </p>
                            )}
                          </div>
                          
                        </div>
                      </Reveal>
                    ))}
                  </div>
                </div>
              </section>
            </div>
          )}

          {/* ----- LIGHTBOX MODAL ----- */}
          {selectedImage && (
            <div 
              className="fixed inset-0 z-[100] flex items-center justify-center bg-stone-900/95 backdrop-blur-md p-4 md:p-12 animate-fade-in-modal cursor-zoom-out"
              onClick={() => setSelectedImage(null)}
            >
              <button 
                className="absolute top-4 right-4 md:top-8 md:right-8 text-stone-400 hover:text-white transition-colors text-3xl md:text-4xl z-10 w-12 h-12 flex items-center justify-center rounded-full bg-stone-800/50 hover:bg-darkred-800"
                onClick={() => setSelectedImage(null)}
              >
                <i className="fa-solid fa-xmark"></i>
              </button>
              <img 
                src={selectedImage} 
                alt="Expanded View" 
                className="max-w-full max-h-full rounded-lg shadow-2xl object-contain animate-scale-up-modal cursor-default"
                onClick={(e) => e.stopPropagation()} 
                onError={(e) => {
                  e.target.onerror = null; 
                  e.target.src = "https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1600&q=80";
                }}
              />
            </div>
          )}

          {/* Footer / Contact */}
          <footer id="contact" className="bg-stone-900 text-stone-400 py-16 border-t-4 border-darkred-800 relative overflow-hidden">
            {/* Subtle background glow in footer */}
            <div className="absolute top-0 left-1/4 w-96 h-96 bg-darkred-900 rounded-full mix-blend-screen filter blur-[128px] opacity-20 pointer-events-none"></div>
            
            <div className="max-w-6xl mx-auto px-6 grid md:grid-cols-2 gap-12 relative z-10">
              <Reveal>
                <div>
                  <h2 className="text-2xl font-bold text-cream mb-6 flex items-center gap-2">
                    <i className="fa-solid fa-paper-plane text-darkred-600"></i> Get in Touch
                  </h2>
                  <div className="space-y-4">
                    <a href="mailto:shivamgola17@gmail.com" className="flex items-center gap-3 hover:text-cream hover:translate-x-1 transition-all group w-fit">
                      <div className="w-8 h-8 rounded-full bg-stone-800 flex items-center justify-center group-hover:bg-darkred-800 transition-colors">
                        <i className="fa-solid fa-envelope"></i>
                      </div>
                      shivamgola17@gmail.com
                    </a>	
                    <div className="flex items-center gap-3 group w-fit hover:text-cream transition-colors cursor-default">
                      <div className="w-8 h-8 rounded-full bg-stone-800 flex items-center justify-center group-hover:bg-darkred-800 transition-colors">
                        <i className="fa-solid fa-location-dot"></i>
                      </div>
                      IIT Bombay, Mumbai, Maharashtra 400076
                    </div>
                  </div>
                </div>
              </Reveal>
            </div>
            
            <Reveal delay={200}>
              <div className="max-w-6xl mx-auto px-6 mt-16 pt-8 border-t border-stone-800 text-sm flex flex-col sm:flex-row justify-between items-center relative z-10">
                <p>© {new Date().getFullYear()} Dr. Shivam Gola. All rights reserved.</p>
                <div className="flex gap-6 mt-4 sm:mt-0">
                  <a href="https://inspirehep.net/authors/1867679" target="_blank" rel="noopener noreferrer" className="hover:text-cream hover:-translate-y-0.5 transition-all">iNSPIRE-HEP</a>
                  <a href="https://arxiv.org/search/?query=%22Shivam+Gola%22&searchtype=author" target="_blank" rel="noopener noreferrer" className="hover:text-cream hover:-translate-y-0.5 transition-all">arXiv</a>
                  <a href="https://scholar.google.com/scholar?q=%22Shivam+Gola%22" target="_blank" rel="noopener noreferrer" className="hover:text-cream hover:-translate-y-0.5 transition-all">Google Scholar</a>
                </div>
              </div>
            </Reveal>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
