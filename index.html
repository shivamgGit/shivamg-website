    ];

    const PREFERS_REDUCED = typeof window !== 'undefined' && window.matchMedia
      ? window.matchMedia('(prefers-reduced-motion: reduce)').matches
      : false;

    // Reveal-on-scroll. Three things matter here and all three were broken before:
    //   • the wrapper must stop transitioning once it has settled, otherwise its
    //     staggered transition-delay keeps applying to every later hover;
    //   • content already on screen at mount must not replay a long cascade
    //     (that is what made tab switches feel like a slow wipe);
    //   • the timed fallback must not fire for off-screen content, or everything
    //     reveals before you ever scroll to it.
    // Scroll-driven reveal scheduler. IntersectionObserver is not reliable in
    // every embedding context (callbacks can simply never fire), so visibility is
    // measured directly against the viewport on a rAF-throttled scroll/resize
    // pass. One shared listener set serves every Reveal on the page.
    const revealWatch = (() => {
      const pending = new Set();
      let ticking = false;
      let listening = false;

      const flush = () => {
        ticking = false;   // cleared first: a throw or missed tick can never latch the scheduler off
        const vh = window.innerHeight || document.documentElement.clientHeight;
        pending.forEach((entry) => {
          const el = entry.el();
          if (!el) { pending.delete(entry); return; }
          const rect = el.getBoundingClientRect();
          // Pre-roll: start the reveal while the element is still just below the
          // fold, so it is finishing its fade as it arrives in comfortable view
          // instead of popping after it is already fully on screen.
          if (rect.top < vh + 140 && rect.bottom > -80) {
            pending.delete(entry);
            entry.show();
          }
        });
        if (pending.size === 0) stop();
      };

      // rAF while the document is visible: frame-aligned, so a fast scroll cannot
      // outrun the scheduler and make several rows pop at once. rAF is suspended
      // while hidden, so fall back to a timer there or a page opened in a
      // background tab would never reveal anything.
      const check = () => {
        if (ticking) return;
        ticking = true;
        if (document.hidden) setTimeout(flush, 60);
        else requestAnimationFrame(flush);
      };

      const start = () => {
        if (listening) return;
        listening = true;
        window.addEventListener('scroll', check, { passive: true });
        window.addEventListener('resize', check);
        window.addEventListener('load', check);
        document.addEventListener('visibilitychange', check);
      };
      const stop = () => {
        if (!listening) return;
        listening = false;
        window.removeEventListener('scroll', check);
        window.removeEventListener('resize', check);
        window.removeEventListener('load', check);
        document.removeEventListener('visibilitychange', check);
      };

      return {
        add(entry) {
          pending.add(entry);
          start();
          flush();
          // Layout (and web fonts) may not have resolved at mount, where
          // getBoundingClientRect() can still read all zeros. Re-measure as it settles.
          [0, 120, 400, 1000].forEach((t) => setTimeout(check, t));
        },
        remove(entry) { pending.delete(entry); if (pending.size === 0) stop(); },
        poke: check
      };
    })();

    // Long, decelerating curve (expo-out): most of the motion happens up front and
    // the last few pixels ease off, which is what removes the abrupt arrival.
    const REVEAL_MS = 820;
    const REVEAL_EASE = 'cubic-bezier(0.16, 1, 0.3, 1)';

    // `instant` opts a subtree out of scroll-reveal entirely: it renders in its
    // final state with no observer, no transition and no stagger.
    const Reveal = ({ children, delay = 0, className = "", instant = false }) => {
      const ref = useRef(null);
      const [phase, setPhase] = useState(PREFERS_REDUCED || instant ? 'settled' : 'hidden');
      const activeDelay = useRef(0);

      useEffect(() => {
        if (PREFERS_REDUCED || instant) return;
        const el = ref.current;
        if (!el) return;
        let settleTimer = null;
        const DURATION = REVEAL_MS;

        const reveal = (stagger) => {
          activeDelay.current = stagger;
          setPhase('revealing');
          settleTimer = setTimeout(() => setPhase('settled'), stagger + DURATION + 60);
        };

        const vh = window.innerHeight || document.documentElement.clientHeight;
        const rect = el.getBoundingClientRect();
        const laidOut = rect.width > 0 || rect.height > 0;
        if (laidOut && rect.top < vh && rect.bottom > 0) {
          reveal(Math.min(delay, 200));   // already visible: short, capped stagger
          return () => clearTimeout(settleTimer);
        }

        const entry = { el: () => ref.current, show: () => reveal(Math.min(delay, 200)) };
        revealWatch.add(entry);
        return () => { clearTimeout(settleTimer); revealWatch.remove(entry); };
      }, []);

      const hidden = phase === 'hidden';
      const settled = phase === 'settled';
      return (
        <div
          ref={ref}
          className={className}
          style={{
            opacity: hidden ? 0 : 1,
            // 'none' once settled: leaves no transform containing block behind,
            // so hover lifts on children behave normally.
            transform: hidden ? 'translate3d(0, 18px, 0)' : 'none',
            transition: settled ? 'none' : `opacity ${REVEAL_MS}ms ${REVEAL_EASE}, transform ${REVEAL_MS}ms ${REVEAL_EASE}`,
            transitionDelay: settled ? '0ms' : activeDelay.current + 'ms',
            willChange: settled ? 'auto' : 'opacity, transform'
          }}
        >
          {children}
        </div>
      );
    };

    // ─────────────────────────────────────────────────────────────────────────
    //  Bullet-Cluster spacetime background
    //  Physics contract (kept internally consistent):
    //    • Dark matter is collisionless  → both halos pass straight through.
    //    • Baryonic gas is collisional   → ram pressure decelerates it, it lags
    //      behind its halo, is compressed on the leading edge (bow shock) and
    //      streams a stripped tail *behind* the direction of motion.
    //    • Gas is ~15% of the cluster mass → the spacetime wells (and therefore
    //      the lensing signal) track the DARK MATTER, not the visible gas.
    //      That offset is the whole point of the Bullet Cluster.
    //    • Halo particles obey a flat rotation curve (ω ∝ 1/r).
    //    • Black hole: horizon r=1 (M=0.5), photon sphere r=1.5, ISCO r=3,
    //      Keplerian disk (ω ∝ r^-3/2), relativistic beaming ∝ D⁴ toward the
    //      approaching limb.
    //  The whole sequence loops forever on a fixed timestep, so it looks the
    //  same on a 60 Hz and a 144 Hz display and never leaves a dead canvas.
    // ─────────────────────────────────────────────────────────────────────────
    const REDUCED_MOTION = typeof window !== 'undefined' && window.matchMedia

    const SpaceTimeGridBackground = ({ isDark }) => {
      const canvas2DRef = useRef(null);
      const canvas3DRef = useRef(null);
      const simRef = useRef(null);       // imperative on/off handle, published by the sim effect
      const [simOn, setSimOn] = useState(true);
      const isDarkRef = useRef(isDark);
      useEffect(() => { isDarkRef.current = isDark; }, [isDark]);

      useEffect(() => {
        const canvas2D = canvas2DRef.current;
        const canvas3D = canvas3DRef.current;
        if (!canvas2D || !canvas3D) return;
        const ctx = canvas2D.getContext('2d');

        let renderer = null;
        try {
          renderer = new THREE.WebGLRenderer({ canvas: canvas3D, alpha: true, antialias: false, powerPreference: 'high-performance' });
          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.25));
          renderer.setClearColor(0x000000, 0);
        } catch (err) { renderer = null; }

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

        const uniforms = {
          uTime: { value: 0.0 },
          uResolution: { value: new THREE.Vector2(1, 1) },
          uMouse: { value: new THREE.Vector2(0.5, 0.5) },
          uCenter: { value: new THREE.Vector2(0.5, 0.5) },
          uOpacity: { value: 0.0 },
          uScale: { value: 1.0 }
        };

        const vertexShader = `
            varying vec2 vUv;
            void main() { vUv = uv; gl_Position = vec4(position, 1.0); }
        `;

        // Schwarzschild units used below: M = 0.5, so
        //   horizon r = 2M = 1.0 · photon sphere r = 3M = 1.5 · ISCO r = 6M = 3.0
        const fragmentShader = `
            uniform float uTime;
            uniform vec2 uResolution;
            uniform vec2 uMouse;
            uniform vec2 uCenter;
            uniform float uOpacity;
            uniform float uScale;
            varying vec2 vUv;

            const float R_PHOTON = 1.5;
            const float R_ISCO   = 3.0;
            const float R_OUTER  = 15.0;

            mat2 rot(float a) { float s = sin(a), c = cos(a); return mat2(c, -s, s, c); }

            float hash(vec2 p) {
                p = fract(p * vec2(123.34, 456.21));
                p += dot(p, p + 45.32);
                return fract(p.x * p.y);
            }

            float noise(vec2 p) {
                vec2 i = floor(p);
                vec2 f = fract(p);
                f = f * f * (3.0 - 2.0 * f);
                float a = hash(i);
                float b = hash(i + vec2(1.0, 0.0));
                float c = hash(i + vec2(0.0, 1.0));
                float d = hash(i + vec2(1.0, 1.0));
                return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
            }

            float fbm(vec2 p) {
                float v = 0.0;
                float a = 0.5;
                vec2 shift = vec2(100.0);
                mat2 rotFBM = mat2(cos(0.5), sin(0.5), -sin(0.5), cos(0.50));
                for (int i = 0; i < 5; ++i) {
                    v += a * noise(p);
                    p = rotFBM * p * 2.0 + shift;
                    a *= 0.5;
                }
                return v;
            }

            void main() {
                vec2 uv = (vUv - uCenter) * 2.0;
                if (uResolution.x < uResolution.y) uv.y *= uResolution.y / uResolution.x;
                else                               uv.x *= uResolution.x / uResolution.y;
                uv /= max(0.001, uScale);

                vec3 ro = vec3(0.0, 10.5, 66.0);
                float rotX = (uMouse.y - 0.5) * 2.5;
                float rotY = (uMouse.x - 0.5) * 6.28 + (uTime * 0.05);
                ro.yz *= rot(rotX);
                ro.xz *= rot(rotY);

                vec3 ta = vec3(0.0);
                vec3 cw = normalize(ta - ro);
                vec3 cu = normalize(cross(cw, vec3(0.0, 1.0, 0.0)));
                vec3 cv = normalize(cross(cu, cw));
                vec3 rd = normalize(uv.x * cu + uv.y * cv + 2.0 * cw);

                vec3 p = ro;
                vec3 v = rd;
                vec3 col = vec3(0.0);

                // Conserved angular momentum of the null geodesic.
                float h2 = dot(cross(ro, rd), cross(ro, rd));
                float prevY = p.y;
                float hitDisk = 0.0;
                float minR = 1000.0;

                for(int i = 0; i < 300; i++) {
                    float r = length(p);
                    minR = min(minR, r);
                    // Anything that falls inside the photon sphere is captured —
                    // that, not the horizon, is what sets the shadow's edge.
                    if(r < R_PHOTON) { minR = 0.0; break; }
                    if(r > 120.0) break;

                    float dt = 0.02 + 0.015 * r;
                    vec3 a = -1.5 * h2 * p / pow(r, 5.0);
                    v += a * dt;
                    v = normalize(v);
                    p += v * dt;

                    if(prevY * p.y < 0.0) {
                        float rDisk = length(p.xz);
                        if(rDisk > R_ISCO && rDisk < R_OUTER) {
                            float spinSpeed = 3.0 / pow(rDisk, 1.5);          // Keplerian
                            float angleOffset = (uTime * spinSpeed) + (rDisk * 0.35);
                            float s = sin(-angleOffset), c = cos(-angleOffset);
                            vec2 rotatedP = mat2(c, -s, s, c) * p.xz;
                            vec2 uvNoise = rotatedP * 2.0;

                            float fire  = fbm(uvNoise - vec2(uTime * 1.0, uTime * 0.5));
                            float fire2 = fbm(uvNoise * 1.5 + vec2(uTime * 1.5, uTime * 0.8));
                            fire = smoothstep(0.1, 0.9, fire * 0.6 + fire2 * 0.4);

                            float density = smoothstep(R_ISCO, R_ISCO + 1.8, rDisk)
                                          * (1.0 - smoothstep(7.0, R_OUTER, rDisk));

                            vec3 fireCol = mix(vec3(0.2, 0.0, 0.0), vec3(1.0, 0.35, 0.0), fire);
                            fireCol = mix(fireCol, vec3(1.0, 0.8, 0.3), pow(fire, 1.5));
                            fireCol *= 2.5;

                            // Disk temperature falls as T ∝ M^(-1/4), so a hole that
                            // grows must also redden: shift the blue-white end of the
                            // ramp toward orange and drop the bolometric brightness.
                            float cool = clamp(pow(max(uScale, 1.0), -0.25), 0.45, 1.0);
                            fireCol.g *= mix(0.72, 1.0, cool);
                            fireCol.b *= mix(0.30, 1.0, cool);
                            fireCol *= mix(0.62, 1.0, cool);

                            // Relativistic beaming. The ray marches camera→source,
                            // so the emitter→observer direction is -v and the Doppler
                            // factor is D = 1/(1 + beta·dot(v, diskVel)); flux ~ D^4.
                            vec3 diskVel = normalize(vec3(-p.z, 0.0, p.x));
                            float beta = sqrt(0.5 / rDisk);                    // v/c, circular orbit
                            float doppler = dot(v, diskVel) * beta;
                            float shift = pow(1.0 / clamp(1.0 + doppler, 0.35, 2.2), 4.0);

                            float alpha = fire * density * 0.85;
                            col += fireCol * shift * alpha * (1.0 - hitDisk);
                            hitDisk += alpha;
                            if(hitDisk >= 1.0) break;
                        }
                    }
                    prevY = p.y;
                }

                col *= 1.4;
                col = col / (1.0 + col);
                col = pow(col, vec3(1.0 / 2.2));

                float isBlackHole = 1.0 - smoothstep(R_PHOTON - 0.05, R_PHOTON + 0.12, minR);
                float fireAlpha = smoothstep(0.0, 0.1, dot(col, vec3(0.333)));
                float finalAlpha = max(fireAlpha, isBlackHole);

                float edgeDist = length((vUv - uCenter) * 2.0);
                finalAlpha *= 1.0 - smoothstep(0.7, 1.2, edgeDist * uScale);

                gl_FragColor = vec4(col, finalAlpha * uOpacity);
            }
        `;

        const material = new THREE.ShaderMaterial({
          vertexShader, fragmentShader, uniforms,
          transparent: true, depthWrite: false, depthTest: false
        });
        const geometry = new THREE.PlaneGeometry(2, 2);
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // ── Sequence timing (frames @ 60fps, advanced on a fixed timestep) ────
        const F_RUN = 780, F_HOLD = 260, F_COLLAPSE = 380, F_VOID = 80, F_FADE = 70;

        let phase = 'run';
        let phaseFrame = 0;
        let simFrame = 0;
        let blackHole = null;
        let elapsed = 0;
        // Separate clock for the disk. Schwarzschild geometry is self-similar in M,
        // so growing the hole is a uniform rescale — but orbital frequency goes as
        // Ω ∝ M⁻¹, so the disk must visibly slow by the same factor it grows.
        let diskClock = 0;
        let visible = true;
        let paused = false;
        let rafId = null;
        let lastTs = null;

        const targetMouse = new THREE.Vector2(0.5, 0.5);
        const currentMouse = new THREE.Vector2(0.5, 0.5);

        const setPhase = (next) => { phase = next; phaseFrame = 0; };

        // Off wipes both canvases and stops the loop outright — a genuinely clean
        // background, not a frozen frame. On replays the sequence from frame zero.
        simRef.current = (on) => {
          paused = !on;
          if (!on) {
            ctx.clearRect(0, 0, canvas2D.width, canvas2D.height);
            uniforms.uOpacity.value = 0;
            if (renderer) renderer.clear();
            return;
          }
          blackHole = null;
          simFrame = 0;
          elapsed = 0;
          diskClock = 0;
          setPhase('run');
          if (REDUCED_MOTION) { simFrame = F_RUN * 0.62; drawFrame(0); }
        };

        const spawnBlackHole = (event) => {
          const rect = canvas2D.getBoundingClientRect();
          if (!rect.width || !rect.height) return;
          let cx, cy;
          if (event) {
            const t = event.touches && event.touches[0];
            const clientX = t ? t.clientX : event.clientX;
            const clientY = t ? t.clientY : event.clientY;
            if (clientX === undefined || clientY === undefined) return;
            cx = clientX - rect.left;
            cy = clientY - rect.top;
          } else {
            cx = rect.width * 0.78;
            cy = rect.height * 0.72;
          }
          blackHole = { x: cx, y: cy, spin: Math.random() > 0.5 ? 1 : -1 };
          uniforms.uCenter.value.set(cx / rect.width, 1.0 - cy / rect.height);
          setPhase('collapse');
        };

        const onCanvasClick = (e) => {
          if (phase === 'run' || phase === 'hold') spawnBlackHole(e);
          else if (phase === 'void') { simFrame = 0; blackHole = null; setPhase('run'); }
        };

        const onPointerMove = (e) => {
          if (!visible) return;
          const rect = canvas2D.getBoundingClientRect();
          if (!rect.width || !rect.height) return;
          const t = e.touches && e.touches[0];
          const clientX = t ? t.clientX : e.clientX;
          const clientY = t ? t.clientY : e.clientY;
          if (clientX === undefined || clientY === undefined) return;
          targetMouse.x = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
          targetMouse.y = 1 - Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));
        };

        const resizeCanvas = () => {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const host = canvas2D.parentElement;
          const rect = host ? host.getBoundingClientRect() : { width: window.innerWidth, height: window.innerHeight };
          if (!rect.width || !rect.height) return;
          canvas2D.width = Math.round(rect.width * dpr);
          canvas2D.height = Math.round(rect.height * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);   // set, never accumulate
          if (renderer) renderer.setSize(rect.width, rect.height, false);
          uniforms.uResolution.value.set(rect.width, rect.height);
        };

        window.addEventListener('resize', resizeCanvas);
        let resizeObserver = null;
        if (typeof ResizeObserver !== 'undefined' && canvas2D.parentElement) {
          resizeObserver = new ResizeObserver(resizeCanvas);
          resizeObserver.observe(canvas2D.parentElement);
        }
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('touchmove', onPointerMove, { passive: true });
        canvas2D.addEventListener('click', onCanvasClick);
        resizeCanvas();

        let observer = null;
        if (typeof IntersectionObserver !== 'undefined') {
          observer = new IntersectionObserver(([entry]) => { visible = entry.isIntersecting; }, { threshold: 0 });
          observer.observe(canvas2D);
        }

        const darkTheme  = { base: [255, 255, 255], well: [110, 160, 255], alphaBase: 0.075, alphaGlow: 0.72, particleColor: '255, 255, 255' };
        const lightTheme = { base: [0, 0, 0],       well: [30, 70, 190],   alphaBase: 0.055, alphaGlow: 0.52, particleColor: '123, 31, 31' };

        // ── Spacetime sheet ──────────────────────────────────────────────────
        const xSteps = 52, zSteps = 40, spacingX = 104, spacingZ = 108;

        // ── Mass budget: baryonic gas is ~15% of the cluster mass ────────────
        // The "bullet" (index 1 / primary) is ~1/3 the main cluster's mass here —
        // the real ratio is ~1:10, but that would leave the bullet invisible.
        const DM1_MASS = 170, DM2_MASS = 480;
        const GAS1_MASS = 30, GAS2_MASS = 72;
        const MASS_NORM = DM2_MASS * 0.8;

        const particles = [];
        // Gas is a smooth hot plasma, so it is drawn as a diffuse glowing cloud
        // (see the gas pass in drawFrame), not as particles.
        const numDMParticles = 0, numGasParticles = 0, numStreamParticles = 0, numGalaxies = 130;

        // Random unit vector, and a random orbital plane (two orthonormal axes).
        const randUnit = () => {
          const z = Math.random() * 2 - 1, t = Math.random() * Math.PI * 2, s = Math.sqrt(1 - z * z);
          return [s * Math.cos(t), s * Math.sin(t), z];
        };
        const randPlane = () => {
          const a = randUnit();
          let b = randUnit();
          const d = a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
          b = [b[0] - d * a[0], b[1] - d * a[1], b[2] - d * a[2]];
          const n = Math.hypot(b[0], b[1], b[2]) || 1;
          return [a, [b[0] / n, b[1] / n, b[2] / n]];
        };

        // DM halos are pressure-supported, not rotating: each particle orbits in
        // its own randomly oriented plane (isotropic velocity dispersion), so the
        // halo is a roughly spherical, non-spinning cloud. Net spin is negligible.
        for (let i = 0; i < numDMParticles; i++) {
          const haloIdx = Math.floor(Math.random() * 2);
          const rFactor = Math.pow(Math.random(), 2.2);
          const [e1, e2] = randPlane();
          particles.push({
            type: 'halo_dm', haloIdx, rFactor, e1, e2,
            theta: Math.random() * Math.PI * 2,
            speed: 0.006 / (rFactor + 0.2),
            size: Math.random() * 5.0 + 1.6,
            baseAlpha: (1 - rFactor) * 0.9,
            isBlueTint: haloIdx === 0
          });
        }

        // Member galaxies are effectively collisionless too: they ride with the DM.
        for (let i = 0; i < numGalaxies; i++) {
          const haloIdx = Math.random() < 0.3 ? 0 : 1;   // most galaxies belong to the main cluster
          const rFactor = Math.pow(Math.random(), 1.5);
          const [e1, e2] = randPlane();
          particles.push({
            type: 'galaxy', haloIdx, rFactor, e1, e2,
            theta: Math.random() * Math.PI * 2,
            speed: 0.004 / (rFactor + 0.25),
            size: Math.random() * 4.0 + 5.0,
            tilt: Math.random() * Math.PI,
            aspect: Math.random() * 0.55 + 0.35,
            baseAlpha: Math.random() * 0.25 + 0.75
          });
        }


        for (let i = 0; i < numGasParticles; i++) {
          particles.push({
            type: 'gas_plasma', gasIdx: Math.floor(Math.random() * 2),
            rFactor: Math.pow(Math.random(), 1.6),
            theta: Math.random() * Math.PI * 2,
            turbSpeed: (Math.random() - 0.5) * 0.02,
            size: Math.random() * 6.0 + 1.8,
            baseAlpha: Math.random() * 0.85 + 0.15,
            colorVariant: Math.random()
          });
        }

        for (let i = 0; i < numStreamParticles; i++) {
          particles.push({
            type: 'stripped_gas',
            side: Math.random() > 0.5 ? 1 : -1,
            progress: Math.random(),
            speed: Math.random() * 0.0055 + 0.0018,
            spread: (Math.random() - 0.5) * 170,
            size: Math.random() * 4.0 + 1.0,
            baseAlpha: Math.random() * 0.6 + 0.2
          });
        }

        const drawFrame = (step) => {
          const rect = canvas2D.getBoundingClientRect();
          const w = rect.width, h = rect.height;
          if (!w || !h) return;

          // ── advance the state machine ──────────────────────────────────────
          phaseFrame += step;
          if (phase === 'run') {
            simFrame += step;
            if (simFrame >= F_RUN) { simFrame = F_RUN; setPhase('hold'); }
          } else if (phase === 'hold') {
            // No automatic black hole: the black hole is a click-only easter egg.
            // The observed configuration holds, then fades out and the loop restarts.
            if (phaseFrame >= F_HOLD) setPhase('void');
          } else if (phase === 'collapse') {
            if (phaseFrame >= F_COLLAPSE) { blackHole = null; setPhase('void'); }
          } else if (phase === 'void') {
            if (phaseFrame >= F_VOID) { simFrame = 0; setPhase('run'); }
          }

          const isDarkNow = isDarkRef.current;
          const theme = isDarkNow ? darkTheme : lightTheme;
          const collapseProgress = phase === 'collapse' ? Math.min(1, phaseFrame / F_COLLAPSE) : 0;
          const blackHoleRadius = blackHole ? Math.max(28, Math.min(52, Math.min(w, h) * 0.075)) : 0;

          // Re-emerge instead of dying: the sheet fades back in every cycle.
          const sceneAlpha = phase === 'void' ? 0
            : phase === 'run' ? Math.min(1, simFrame / F_FADE)
            : phase === 'hold' && !blackHole ? Math.max(0, Math.min(1, (F_HOLD - phaseFrame) / F_FADE))
            : 1;

          ctx.clearRect(0, 0, w, h);
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = sceneAlpha;
          if (sceneAlpha <= 0.001) { ctx.globalAlpha = 1; return; }

          const u = (simFrame / F_RUN) * 2 - 1;

          // Ram-pressure braking of the baryons (smooth sigmoid), and the small
          // gravitational deflection of both subclusters as they pass.
          const S = 1.0 / (1.0 + Math.exp(-8.0 * u));
          const deflection = 65 * Math.tanh(1.8 * u);

          // Collisionless DM (and galaxies) keep going; the gas is slowed, not
          // stopped — after the pass it lags its halo but still moves with it,
          // ending between the two DM peaks (as observed in 1E 0657-56).
          // The light bullet moves fast; the massive main cluster barely recoils.
          const primaryX = u * 1900;
          const secondaryX = -u * 750;
          const gasPos1 = primaryX * (1 - 0.55 * S);
          const gasPos2 = secondaryX * (1 - 0.55 * S);
          const z1 = -85 + deflection;
          const z2 = 95 - deflection * 0.85;

          const activeHalos = [
            { kind: 'dm',  x: primaryX,   z: z1, r: 470, mass: DM1_MASS,  color: isDarkNow ? {r: 80, g: 125, b: 235, a: 0.52} : {r: 45, g: 85, b: 200, a: 0.30} },
            { kind: 'dm',  x: secondaryX, z: z2, r: 820, mass: DM2_MASS,  color: isDarkNow ? {r: 80, g: 125, b: 235, a: 0.52} : {r: 45, g: 85, b: 200, a: 0.30} },
            { kind: 'gas', x: gasPos1,    z: z1, r: 260, mass: GAS1_MASS },
            { kind: 'gas', x: gasPos2,    z: z2, r: 420, mass: GAS2_MASS }
          ];

          const project = (x, y, z) => {
            const fov = 900;
            if (z < -800) return null;
            const sceneScale = w < 768 ? Math.min(0.5, w / 1200) : Math.min(0.29, w / 4300, h / 2500);
            const scale = (fov / (fov + z)) * sceneScale;
            return { sx: w / 2 + x * scale, sy: h * 0.52 - (z * 0.22) * scale + y * scale, scale, z };
          };

          const lens = (proj) => {
            if (!blackHole) return;
            const dx = blackHole.x - proj.sx, dy = blackHole.y - proj.sy;
            const distance = Math.hypot(dx, dy);
            const lensRange = Math.max(blackHoleRadius * 4, Math.hypot(w, h) * (0.12 + collapseProgress * 1.3));
            const local = Math.max(0, 1 - distance / lensRange) * Math.pow(collapseProgress, 1.35) * 0.94;
            const amount = Math.min(0.96, local + Math.pow(collapseProgress, 3) * 0.96);
            proj.sx += dx * amount - dy * amount * 0.22 * blackHole.spin;
            proj.sy += dy * amount + dx * amount * 0.22 * blackHole.spin;
          };

          const points = [];
          for (let xi = 0; xi < xSteps; xi++) {
            points[xi] = [];
            for (let zi = 0; zi < zSteps; zi++) {
              const x = (xi - xSteps / 2) * spacingX;
              const z = -600 + zi * spacingZ;
              let y = 0;
              for (let k = 0; k < activeHalos.length; k++) {
                const halo = activeHalos[k];
                const dx = x - halo.x, dz = z - halo.z;
                y += halo.mass * Math.exp(-(dx * dx + dz * dz) / (halo.r * halo.r));
              }
              const proj = project(x, y, z);
              if (proj) {
                lens(proj);
                // Glow tracks actual curvature depth, so the grid shows the
                // lensing peaks sitting on the DM, offset from the red gas.
                proj.intensity = Math.min(1, y / MASS_NORM);
                points[xi][zi] = proj;
              }
            }
          }

          ctx.globalCompositeOperation = isDarkNow ? 'screen' : 'multiply';
          activeHalos.filter(hl => hl.kind === 'dm').sort((a, b) => b.z - a.z).forEach(halo => {
            const proj = project(halo.x, halo.mass * 0.5, halo.z);
            if (!proj) return;
            let radius = halo.r * proj.scale * 1.8;
            if (radius <= 0) return;
            let opacity = halo.color.a;
            if (blackHole) {
              opacity *= Math.pow(1 - collapseProgress, 1.5);
              const dx = blackHole.x - proj.sx, dy = blackHole.y - proj.sy;
              const pull = Math.pow(collapseProgress, 1.6) * 0.96;
              proj.sx += dx * pull; proj.sy += dy * pull;
              radius *= Math.max(0.08, 1 - collapseProgress * 0.9);
            }
            const gradient = ctx.createRadialGradient(proj.sx, proj.sy, 0, proj.sx, proj.sy, radius);
            gradient.addColorStop(0, `rgba(${halo.color.r}, ${halo.color.g}, ${halo.color.b}, ${opacity})`);
            gradient.addColorStop(0.5, `rgba(${halo.color.r}, ${halo.color.g}, ${halo.color.b}, ${opacity * 0.55})`);
            gradient.addColorStop(1, `rgba(${halo.color.r}, ${halo.color.g}, ${halo.color.b}, 0)`);
            ctx.beginPath();
            ctx.arc(proj.sx, proj.sy, radius, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
          });

          ctx.globalCompositeOperation = 'source-over';
          ctx.lineWidth = 1;

          const drawSeg = (p1, p2) => {
            if (!p1 || !p2) return;
            const avgScale = (p1.scale + p2.scale) / 2;
            if (avgScale < 0.1) return;
            const alphaDepth = Math.max(0, Math.min(1, (avgScale - 0.15) * 2));
            if (alphaDepth <= 0.01) return;
            const t = (p1.intensity + p2.intensity) / 2;
            const r = Math.round(theme.base[0] + (theme.well[0] - theme.base[0]) * t);
            const g = Math.round(theme.base[1] + (theme.well[1] - theme.base[1]) * t);
            const b = Math.round(theme.base[2] + (theme.well[2] - theme.base[2]) * t);
            const a = (theme.alphaBase + (theme.alphaGlow - theme.alphaBase) * t) * alphaDepth;
            ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${a.toFixed(3)})`;
            ctx.beginPath();
            ctx.moveTo(p1.sx, p1.sy);
            ctx.lineTo(p2.sx, p2.sy);
            ctx.stroke();
          };

          for (let zi = zSteps - 2; zi >= 0; zi--) {
            for (let xi = 0; xi < xSteps; xi++) {
              if (xi < xSteps - 1) drawSeg(points[xi][zi], points[xi + 1][zi]);
              drawSeg(points[xi][zi], points[xi][zi + 1]);
            }
          }

          ctx.globalCompositeOperation = isDarkNow ? 'screen' : 'source-over';

          const shock = Math.exp(-6.0 * u * u);   // peaks at closest approach

          // ── X-ray gas: diffuse clouds. Core compressed at the leading edge (bow
          // shock), ram-pressure-stripped tail streaming behind. Pink, as in the
          // Chandra composite; DM is blue (lensing map), galaxies gold.
          const wellY = (x, z) => {
            let y = 0;
            for (let k = 0; k < activeHalos.length; k++) {
              const hl = activeHalos[k], dx = x - hl.x, dz = z - hl.z;
              y += hl.mass * Math.exp(-(dx * dx + dz * dz) / (hl.r * hl.r));
            }
            return y;
          };
          const gasRGB = isDarkNow ? '255, 70, 150' : '200, 30, 110';
          const gasA = isDarkNow ? 0.58 : 0.36;
          const blobs = [];
          // Main cluster gas: larger, fainter. The "bullet": smaller, denser, brighter.
          [[gasPos1, z1, 1, 220, 1.0], [gasPos2, z2, -1, 360, 0.8]].forEach(([gx, gz, lead, gr, br]) => {
            blobs.push({ x: gx + lead * 40 * shock, z: gz, r: gr * (1 - 0.15 * shock), a: gasA * br });
            for (let k = 1; k <= 2; k++) {
              blobs.push({ x: gx - lead * k * 120 * S, z: gz, r: gr * (1 - 0.2 * k), a: gasA * br * S * (0.45 - 0.15 * k) });
            }
          });
          blobs.forEach(b => {
            if (b.a <= 0.005) return;
            const proj = project(b.x, wellY(b.x, b.z) * 0.6, b.z);
            if (!proj) return;
            let rx = b.r * proj.scale * 1.6, a = b.a;
            if (blackHole) {
              a *= Math.pow(1 - collapseProgress, 1.5);
              const dx = blackHole.x - proj.sx, dy = blackHole.y - proj.sy;
              const pull = Math.pow(collapseProgress, 1.6) * 0.96;
              proj.sx += dx * pull; proj.sy += dy * pull;
              rx *= Math.max(0.08, 1 - collapseProgress * 0.9);
            }
            if (rx <= 0) return;
            ctx.save();
            ctx.translate(proj.sx, proj.sy);
            ctx.scale(1, 0.55);
            const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
            g.addColorStop(0, `rgba(${gasRGB}, ${a})`);
            g.addColorStop(0.55, `rgba(${gasRGB}, ${a * 0.45})`);
            g.addColorStop(1, `rgba(${gasRGB}, 0)`);
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(0, 0, rx, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          });

          // DM core pass, drawn over the gas: before the collision the gas sits
          // inside its halo and would otherwise hide the blue completely.
          activeHalos.filter(hl => hl.kind === 'dm').forEach(halo => {
            const proj = project(halo.x, halo.mass * 0.5, halo.z);
            if (!proj) return;
            let radius = halo.r * proj.scale * 0.95;
            let a = halo.color.a * 0.6;
            if (blackHole) {
              a *= Math.pow(1 - collapseProgress, 1.5);
              const dx = blackHole.x - proj.sx, dy = blackHole.y - proj.sy;
              const pull = Math.pow(collapseProgress, 1.6) * 0.96;
              proj.sx += dx * pull; proj.sy += dy * pull;
              radius *= Math.max(0.08, 1 - collapseProgress * 0.9);
            }
            if (radius <= 0) return;
            const c = `${halo.color.r}, ${halo.color.g}, ${halo.color.b}`;
            const g = ctx.createRadialGradient(proj.sx, proj.sy, 0, proj.sx, proj.sy, radius);
            g.addColorStop(0, `rgba(${c}, ${a})`);
            g.addColorStop(1, `rgba(${c}, 0)`);
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(proj.sx, proj.sy, radius, 0, Math.PI * 2);
            ctx.fill();
          });

          // Bow shock: a thin bright arc running ahead of the bullet's gas once it
          // has punched through the main cluster.
          const shockOn = S * Math.min(1, Math.max(0, u * 3));
          if (false && shockOn > 0.02) {
            const sx = gasPos1 + 260;
            const sp = project(sx, wellY(sx, z1) * 0.6, z1);
            if (sp) {
              let a = (isDarkNow ? 0.75 : 0.55) * shockOn;
              let rr = 300 * sp.scale * 1.6;
              if (blackHole) {
                a *= Math.pow(1 - collapseProgress, 1.5);
                const dx = blackHole.x - sp.sx, dy = blackHole.y - sp.sy;
                const pull = Math.pow(collapseProgress, 1.6) * 0.96;
                sp.sx += dx * pull; sp.sy += dy * pull;
                rr *= Math.max(0.08, 1 - collapseProgress * 0.9);
              }
              ctx.save();
              ctx.translate(sp.sx - rr, sp.sy);
              ctx.scale(1, 0.55);
              ctx.lineCap = 'round';
              [[5, 0.25], [1.6, 1]].forEach(([lw, k]) => {
                ctx.strokeStyle = `rgba(${isDarkNow ? '255, 190, 225' : '200, 30, 110'}, ${(a * k).toFixed(3)})`;
                ctx.lineWidth = lw;
                ctx.beginPath();
                ctx.arc(0, 0, rr, -0.85, 0.85);
                ctx.stroke();
              });
              ctx.restore();
            }
          }

          particles.forEach(p => {
            let worldX = 0, worldY = 0, worldZ = 0, customColor = null;

            if (p.type === 'halo_dm' || p.type === 'galaxy') {
              p.theta += p.speed * step;
              const halo = activeHalos[p.haloIdx];
              const r = p.rFactor * (halo.r * (p.type === 'galaxy' ? 0.9 : 0.65));
              const c = Math.cos(p.theta), s = Math.sin(p.theta);
              worldX = halo.x + r * (c * p.e1[0] + s * p.e2[0]);
              // Keep galaxies on the sheet: a large vertical offset makes them look
              // detached from the spacetime grid.
              worldY = r * (c * p.e1[1] + s * p.e2[1]) * (p.type === 'galaxy' ? 0.05 : 0.55);
              worldZ = halo.z + r * (c * p.e1[2] + s * p.e2[2]);
              if (p.type === 'galaxy') {
                customColor = isDarkNow ? '225, 235, 255' : '40, 60, 120';
              } else {
                customColor = isDarkNow ? '130, 175, 255' : '30, 70, 190';
              }

            } else if (p.type === 'gas_plasma') {
              p.theta += p.turbSpeed * step;
              const isPrimary = p.gasIdx === 0;
              const lead = isPrimary ? 1 : -1;      // direction of travel in x
              const r = p.rFactor * 340;
              // Bow shock: the leading hemisphere is compressed, the trailing
              // one is drawn out — the classic "bullet" cone.
              const nose = Math.tanh(3.0 * Math.cos(p.theta) * lead);
              const squash = 1 - shock * (0.45 * Math.max(0, nose) - 0.35 * Math.max(0, -nose));
              worldX = (isPrimary ? gasPos1 : gasPos2) + Math.cos(p.theta) * r * squash;
              worldZ = (isPrimary ? z1 : z2) + Math.sin(p.theta) * (r * 0.65) * (1 + 0.45 * shock);
              worldY = Math.sin(p.theta * 2 + elapsed * 1.2) * 25 * (1 - S * 0.5);
              if (isDarkNow) {
                customColor = p.colorVariant < 0.5 ? '255, 51, 75' : p.colorVariant < 0.8 ? '255, 105, 180' : '255, 175, 50';
              } else {
                customColor = p.colorVariant < 0.5 ? '180, 25, 45' : p.colorVariant < 0.8 ? '150, 40, 110' : '180, 90, 10';
              }

            } else {
              // Ram-pressure stripped plasma trails BEHIND the moving gas cloud,
              // i.e. opposite to its direction of travel.
              p.progress += p.speed * step;
              if (p.progress > 1) p.progress -= 1;
              const isPrimary = p.side > 0;
              const lead = isPrimary ? 1 : -1;
              const gasX = isPrimary ? gasPos1 : gasPos2;
              worldX = gasX - lead * (380 * S) * p.progress;
              worldZ = (isPrimary ? z1 : z2) + Math.sin(p.progress * Math.PI * 2 + elapsed * 0.6) * (p.spread * 0.4);
              worldY = Math.sin(p.progress * Math.PI) * 20 * S;
              customColor = isDarkNow ? '210, 140, 255' : '120, 55, 160';
            }

            for (let k = 0; k < activeHalos.length; k++) {
              const halo = activeHalos[k];
              const dx = worldX - halo.x, dz = worldZ - halo.z;
              worldY += halo.mass * Math.exp(-(dx * dx + dz * dz) / (halo.r * halo.r));
            }

            const proj = project(worldX, worldY, worldZ);
            if (!proj || proj.scale <= 0.05) return;

            const depthAlpha = Math.max(0, Math.min(1, (proj.scale - 0.1) * 2.5));
            let finalAlpha = p.baseAlpha * depthAlpha;
            if (p.type === 'stripped_gas') finalAlpha *= S * (1 - p.progress * 0.65);

            if (blackHole) {
              const dx = blackHole.x - proj.sx, dy = blackHole.y - proj.sy;
              const pull = Math.pow(collapseProgress, 1.6) * 0.96;
              const spiral = Math.sin(collapseProgress * Math.PI) * 0.12 * blackHole.spin;
              proj.sx += dx * pull - dy * spiral;
              proj.sy += dy * pull + dx * spiral;
              const d = Math.hypot(blackHole.x - proj.sx, blackHole.y - proj.sy);
              finalAlpha *= Math.max(0, Math.min(1, (d - blackHoleRadius) / 26));
            }

            if (finalAlpha > 0.01 && p.type === 'galaxy') {
              // Tiny tilted elliptical galaxy: bright core fading into a soft glow.
              const gr = Math.max(0.6, p.size * proj.scale * 1.6);
              ctx.save();
              ctx.translate(proj.sx, proj.sy);
              ctx.rotate(p.tilt);
              ctx.scale(1, p.aspect);
              const g = ctx.createRadialGradient(0, 0, 0, 0, 0, gr);
              g.addColorStop(0, `rgba(${isDarkNow ? '255, 255, 255' : '20, 30, 70'}, ${finalAlpha.toFixed(3)})`);
              g.addColorStop(0.25, `rgba(${customColor}, ${(finalAlpha * 0.8).toFixed(3)})`);
              g.addColorStop(1, `rgba(${customColor}, 0)`);
              ctx.fillStyle = g;
              ctx.beginPath();
              ctx.arc(0, 0, gr, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            } else if (finalAlpha > 0.01) {
              ctx.fillStyle = `rgba(${customColor || theme.particleColor}, ${finalAlpha.toFixed(3)})`;
              ctx.beginPath();
              ctx.arc(proj.sx, proj.sy, Math.max(0.1, p.size * proj.scale), 0, Math.PI * 2);
              ctx.fill();
            }
          });

          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = 'source-over';

          // ── accretion-disk shader pass (only while a black hole exists) ─────
          currentMouse.lerp(targetMouse, 0.05);
          uniforms.uMouse.value.copy(currentMouse);
          uniforms.uTime.value = diskClock;

          let opacity = 0;
          if (phase === 'collapse') {
            const fadeIn = Math.min(1, phaseFrame / 45);
            const fadeOut = 1 - Math.pow(Math.max(0, (collapseProgress - 0.8) / 0.2), 2);
            opacity = fadeIn * fadeOut;
            let s = 1;
            if (collapseProgress < 0.15) s = 0.01 + 0.99 * Math.pow(collapseProgress / 0.15, 0.5);
            else if (collapseProgress > 0.8) s = 1 + 8 * Math.pow((collapseProgress - 0.8) / 0.2, 2);
            uniforms.uScale.value = s;
          }
          uniforms.uOpacity.value = opacity;

          if (renderer) {
            if (opacity > 0.002) renderer.render(scene, camera);
            else renderer.clear();
          }
        };

        // Fixed timestep: identical pacing on 60 Hz and 120 Hz+ displays.
        const tick = (ts) => {
          rafId = requestAnimationFrame(tick);
          if (lastTs === null) lastTs = ts;
          const dt = ts - lastTs;
          lastTs = ts;
          if (!visible || paused) return;
          const step = Math.max(0, Math.min(3, dt / 16.667));
          elapsed += step / 60;
          // Mass grows as uScale, so proper-time at fixed r/M dilates by the same factor.
          diskClock += (step / 60) / Math.max(0.25, uniforms.uScale.value);
          drawFrame(step);
        };

        if (REDUCED_MOTION) {
          // One static frame at the moment of closest approach — the offset is
          // the informative part, and nothing moves.
          setTimeout(() => { simFrame = F_RUN * 0.62; drawFrame(0); }, 60);
        } else {
          rafId = requestAnimationFrame(tick);
        }

        return () => {
          window.removeEventListener('resize', resizeCanvas);
          window.removeEventListener('mousemove', onPointerMove);
          window.removeEventListener('touchmove', onPointerMove);
          canvas2D.removeEventListener('click', onCanvasClick);
          if (observer) observer.disconnect();
          if (resizeObserver) resizeObserver.disconnect();
          if (rafId) cancelAnimationFrame(rafId);
          geometry.dispose();
          material.dispose();
          if (renderer) renderer.dispose();
          simRef.current = null;
        };
      }, []);

      return (
        <div className="absolute inset-0 w-full h-full z-0 overflow-hidden">
          <canvas ref={canvas2DRef} className="absolute inset-0 w-full h-full z-0 cursor-crosshair" style={{ display: simOn ? 'block' : 'none' }} />
          <canvas ref={canvas3DRef} className="absolute inset-0 w-full h-full z-10 pointer-events-none" style={{ display: simOn ? 'block' : 'none' }} />
          <button
            type="button"
            onClick={() => { const next = !simOn; setSimOn(next); if (simRef.current) simRef.current(next); }}
            aria-label={simOn ? 'Hide the background simulation' : 'Show the background simulation'}
            title={simOn ? 'Hide simulation' : 'Show simulation'}
            className={`absolute bottom-6 right-6 z-30 flex h-9 w-9 items-center justify-center rounded-full border backdrop-blur-md transition-colors ${isDark ? 'border-white/[0.12] bg-white/[0.04] text-zinc-400 hover:border-glowred/40 hover:text-glowred' : 'border-stone-300 bg-cream-50/80 text-stone-500 hover:border-darkred-700/40 hover:text-darkred-700'}`}
          >
            <i className={`fa-solid ${simOn ? 'fa-eye-slash' : 'fa-eye'} text-[11px]`}></i>
          </button>
        </div>
      );
    };

    function App() {
      // Theme: remember the visitor's choice, otherwise follow the OS setting.
      const [isDark, setIsDark] = useState(() => {
        try {
          const saved = localStorage.getItem('sg-theme');
          if (saved === 'dark') return true;
          if (saved === 'light') return false;
        } catch (err) { /* storage blocked — fall through to the OS preference */ }
        return typeof window !== 'undefined' && window.matchMedia
          ? window.matchMedia('(prefers-color-scheme: dark)').matches
          : false;
      });
      const [activeResearch, setActiveResearch] = useState(researchInterests[0].id);
      const [isScrolled, setIsScrolled] = useState(false);
      const [activeTab, setActiveTab] = useState('experience');
      const [showAllPubs, setShowAllPubs] = useState(false);
      const [activeActivityTab, setActiveActivityTab] = useState('conferences');
      const [currentPage, setCurrentPage] = useState('home');
      const [selectedImage, setSelectedImage] = useState(null);
      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const [activeSection, setActiveSection] = useState('');

      useEffect(() => {
        document.documentElement.classList.toggle('light-mode', !isDark);
        try { localStorage.setItem('sg-theme', isDark ? 'dark' : 'light'); } catch (err) {}
      }, [isDark]);
      useEffect(() => { const handleScroll = () => setIsScrolled(window.scrollY > 20); window.addEventListener('scroll', handleScroll); return () => window.removeEventListener('scroll', handleScroll); }, []);
      useEffect(() => { document.body.classList.toggle('modal-open', !!selectedImage); }, [selectedImage]);

      useEffect(() => {
        if (currentPage !== 'home') { setActiveSection(''); return; }
        const ids = ['about', 'research', 'experience', 'publications'];
        const onScroll = () => {
          let current = '';
          ids.forEach((id) => {
            const el = document.getElementById(id);
            if (!el) return;
            const r = el.getBoundingClientRect();
            if (r.top <= 140 && r.bottom > 140) current = id;
          });
          if (window.scrollY > 0 && window.innerHeight + window.scrollY >= document.body.scrollHeight - 140) current = 'contact';
          setActiveSection(current);
        };
        onScroll();
        const settle = [
          requestAnimationFrame(onScroll),
          setTimeout(onScroll, 300),
          setTimeout(onScroll, 1200)
        ];
        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', onScroll);
        return () => {
          cancelAnimationFrame(settle[0]);
          clearTimeout(settle[1]);
          clearTimeout(settle[2]);
          window.removeEventListener('scroll', onScroll);
          window.removeEventListener('resize', onScroll);
        };
      }, [currentPage]);

      useEffect(() => { revealWatch.poke(); }, [currentPage, activeTab, activeActivityTab]);

      useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') { setSelectedImage(null); setIsMenuOpen(false); } };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const scrollToSection = (id, smooth = true) => {
        const el = document.getElementById(id);
        if (!el) return;
        const top = el.getBoundingClientRect().top + window.pageYOffset - 88;
        window.scrollTo({ top: Math.max(0, top), behavior: (smooth && !PREFERS_REDUCED) ? 'smooth' : 'auto' });
      };

      const navigateTo = (e, page, sectionId = null) => {
        e.preventDefault();
        setIsMenuOpen(false);
        const samePage = page === currentPage;
        // Smooth-scrolling a freshly mounted page drags the viewport through
        // content that is still revealing. Switching pages jumps; only in-page
        // section links glide.
        if (!samePage) window.scrollTo({ top: 0, behavior: 'auto' });
        setCurrentPage(page);
        if (sectionId) requestAnimationFrame(() => requestAnimationFrame(() => scrollToSection(sectionId, samePage)));
      };

      // Public link to the CV PDF - change this one line to point at a different file.
      const CV_URL = 'https://drive.google.com/file/d/1XQFkfO7Gb5jlXbPiDx33wJVImo8H8KnD/view?usp=sharing';

      const navItems = [
        { label: 'About', page: 'home', section: 'about' },
        { label: 'Research', page: 'home', section: 'research' },
        { label: 'Education', page: 'home', section: 'experience' },
        { label: 'Publications', page: 'home', section: 'publications' },
        { label: 'Activities', page: 'activities', section: null },
        { label: 'Gallery', page: 'blog', section: null },
        { label: 'Resources', page: 'resources', section: null },
        { label: 'Contact', page: null, section: 'contact' }
      ];

      const SectionHeader = ({ eyebrow, title, delay = 0, align = 'left', instant = false }) => (
        <Reveal delay={delay} instant={instant}>
          <div className={align === 'center' ? 'text-center' : ''}>
            <p className={`eyebrow mb-3 ${isDark ? 'text-glowred' : 'text-darkred-700'}`}>{eyebrow}</p>
            <h2 className={`text-3xl font-semibold tracking-tight ${isDark ? 'text-zinc-100' : 'text-stone-900'}`}>{title}</h2>
            <span className={`section-rule ${align === 'center' ? 'mx-auto' : ''}`}></span>
          </div>
        </Reveal>
      );

      const TabBtn = ({ label, icon, value, state, setState }) => (
        <button onClick={() => setState(value)} className={`tab-underline flex items-center gap-2 text-sm font-medium transition-all ${state === value ? (isDark ? 'is-active text-glowred' : 'is-active text-darkred-800') : (isDark ? 'text-zinc-500 hover:text-zinc-300' : 'text-stone-400 hover:text-stone-700')}`}>
          <i className={`fa-solid ${icon} text-xs`}></i> {label}
        </button>
      );

      const ActivityCard = ({ item, index }) => (
        <Reveal instant>
          <article className={`group card-lift rounded-xl border p-5 ${isDark ? 'bg-white/[0.015] border-white/[0.06] hover:bg-white/[0.03] hover:border-glowred/30' : 'bg-cream-50 border-stone-200 hover:border-darkred-300 hover:translate-x-1'}`}>
            <div className="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
              <div className="min-w-0">
                <p className={`eyebrow mb-2 ${isDark ? 'text-glowred' : 'text-darkred-600'}`}>{item.type}</p>
                <h3 className={`text-base font-semibold leading-snug transition-colors ${isDark ? 'text-white group-hover:text-glowred' : 'text-stone-900 group-hover:text-darkred-800'}`}>{item.title}</h3>
              </div>
              <span className={`shrink-0 text-xs font-medium ${isDark ? 'text-zinc-500' : 'text-stone-400'}`}>{item.date}</span>
            </div>
            <p className={`mt-3 border-t pt-3 text-sm leading-relaxed ${isDark ? 'border-white/[0.06] text-zinc-400' : 'border-stone-100 text-stone-500'}`}>{item.details}</p>
          </article>
        </Reveal>
      );

      return (
        <div className={`min-h-screen transition-colors duration-450 ${isDark ? 'bg-cosmic-void text-zinc-300 selection:bg-glowred-soft selection:text-white' : 'bg-cream text-stone-800 selection:bg-darkred-200 selection:text-darkred-950'}`}>

          <nav className={`fixed w-full z-50 transition-all duration-300 ${isScrolled ? (isDark ? 'nav-surface bg-cosmic-void/80 backdrop-blur-lg shadow-xl border-b border-white/[0.05] py-3' : 'nav-surface bg-cream/95 backdrop-blur-md shadow-sm border-b border-stone-200/70 py-3') : 'bg-transparent py-5'}`}>
            <div className="max-w-5xl mx-auto px-6 flex justify-between items-center">
              
              <a href="#" onClick={(e) => navigateTo(e, 'home')} className="flex items-center gap-3 group">
                <div className="leading-tight">
                  <div className={`font-display font-semibold text-sm ${isDark ? 'text-zinc-100' : 'text-stone-900'}`}>Dr. Shivam Gola</div>
                  <div className={`text-xs ${isDark ? 'text-zinc-400' : 'text-stone-500'}`}>Postdoctoral Fellow</div>
                </div>
              </a>

              <div className="flex items-center gap-6">
                
                <div className={`hidden lg:flex items-center gap-6 text-xs font-medium tracking-wide ${isDark ? 'text-zinc-400' : 'text-stone-500'}`}>
                  {navItems.map(({ label, page, section }) => {
                    const isActive = page === null
                      ? activeSection === 'contact'
                      : page === 'home'
                        ? currentPage === 'home' && activeSection === section
                        : currentPage === page;
                    return (
                      <a
                        key={label}
                        href={section ? `#${section}` : '#'}
                        aria-current={isActive ? 'page' : undefined}
                        onClick={(e) => { if (page === null) { e.preventDefault(); setIsMenuOpen(false); scrollToSection('contact'); } else { navigateTo(e, page, section); } }}
                        className={`nav-link transition-colors ${isActive ? (isDark ? 'text-glowred active' : 'text-darkred-700 active') : (isDark ? 'hover:text-white' : 'hover:text-stone-900')}`}
                      >{label}</a>
                    );
                  })}
                </div>

                <button type="button" onClick={() => setIsMenuOpen(!isMenuOpen)} aria-label="Toggle navigation" aria-expanded={isMenuOpen} className={`lg:hidden w-9 h-9 rounded-full border transition-colors ${isDark ? 'border-white/[0.12] text-zinc-200 hover:border-glowred/60' : 'border-stone-300 text-stone-700 hover:border-darkred-400'}`}>

                </section>

                {resourceGroups.map((group) => (
                  <section key={group.heading} aria-label={group.heading} className="mb-14 last:mb-0">
                    <h2 className={`eyebrow mb-5 flex items-center gap-2 ${isDark ? 'text-glowred' : 'text-darkred-700'}`}>
                      <i className={`fa-solid ${group.icon} text-[11px]`}></i> {group.heading}
                    </h2>
                    <div className="grid gap-4">
                      {group.items.map((item) => (
                        <Reveal key={item.url} instant>
                          <a
                            href={item.url}
                            target="_blank"
                            rel="noopener noreferrer"
                            className={`group card-lift block rounded-xl border p-5 ${isDark ? 'bg-white/[0.015] border-white/[0.06] hover:bg-white/[0.03] hover:border-glowred/30' : 'bg-cream-50 border-stone-200 hover:border-darkred-300'}`}
                          >
                            <div className="flex flex-col gap-1 sm:flex-row sm:items-baseline sm:justify-between sm:gap-4">
                              <h3 className={`flex items-center gap-2 text-base font-semibold leading-snug transition-colors ${isDark ? 'text-white group-hover:text-glowred' : 'text-stone-900 group-hover:text-darkred-800'}`}>
                                {item.title}
                                <i className="fa-solid fa-arrow-up-right-from-square text-[9px] opacity-60"></i>
                              </h3>
                              <span className={`shrink-0 text-xs font-medium ${isDark ? 'text-zinc-400' : 'text-stone-500'}`}>{item.by}</span>
                            </div>
                            <p className={`mt-3 border-t pt-3 text-sm leading-relaxed ${isDark ? 'border-white/[0.06] text-zinc-400' : 'border-stone-100 text-stone-500'}`}>{item.note}</p>
                          </a>
                        </Reveal>
                      ))}
                    </div>
                  </section>
                ))}
              </div>
            </div>
          )}

          {currentPage === 'blog' && (
            <div className={`pt-28 pb-16 min-h-screen animate-fade-in ${isDark ? 'bg-cosmic-void' : 'bg-cream'}`}>
              <div className="max-w-5xl mx-auto px-6">
                <div className="mb-12"><SectionHeader instant eyebrow="Gallery" title="Travel & Photography" /><p className={`text-xs mt-4 ${isDark ? 'text-zinc-500' : 'text-stone-400'}`}>Memories from various trips and places.</p></div>

                <div className="grid grid-cols-1 gap-10">
                  {blogPosts.map((post, idx) => (
                    <Reveal key={post.id} instant>
                      <div className={`rounded-xl border overflow-hidden transition-all duration-300 ${isDark ? 'bg-white/[0.01] border-white/[0.05] hover:border-white/[0.1]' : 'bg-cream-50 border-stone-200 hover:border-stone-300'}`}>
                        {post.images && post.images.length > 0 && (
                          <div className={`p-6 md:p-8 border-b ${isDark ? 'bg-white/[0.01] border-white/[0.04]' : 'bg-stone-100/80'}`}>
                            <div className={`grid gap-4 ${post.images.length === 1 ? 'grid-cols-1 max-w-2xl mx-auto' : post.images.length === 2 ? 'grid-cols-2' : 'grid-cols-2 sm:grid-cols-3'}`}>
                              {post.images.map((imgUrl, index) => {
                                const rotations = ['rotate-[-1deg]', 'rotate-[1deg]', 'rotate-[-0.5deg]', 'rotate-[0.5deg]'];
                                const rotClass = post.images.length > 1 ? rotations[index % 4] : '';
                                return (
                                  <div key={index} className={`relative aspect-[4/3] overflow-hidden rounded-lg shadow-md cursor-pointer group/img transition-all duration-500 hover:z-20 hover:scale-[1.03] hover:rotate-0 border-2 ${isDark ? 'bg-zinc-900 border-white/10' : 'bg-stone-200 border-white'} ${rotClass}`} onClick={() => setSelectedImage(imgUrl)}>
                                    <img src={imgUrl} alt={`${post.title} ${index + 1}`} className="w-full h-full object-cover transition-transform duration-500 group-hover/img:scale-105" onError={(e) => { if (!e.target.dataset.fallbackTriggered) { e.target.dataset.fallbackTriggered = "true"; e.target.src = "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=800&q=80"; }}} />
                                    <div className="absolute inset-0 bg-cosmic-void/0 group-hover/img:bg-cosmic-void/30 transition-all duration-300 flex items-center justify-center"><div className={`w-8 h-8 rounded-full backdrop-blur-md flex items-center justify-center opacity-0 group-hover/img:opacity-100 transition-all duration-300 ${isDark ? 'bg-white/10' : 'bg-white/20'}`}><i className="fa-solid fa-expand text-white text-xs drop-shadow"></i></div></div>
                                  </div>
                                );
                              })}
                            </div>
                          </div>
                        )}
                        <div className="p-6 md:p-8 bg-white/[0.005]">
                          <div className="flex items-center gap-2 mb-2"><span className={`eyebrow ${isDark ? 'text-glowred' : 'text-darkred-600'}`}>{post.type}</span><span className={`text-xs ${isDark ? 'text-white/[0.1]' : 'text-stone-300'}`}>·</span><span className={`text-xs ${isDark ? 'text-zinc-500' : 'text-stone-400'}`}>{post.date}</span></div>
                          <h3 className={`text-lg font-semibold ${isDark ? 'text-white' : 'text-stone-900'}`}>{post.title}</h3>
                          {post.content && post.content.trim() !== "" && <p className={`text-sm leading-relaxed mt-2 ${isDark ? 'text-zinc-400' : 'text-stone-400'}`}>{post.content}</p>}
                        </div>
                      </div>
                    </Reveal>
                  ))}
                </div>
              </div>
            </div>
          )}

          {selectedImage && (
            <div className={`fixed inset-0 z-[100] flex items-center justify-center backdrop-blur-md p-4 md:p-12 animate-fade-in-modal cursor-zoom-out ${isDark ? 'bg-black/95' : 'bg-stone-950/97'}`} onClick={() => setSelectedImage(null)}>
              <button className="absolute top-4 right-4 md:top-6 md:right-6 text-zinc-400 hover:text-white z-10 w-9 h-9 flex items-center justify-center rounded-full bg-white/5 hover:bg-glowred transition-all duration-200" onClick={() => setSelectedImage(null)}><i className="fa-solid fa-xmark text-xs"></i></button>
              <img src={selectedImage} alt="Expanded view" className="max-w-full max-h-full rounded-lg shadow-2xl object-contain animate-scale-up-modal cursor-default border border-white/10" onClick={(e) => e.stopPropagation()} onError={(e) => { if (!e.target.dataset.fallbackTriggered) { e.target.dataset.fallbackTriggered = "true"; e.target.src = "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1600&q=80"; }}} />
            </div>
          )}

          <footer id="contact" className={`transition-colors duration-450 py-14 border-t-2 ${isDark ? 'bg-cosmic-dust text-zinc-400 border-glowred/30 shadow-inner' : 'bg-darkred-700 text-darkred-100 border-darkred-900/50'}`}>
            <div className="max-w-5xl mx-auto px-6">
              <Reveal instant>
                <div>
                  <p className={`eyebrow mb-4 ${isDark ? 'text-zinc-600' : 'text-darkred-300'}`}>Contact</p>
                  <h2 className="font-display text-2xl font-semibold text-white mb-6">Get in Touch</h2>
                  <div className="flex flex-col gap-4">
                    <a href="mailto:shivamg.phy@gmail.com" className="flex items-center gap-3 text-sm transition-colors group hover:text-white">
                      <div className={`w-8 h-8 rounded-full border flex items-center justify-center transition-all shrink-0 ${isDark ? 'bg-white/[0.03] border-white/[0.08] group-hover:bg-glowred group-hover:border-glowred/40' : 'bg-white/10 border-white/20 group-hover:bg-darkred-900 group-hover:border-darkred-950'}`}>
                        <i className={`fa-solid fa-envelope text-xs group-hover:text-white ${isDark ? 'text-zinc-400' : 'text-darkred-100'}`}></i>
                      </div>
                      shivamg.phy@gmail.com
                    </a>
                    <div className="flex items-center gap-3 text-sm cursor-default">
                      <div className={`w-8 h-8 rounded-full border flex items-center justify-center shrink-0 ${isDark ? 'bg-white/[0.03] border-white/[0.08]' : 'bg-white/10 border-white/20'}`}>
                        <i className={`fa-solid fa-location-dot text-xs ${isDark ? 'text-zinc-400' : 'text-darkred-100'}`}></i>
                      </div>
                      IIT Bombay, Mumbai, Maharashtra 400076
                    </div>
                  </div>
                </div>
              </Reveal>
            </div>
            <Reveal instant>
              <div className={`max-w-5xl mx-auto px-6 mt-10 pt-6 border-t text-xs flex flex-col sm:flex-row justify-between items-center gap-4 ${isDark ? 'border-white/[0.05] text-zinc-600' : 'border-white/10 text-darkred-200'}`}>
                <p>© 2026 Dr. Shivam Gola. </p>
                <div className="flex gap-5">
                  <a href="https://inspirehep.net/authors/1867679" target="_blank" rel="noopener noreferrer" className={`transition-colors ${isDark ? 'hover:text-white' : 'hover:text-white'}`}>iNSPIRE-HEP</a>
                  <a href="https://arxiv.org/search/?query=%22Shivam+Gola%22&searchtype=author" target="_blank" rel="noopener noreferrer" className={`transition-colors ${isDark ? 'hover:text-white' : 'hover:text-white'}`}>arXiv</a>
                  <a href="https://scholar.google.com/scholar?q=%22Shivam+Gola%22" target="_blank" rel="noopener noreferrer" className={`transition-colors ${isDark ? 'hover:text-white' : 'hover:text-white'}`}>Google Scholar</a>
                </div>
              </div>
            </Reveal>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
