    /* ── REVEAL COMPONENT ── */
    const Reveal = ({ children, delay = 0, className = "" }) => {
      const ref = useRef(null);
      const [isVisible, setIsVisible] = useState(false);
      useEffect(() => {
        const fallbackTimer = setTimeout(() => setIsVisible(true), 600 + delay);
        const observer = new IntersectionObserver(
          ([entry]) => { 
            if (entry.isIntersecting) { 
              setIsVisible(true); 
              clearTimeout(fallbackTimer); 
              observer.unobserve(entry.target); 
            } 
          },
          { threshold: 0.05 }
        );
        if (ref.current) observer.observe(ref.current);
        return () => { 
          clearTimeout(fallbackTimer); 
          if (ref.current) observer.unobserve(ref.current); 
        };
      }, [delay]);
      return (
        <div ref={ref} className={`transition-all duration-700 ease-out ${isVisible ? "opacity-100 translate-y-0" : "opacity-0 translate-y-8"} ${className}`} style={{ transitionDelay: `${delay}ms` }}>
          {children}
        </div>
      );
    };

    /* ── STREAMING_CHUNK:Building the dynamic multi-directional collision simulation... ── */
    const ParticleBackground = ({ isDark }) => {
      const canvasRef = useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        const resizeCanvas = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];
        let decayProducts = [];
        let smashEvents = [];

        // Dynamic palettes mapping dark/light themes
        const darkColors = {
          hadronA: '#FF334B',     // Glowing Crimson
          hadronB: '#FF6200',     // Orange
          decayLepton: '#00F0FF',  // Electric Cyan
          decayHiggs: '#FFD700',   // Gold
          decayBSM: '#AE3FFF',     // Violet Dark Matter traces
        };

        const lightColors = {
          hadronA: '#7B1F1F',     // Deep Brick Red
          hadronB: '#c04040',     // Rose Red
          decayLepton: '#10b981',  // Emerald Green
          decayHiggs: '#c9a63e',   // Amber Gold
          decayBSM: '#8b5cf6',     // Soft Purple
        };

        const colors = isDark ? darkColors : lightColors;

        // Incoming high-speed reactant particles entering from random borders
        class ColliderParticle {
          constructor() {
            const edge = Math.floor(Math.random() * 4);
            if (edge === 0) { // Top
              this.x = Math.random() * canvas.width;
              this.y = -20;
            } else if (edge === 1) { // Right
              this.x = canvas.width + 20;
              this.y = Math.random() * canvas.height;
            } else if (edge === 2) { // Bottom
              this.x = Math.random() * canvas.width;
              this.y = canvas.height + 20;
            } else { // Left
              this.x = -20;
              this.y = Math.random() * canvas.height;
            }

            const targetX = canvas.width * 0.3 + Math.random() * (canvas.width * 0.4);
            const targetY = canvas.height * 0.35 + Math.random() * (canvas.height * 0.3);
            
            const dx = targetX - this.x;
            const dy = targetY - this.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            const speed = 6 + Math.random() * 7;
            this.vx = (dx / distance) * speed;
            this.vy = (dy / distance) * speed;
            this.radius = Math.random() * 1.5 + 2.0;
            this.color = Math.random() > 0.5 ? colors.hadronA : colors.hadronB;
          }

          update() {
            this.x += this.vx;
            this.y += this.vy;
          }

          draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            if (isDark) {
              ctx.shadowBlur = 10;
              ctx.shadowColor = this.color;
            }
            ctx.fill();
            ctx.shadowBlur = 0;
          }
        }

        // Curved decay tracks inside a magnetic field
        class DecayTrace {
          constructor(x, y, isSuper = false) {
            this.x = x;
            this.y = y;
            this.history = [];
            
            const angle = Math.random() * Math.PI * 2;
            const speed = isSuper ? (Math.random() * 8 + 3.5) : (Math.random() * 4.5 + 1.5);
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            
            this.curve = (Math.random() - 0.5) * 0.12;
            this.life = 1.0;
            this.decay = Math.random() * 0.018 + 0.005;

            const rand = Math.random();
            if (rand < 0.12) {
              this.color = colors.decayHiggs;
              this.style = 'dashed'; 
            } else if (rand < 0.3) {
              this.color = colors.decayBSM;
              this.style = 'wave';   
            } else if (rand < 0.55) {
              this.color = colors.decayLepton;
              this.style = 'continuous'; 
            } else {
              this.color = colors.hadronA;
              this.style = 'continuous'; 
            }
          }

          update() {
            this.history.push({ x: this.x, y: this.y });
            if (this.history.length > 25) this.history.shift();

            const currentSpeed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
            const currentAngle = Math.atan2(this.vy, this.vx) + this.curve;
            this.vx = Math.cos(currentAngle) * currentSpeed * 0.98; 
            this.vy = Math.sin(currentAngle) * currentSpeed * 0.98;

            this.x += this.vx;
            this.y += this.vy;
            this.life -= this.decay;
          }

          draw() {
            if (this.history.length < 2) return;
            ctx.beginPath();
            ctx.moveTo(this.history[0].x, this.history[0].y);
            for (let i = 1; i < this.history.length; i++) {
              ctx.lineTo(this.history[i].x, this.history[i].y);
            }

            ctx.strokeStyle = this.color;
            ctx.lineWidth = this.style === 'dashed' ? 1.8 : 1.2;
            ctx.globalAlpha = this.life;
            if (isDark) {
              ctx.shadowBlur = this.style === 'wave' ? 8 : 4;
              ctx.shadowColor = this.color;
            }

            if (this.style === 'dashed') {
              ctx.setLineDash([4, 4]);
            } else {
              ctx.setLineDash([]);
            }

            ctx.stroke();
            ctx.setLineDash([]);
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1.0;
          }
        }

        const smash = (x, y, isSuper = false) => {
          smashEvents.push({
            x, y,
            radius: 1,
            maxRadius: isSuper ? 75 : 30,
            alpha: 1.0,
            color: isSuper ? colors.decayBSM : colors.hadronA
          });

          const count = isSuper ? 48 : 15;
          for (let i = 0; i < count; i++) {
            decayProducts.push(new DecayTrace(x, y, isSuper));
          }
        };

        const handleParentClick = (e) => {
          if (e.target.closest('a') || e.target.closest('button')) return;
          const rect = canvas.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          smash(x, y, true);
        };

        const parent = canvas.parentElement;
        if (parent) parent.addEventListener('click', handleParentClick);

        let spawnRate = 18;

        const animate = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          if (Math.random() * 100 < spawnRate) {
            particles.push(new ColliderParticle());
          }

          particles = particles.filter(p => {
            p.update();
            p.draw();
            return p.x > -50 && p.x < canvas.width + 50 && p.y > -50 && p.y < canvas.height + 50;
          });

          for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
              const p1 = particles[i];
              const p2 = particles[j];
              const dx = p1.x - p2.x;
              const dy = p1.y - p2.y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              if (dist < 15) {
                smash((p1.x + p2.x) / 2, (p1.y + p2.y) / 2, Math.random() < 0.22);
                particles.splice(j, 1);
                particles.splice(i, 1);
                i--;
                break;
              }
            }
          }

          smashEvents = smashEvents.filter(event => {
            ctx.beginPath();
            ctx.arc(event.x, event.y, event.radius, 0, Math.PI * 2);
            ctx.strokeStyle = event.color;
            ctx.globalAlpha = event.alpha;
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(event.x, event.y, event.radius * 0.4, 0, Math.PI * 2);
            ctx.fillStyle = isDark ? `rgba(255, 255, 255, ${event.alpha * 0.8})` : `rgba(123, 31, 31, ${event.alpha * 0.8})`;
            ctx.fill();

            event.radius += 2.5;
            event.alpha -= 0.035;
            ctx.globalAlpha = 1.0;
            return event.alpha > 0;
          });

          decayProducts = decayProducts.filter(trace => {
            trace.update();
            trace.draw();
            return trace.life > 0;
          });

          animationFrameId = requestAnimationFrame(animate);
        };

        animate();

        return () => {
          window.removeEventListener('resize', resizeCanvas);
          if (parent) parent.removeEventListener('click', handleParentClick);
          cancelAnimationFrame(animationFrameId);
        };
      }, [isDark]);

      return <canvas ref={canvasRef} className={`absolute inset-0 z-0 pointer-events-none transition-opacity duration-500 ${isDark ? 'opacity-55' : 'opacity-40'}`} />;
    };

    /* ── STREAMING_CHUNK:Initializing main application state and active theme hooks... ── */
    function App() {
      const [isDark, setIsDark] = useState(true);
      const [activeResearch, setActiveResearch] = useState(researchInterests[0].id);
      const [isScrolled, setIsScrolled] = useState(false);
      const [activeTab, setActiveTab] = useState('experience');
      const [activeActivityTab, setActiveActivityTab] = useState('conferences');
      const [currentPage, setCurrentPage] = useState('home');
      const [selectedImage, setSelectedImage] = useState(null);

      // Effect to monitor document body background and theme class
      useEffect(() => {
        if (isDark) {
          document.documentElement.classList.remove('light-mode');
        } else {
          document.documentElement.classList.add('light-mode');
        }
      }, [isDark]);

      useEffect(() => {
        const handleScroll = () => setIsScrolled(window.scrollY > 20);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      useEffect(() => {
        document.body.classList.toggle('modal-open', !!selectedImage);
      }, [selectedImage]);

          {/* ══ GALLERY PAGE ══ */}
          {currentPage === 'blog' && (
            <div className={`pt-28 pb-16 min-h-screen animate-fade-in ${isDark ? 'bg-cosmic-void' : 'bg-cream'}`}>
              <div className="max-w-5xl mx-auto px-6">

                <div className="mb-12">
                  <SectionHeader eyebrow="Gallery" title="Travel & Field Photography" />
                  <p className={`text-xs mt-4 ${isDark ? 'text-zinc-500' : 'text-stone-400'}`}>Memories from various trips and places.</p>
                </div>

                <div className="grid grid-cols-1 gap-10">
                  {blogPosts.map((post, idx) => (
                    <Reveal key={post.id} delay={idx * 100}>
                      <div className={`rounded-2xl border overflow-hidden transition-all duration-300 ${
                        isDark ? 'bg-white/[0.01] border-white/[0.05] hover:border-white/[0.1]' : 'bg-cream-50 border-stone-200 hover:border-stone-300'
                      }`}>

                        {post.images && post.images.length > 0 && (
                          <div className={`p-6 md:p-8 border-b ${isDark ? 'bg-white/[0.01] border-white/[0.04]' : 'bg-stone-100/80'}`}>
                            <div className={`grid gap-4 ${
                              post.images.length === 1 ? 'grid-cols-1 max-w-2xl mx-auto' :
                              post.images.length === 2 ? 'grid-cols-2' :
                              'grid-cols-2 sm:grid-cols-3'
                            }`}>
                              {post.images.map((imgUrl, index) => {
                                const rotations = ['rotate-[-1deg]', 'rotate-[1deg]', 'rotate-[-0.5deg]', 'rotate-[0.5deg]'];
                                const rotClass = post.images.length > 1 ? rotations[index % 4] : '';
                                return (
                                  <div
                                    key={index}
                                    className={`relative aspect-[4/3] overflow-hidden rounded-lg shadow-md cursor-pointer group/img transition-all duration-500 hover:z-20 hover:scale-[1.03] hover:rotate-0 border-2 ${
                                      isDark ? 'bg-zinc-900 border-white/10' : 'bg-stone-200 border-white'
                                    } ${rotClass}`}
                                    onClick={() => setSelectedImage(imgUrl)}
                                  >
                                    <img
                                      src={imgUrl}
                                      alt={`${post.title} ${index + 1}`}
                                      className="w-full h-full object-cover transition-transform duration-500 group-hover/img:scale-105"
                                      onError={(e) => { if (!e.target.dataset.fallbackTriggered) { e.target.dataset.fallbackTriggered = "true"; e.target.src = "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=800&q=80"; }}}
                                    />
                                    <div className="absolute inset-0 bg-cosmic-void/0 group-hover/img:bg-cosmic-void/30 transition-all duration-300 flex items-center justify-center">
                                      <div className={`w-8 h-8 rounded-full backdrop-blur-md flex items-center justify-center opacity-0 group-hover/img:opacity-100 transition-all duration-300 ${
                                        isDark ? 'bg-white/10' : 'bg-white/20'
                                      }`}>
                                        <i className="fa-solid fa-expand text-white text-xs drop-shadow"></i>
                                      </div>
                                    </div>
                                  </div>
                                );
                              })}
                            </div>
                          </div>
                        )}

                        <div className="p-6 md:p-8 bg-white/[0.005]">
                          <div className="flex items-center gap-2 mb-2">
                            <span className={`eyebrow ${isDark ? 'text-glowred' : 'text-darkred-600'}`}>{post.type}</span>
                            <span className={`text-xs ${isDark ? 'text-white/[0.1]' : 'text-stone-300'}`}>·</span>
                            <span className={`text-xs ${isDark ? 'text-zinc-500' : 'text-stone-400'}`}>{post.date}</span>
                          </div>
                          <h3 className={`text-lg font-semibold ${isDark ? 'text-white' : 'text-stone-900'}`}>{post.title}</h3>
                          {post.content && post.content.trim() !== "" && (
                            <p className={`text-sm leading-relaxed mt-2 ${isDark ? 'text-zinc-400' : 'text-stone-400'}`}>{post.content}</p>
                          )}
                        </div>
                      </div>
                    </Reveal>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* ── LIGHTBOX ── */}
          {selectedImage && (
            <div
              className={`fixed inset-0 z-[100] flex items-center justify-center backdrop-blur-md p-4 md:p-12 animate-fade-in-modal cursor-zoom-out ${
                isDark ? 'bg-black/95' : 'bg-stone-950/97'
              }`}
              onClick={() => setSelectedImage(null)}
            >
              <button
                className="absolute top-4 right-4 md:top-6 md:right-6 text-zinc-400 hover:text-white z-10 w-9 h-9 flex items-center justify-center rounded-full bg-white/5 hover:bg-glowred transition-all duration-200"
                onClick={() => setSelectedImage(null)}
              >
                <i className="fa-solid fa-xmark text-xs"></i>
              </button>
              <img
                src={selectedImage}
                alt="Expanded view"
                className="max-w-full max-h-full rounded-lg shadow-2xl object-contain animate-scale-up-modal cursor-default border border-white/10"
                onClick={(e) => e.stopPropagation()}
                onError={(e) => { if (!e.target.dataset.fallbackTriggered) { e.target.dataset.fallbackTriggered = "true"; e.target.src = "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1600&q=80"; }}}
              />
            </div>
          )}

          {/* ── STREAMING_CHUNK:Rendering activities, travel gallery, and dark footer details... ── */}
          <footer id="contact" className={`transition-colors duration-450 py-16 border-t-2 ${
            isDark 
              ? 'bg-cosmic-void text-zinc-400 border-glowred/20 shadow-inner' 
              : 'bg-stone-950 text-stone-400 border-darkred-900/50'
          }`}>
            <div className="max-w-6xl mx-auto px-6 grid md:grid-cols-2 gap-12">
              <Reveal>
                <div>
                  <p className="eyebrow text-zinc-600 mb-4">Contact</p>
                  <h2 className="font-display text-2xl font-semibold text-white mb-6">Get in Touch</h2>
                  <div className="space-y-4">
                    <a href="mailto:shivamgola17@gmail.com" className="flex items-center gap-4 text-sm hover:text-white transition-colors group">
                      <div className={`w-8 h-8 rounded-full bg-white/[0.03] border flex items-center justify-center transition-all shrink-0 ${
                        isDark 
                          ? 'border-white/[0.08] group-hover:bg-glowred group-hover:border-glowred/40' 
                          : 'border-stone-800 group-hover:bg-darkred-800'
                      }`}>
                        <i className="fa-solid fa-envelope text-xs text-zinc-400 group-hover:text-white"></i>
                      </div>
                      shivamgola17@gmail.com
                    </a>
                    <div className="flex items-center gap-4 text-sm cursor-default">
                      <div className="w-8 h-8 rounded-full bg-white/[0.03] border border-white/[0.08] flex items-center justify-center shrink-0">
                        <i className="fa-solid fa-location-dot text-xs text-zinc-400"></i>
                      </div>
                      IIT Bombay, Mumbai, Maharashtra 400076
                    </div>
                  </div>
                </div>
              </Reveal>
            </div>
            <Reveal delay={150}>
              <div className="max-w-6xl mx-auto px-6 mt-16 pt-8 border-t border-white/[0.05] text-xs flex flex-col sm:flex-row justify-between items-center gap-4 text-zinc-600">
                <p>© {new Date().getFullYear()} Dr. Shivam Gola. All rights reserved.</p>
                <div className="flex gap-5">
                  <a href="https://inspirehep.net/authors/1867679"                                           target="_blank" rel="noopener noreferrer" className="hover:text-white transition-colors">iNSPIRE-HEP</a>
                  <a href="https://arxiv.org/search/?query=%22Shivam+Gola%22&searchtype=author"              target="_blank" rel="noopener noreferrer" className="hover:text-white transition-colors">arXiv</a>
                  <a href="https://scholar.google.com/scholar?q=%22Shivam+Gola%22"                          target="_blank" rel="noopener noreferrer" className="hover:text-white transition-colors">Google Scholar</a>
                </div>
              </div>
            </Reveal>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
