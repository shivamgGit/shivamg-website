      { type: "Research Visit", title: "Physical Research Laboratory (PRL), Ahmedabad", date: "Aug 12 – Sep 12, 2023", details: "Visit to Prof. Srubabati Goswami. Engaged in discussions on the dipolar dark matter problem." },

    ];

    const blogPosts = [
      { id: 1, type: "Photo", title: "Maharashtra", date: "2026", images: ["./mumbai.jpg","./mumbai2.jpg","./kalsubai.jpg","./kalsubai2.jpg","./kalsubai3.jpg"] },
      { id: 2, type: "Photo", title: "Unakoti (Tripura)", date: "2024", images: ["./unakoti.jpg"], content: " " },
      { id: 3, type: "Photo", title: "Thiruvananthapuram", date: "2023", images: ["./shivam.jpg"], content: " " },
      { id: 4, type: "Photo", title: "Delhi", date: "2021", images: ["./shivam1.jpg"], content: " " }
    ];

    const researchInterests = [
      { id: "NuDM", title: "Dark Matter & Neutrinos", icon: "fa-bolt", description: "A large invisible mass — dark matter — is needed to explain gravitational anomalies at scales from galaxies to the very early Universe. Experimentally established neutrino masses are another puzzle outside the Standard Model." },
      { id: "alps", title: "Axions & Pseudo-scalars", icon: "fa-atom", description: "Axions are proposed to solve the Strong CP problem and are well-motivated cold dark matter candidates. Generic pseudo-scalar particles are also motivated as WIMP dark matter due to weaker DM-nucleon scattering cross sections." },
      { id: "Neff", title: "Neff", icon: "fa-star", description: "The effective number of relativistic degrees of freedom is a fine probe to constrain many BSM models." }
    ];

    const Reveal = ({ children, delay = 0, className = "" }) => {
      const ref = useRef(null);
      const [isVisible, setIsVisible] = useState(false);
      useEffect(() => {
        const fallbackTimer = setTimeout(() => setIsVisible(true), 600 + delay);
        const observer = new IntersectionObserver(
          ([entry]) => { 
            if (entry.isIntersecting) { 
              setIsVisible(true); 
              clearTimeout(fallbackTimer); 
              observer.unobserve(entry.target); 
            } 
          }, { threshold: 0.05 }
        );
        if (ref.current) observer.observe(ref.current);
        return () => { clearTimeout(fallbackTimer); if (ref.current) observer.unobserve(ref.current); };
      }, [delay]);
      return (
        <div ref={ref} className={`transition-all duration-700 ease-out ${isVisible ? "opacity-100 translate-y-0" : "opacity-0 translate-y-8"} ${className}`} style={{ transitionDelay: `${delay}ms` }}>
          {children}
        </div>
      );
    };

    /* ── STREAMING_CHUNK:Building dynamic Space-Time Lensing physics grid with cinematic black hole... ── */
    const SpaceTimeGridBackground = ({ isDark }) => {
      const canvas2DRef = useRef(null);
      const canvas3DRef = useRef(null);
      
      useEffect(() => {
        // --- 2D CANVAS INITIALIZATION ---
        const canvas2D = canvas2DRef.current;
        const ctx = canvas2D.getContext('2d');
        
        // --- THREE.JS M87* BLACK HOLE INITIALIZATION ---
        const canvas3D = canvas3DRef.current;
        const renderer = new THREE.WebGLRenderer({ canvas: canvas3D, alpha: true, antialias: false, powerPreference: "high-performance" });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.25)); // Cap for performance stability
        renderer.setClearColor(0x000000, 0); // Completely transparent backdrop

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        
        const uniforms = {
            uTime: { value: 0.0 },
            uResolution: { value: new THREE.Vector2() },
            uMouse: { value: new THREE.Vector2(0.5, 0.5) },
            uCenter: { value: new THREE.Vector2(0.5, 0.5) },
            uOpacity: { value: 0.0 },
            uScale: { value: 1.0 }
        };

        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            uniform float uTime;
            uniform vec2 uResolution;
            uniform vec2 uMouse;
            uniform vec2 uCenter;
            uniform float uOpacity;
            uniform float uScale;
            
            varying vec2 vUv;

            mat2 rot(float a) {
                float s = sin(a), c = cos(a);
                return mat2(c, -s, s, c);
            }

            float hash(vec2 p) {
                p = fract(p * vec2(123.34, 456.21));
                p += dot(p, p + 45.32);
                return fract(p.x * p.y);
            }

            float noise(vec2 p) {
                vec2 i = floor(p);
                vec2 f = fract(p);
                f = f * f * (3.0 - 2.0 * f);
                float a = hash(i);
                float b = hash(i + vec2(1.0, 0.0));
                float c = hash(i + vec2(0.0, 1.0));
                float d = hash(i + vec2(1.0, 1.0));
                return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
            }

            float fbm(vec2 p) {
                float v = 0.0;
                float a = 0.5;
                vec2 shift = vec2(100.0);
                mat2 rotFBM = mat2(cos(0.5), sin(0.5), -sin(0.5), cos(0.50));
                for (int i = 0; i < 5; ++i) {
                    v += a * noise(p);
                    p = rotFBM * p * 2.0 + shift;
                    a *= 0.5;
                }
                return v;
            }

            void main() {
                // Normalize and apply dynamic click center offset
                vec2 uv = (vUv - uCenter) * 2.0;
                uv.x *= uResolution.x / uResolution.y;
                
                // Dynamic scaling for massive collapse expansion
                uv /= max(0.001, uScale);

                // Camera Setup for M87 view
                vec3 ro = vec3(0.0, 10.5, 66.0); 
                float rotX = (uMouse.y - 0.5) * 2.5; 
                float rotY = (uMouse.x - 0.5) * 6.28 + (uTime * 0.05); 
                ro.yz *= rot(rotX);
                ro.xz *= rot(rotY);

                vec3 ta = vec3(0.0, 0.0, 0.0);
                vec3 cw = normalize(ta - ro);
                vec3 cu = normalize(cross(cw, vec3(0.0, 1.0, 0.0)));
                vec3 cv = normalize(cross(cu, cw));
                vec3 rd = normalize(uv.x * cu + uv.y * cv + 2.0 * cw); 

                vec3 p = ro;
                vec3 v = rd;
                vec3 col = vec3(0.0);
                
                float h2 = dot(cross(ro, rd), cross(ro, rd));
                float prevY = p.y;
                float hitDisk = 0.0;
                float minR = 1000.0; 
                
                // Optimized Raymarching Loop
                for(int i = 0; i < 300; i++) {
                    float r = length(p);
                    minR = min(minR, r);
                    if(r < 1.0) { minR = 0.0; break; }
                    if(r > 120.0) break; 

                    float dt = 0.02 + 0.015 * r;
                    vec3 a = -1.5 * h2 * p / pow(r, 5.0);
                    v += a * dt;
                    v = normalize(v); 
                    p += v * dt;

                    if(prevY * p.y < 0.0) {
                        float rDisk = length(p.xz);
                        if(rDisk > 1.2 && rDisk < 14.0) {
                            float spinSpeed = 3.0 / pow(rDisk, 1.5); 
                            
                            // FIX: Less radial shear to stop the noise from stretching into thin sharp lines
                            float angleOffset = (uTime * spinSpeed) + (rDisk * 0.35);
                            
                            // Rotate Cartesian coordinates instead of using atan() to prevent the wrap-around seam
                            float s = sin(-angleOffset);
                            float c = cos(-angleOffset);
                            vec2 rotatedP = mat2(c, -s, s, c) * p.xz;
                            
                            vec2 uvNoise = rotatedP * 2.0;
                            
                            // Softened the noise blending
                            float fire = fbm(uvNoise - vec2(uTime * 1.0, uTime * 0.5));
                            float fire2 = fbm(uvNoise * 1.5 + vec2(uTime * 1.5, uTime * 0.8));
                            fire = smoothstep(0.1, 0.9, fire * 0.6 + fire2 * 0.4);
                            
                            float density = smoothstep(1.2, 1.8, rDisk) * smoothstep(14.0, 6.0, rDisk);
                            
                            vec3 fireCol = mix(vec3(0.2, 0.0, 0.0), vec3(1.0, 0.35, 0.0), fire);
                            
                            // Softened the yellow core exponent from 3.0 to 1.5 to prevent a sharp yellow line
                            fireCol = mix(fireCol, vec3(1.0, 0.8, 0.3), pow(fire, 1.5));
                            fireCol *= 2.5; 

                            vec3 diskVel = normalize(vec3(-p.z, 0.0, p.x));
                            float doppler = dot(v, diskVel);
                            float shift = pow(1.0 + doppler * 0.85, 4.0); 

                            float alpha = fire * density * 0.85;
                            col += fireCol * shift * alpha * (1.0 - hitDisk);
                            hitDisk += alpha;
                            
                            if(hitDisk >= 1.0) break; 
                        }
                    }
                    prevY = p.y;
                }

                // Post-Processing
                col *= 1.4;
                col = col / (1.0 + col); 
                col = pow(col, vec3(1.0 / 2.2)); 

                // Dynamic Alpha Map for Overlay over 2D Canvas
                float isBlackHole = smoothstep(1.05, 0.95, minR); // Solid Black inside Event Horizon
                float fireAlpha = smoothstep(0.0, 0.1, dot(col, vec3(0.333))); // Transparent void outside
                float finalAlpha = max(fireAlpha, isBlackHole);

                // Smooth edges fading to blend with external canvas particles
                float edgeDist = length((vUv - uCenter) * 2.0);
                float edgeMask = 1.0 - smoothstep(0.7, 1.2, edgeDist * uScale);
                finalAlpha *= edgeMask;

                gl_FragColor = vec4(col, finalAlpha * uOpacity);
            }
        `;

        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms,
            transparent: true,
            depthWrite: false,
            depthTest: false
        });

        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
        scene.add(mesh);

        let animationFrameId;
        let time = 0;
        let blackHole = null;
        let sceneCollapsed = false;

        let targetMouse = new THREE.Vector2(0.5, 0.5);
        let currentMouse = new THREE.Vector2(0.5, 0.5);

        const onPointerMove = (e) => {
            const rect = canvas2D.getBoundingClientRect();
            if (!rect) return;
            const x = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            const y = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
            targetMouse.x = x;
            targetMouse.y = 1.0 - y;
        };
        window.addEventListener('mousemove', onPointerMove);

        const createBlackHole = (event) => {
          if (blackHole || sceneCollapsed) return;
          const rect = canvas2D.getBoundingClientRect();
          const clickX = event.clientX - rect.left;
          const clickY = event.clientY - rect.top;

          // Activate 2D pulling logic
          blackHole = {
            x: clickX,
            y: clickY,
            startedAt: time,
            spin: Math.random() > 0.5 ? 1 : -1
          };

          // Center the 3D M87 simulation exactly at the click origin
          uniforms.uCenter.value.set(
              clickX / rect.width,
              1.0 - (clickY / rect.height)
          );
        };

        const resizeCanvas = () => {
          const dpr = window.devicePixelRatio || 1;
          const rect = canvas2D.parentElement ? canvas2D.parentElement.getBoundingClientRect() : { width: window.innerWidth, height: window.innerHeight };
          
          // Size 2D Canvas
          canvas2D.width = rect.width * dpr;
          canvas2D.height = rect.height * dpr;
          ctx.scale(dpr, dpr);
          
          // Size 3D Canvas
          renderer.setSize(rect.width, rect.height);
          uniforms.uResolution.value.set(rect.width, rect.height);
        };
        
        window.addEventListener('resize', resizeCanvas);
        canvas2D.addEventListener('click', createBlackHole);
        setTimeout(resizeCanvas, 0);

        // Theoretical Physics Scene Setup for Bullet Cluster Collision
        const darkTheme = {
            base: [255, 255, 255],     
            well: [255, 51, 75],       
            alphaBase: 0.08,
            alphaGlow: 0.75,
            particleColor: '255, 255, 255'
        };

        const lightTheme = {
            base: [0, 0, 0],           
            well: [123, 31, 31],       
            alphaBase: 0.06,
            alphaGlow: 0.55,
            particleColor: '123, 31, 31'
        };

        // Grid resolution and dimensions
        const xSteps = 60;
        const zSteps = 50;
        const spacingX = 90;
        const spacingZ = 90;

        const particles = [];
        const numDMParticles = 900;       
        const numGasParticles = 600;      
        const numStreamParticles = 300;   

        for (let i = 0; i < numDMParticles; i++) {
          const haloIdx = Math.floor(Math.random() * 2);
          const rFactor = Math.pow(Math.random(), 2.5);
          particles.push({
            type: 'halo_dm', haloIdx, rFactor,
            theta: Math.random() * Math.PI * 2, phi: Math.acos((Math.random() * 2) - 1),
            speed: (Math.random() - 0.5) * 0.012 / (rFactor + 0.1), size: Math.random() * 5.76 + 1.92,
            baseAlpha: (1 - rFactor) * 0.9, isBlueTint: haloIdx === 0
          });
        }

        for (let i = 0; i < numGasParticles; i++) {
          const gasIdx = 2 + Math.floor(Math.random() * 2);
          particles.push({
            type: 'gas_plasma', gasIdx, rFactor: Math.pow(Math.random(), 1.8),
            theta: Math.random() * Math.PI * 2, turbSpeed: (Math.random() - 0.5) * 0.025,
            size: Math.random() * 6.4 + 2.08, baseAlpha: Math.random() * 0.85 + 0.15, colorVariant: Math.random()
          });
        }

        for (let i = 0; i < numStreamParticles; i++) {
          particles.push({
            type: 'stream', fromHalo: Math.floor(Math.random() * 2), toGas: 2 + Math.floor(Math.random() * 2),
            progress: Math.random(), speed: (Math.random() * 0.008 + 0.002) * (Math.random() > 0.5 ? 1 : -1),
            spread: (Math.random() - 0.5) * 160, size: Math.random() * 4.16 + 1.28, baseAlpha: Math.random() * 0.6 + 0.2
          });
        }

        const animate = () => {
          time += 1;
          const rect = canvas2D.getBoundingClientRect();
          const w = rect.width;
          const h = rect.height;
          if (w === 0 || h === 0) {
              animationFrameId = requestAnimationFrame(animate);
              return;
          }

          const theme = isDark ? darkTheme : lightTheme;
          ctx.clearRect(0, 0, w, h);
          ctx.globalCompositeOperation = 'source-over';

          // Accelerated collapse for snappier interaction
          const collapseProgress = blackHole ? Math.min(1, (time - blackHole.startedAt) / 400) : 0;
          const blackHoleRadius = blackHole ? Math.max(28, Math.min(52, Math.min(w, h) * 0.075)) : 0;
          ctx.globalAlpha = sceneCollapsed ? 0 : 1;

          const cycle = time * 0.005;
          const pos = Math.sin(cycle); 
          const vel = Math.cos(cycle);
          
          const gasPos1 = pos * 460 - Math.pow(vel, 3) * 120;
          const gasPos2 = -pos * 420 + Math.pow(vel, 3) * 100;

          const activeHalos = [
              { name: 'DM_Primary', x: pos * 850, z: -30 + Math.cos(time * 0.003) * 70, r: 780, mass: 380, color: isDark ? {r: 65, g: 130, b: 255, a: 0.22} : {r: 35, g: 70, b: 190, a: 0.12} },
              { name: 'DM_Secondary', x: -pos * 780, z: 40 + Math.sin(time * 0.0035) * 70, r: 680, mass: 320, color: isDark ? {r: 0, g: 200, b: 255, a: 0.18} : {r: 15, g: 110, b: 180, a: 0.10} },
              { name: 'Gas_Primary', x: gasPos1, z: -10 + Math.sin(time * 0.008) * 45, r: 480, mass: 200, color: isDark ? {r: 255, g: 51, b: 90, a: 0.32} : {r: 190, g: 25, b: 55, a: 0.16} },
              { name: 'Gas_Secondary', x: gasPos2, z: 20 + Math.cos(time * 0.007) * 45, r: 420, mass: 170, color: isDark ? {r: 255, g: 120, b: 40, a: 0.26} : {r: 180, g: 75, b: 15, a: 0.13} }
          ];

          const project = (x, y, z, verticalOffset = 0) => {
              const fov = 900;
              if (z < -800) return null;
              const sceneScale = Math.min(0.29, w / 4300, h / 2500);
              const scale = (fov / (fov + z)) * sceneScale;
              const sx = w / 2 + x * scale;
              const sy = h * 0.64 + verticalOffset - (z * 0.22) * scale + y * scale;
              return { sx, sy, scale, z };
          };

          const points = [];
          for (let xi = 0; xi < xSteps; xi++) {
              points[xi] = [];
              for (let zi = 0; zi < zSteps; zi++) {
                  const x = (xi - xSteps / 2) * spacingX;
                  const z = -600 + zi * spacingZ; 
                  let y = 0;
                  let wellIntensity = 0;

                  activeHalos.forEach(halo => {
                      const dx = x - halo.x;
                      const dz = z - halo.z;
                      const influence = Math.exp(-(dx*dx + dz*dz) / (halo.r * halo.r));
                      y += halo.mass * influence; 
                      wellIntensity = Math.max(wellIntensity, Math.abs(halo.mass) > 0 ? influence : 0);
                  });

                  const distToCenterSq = x*x + z*z;
                  const collisionIntensity = Math.exp(-distToCenterSq / (500 * 500)) * Math.max(0, 1 - Math.abs(pos) * 1.5);
                  const bowShock = Math.sin(Math.sqrt(distToCenterSq) * 0.03 - time * 0.1) * collisionIntensity * 45;
                  const wave = Math.sin(x * 0.002 + time * 0.015) * Math.cos(z * 0.002 + time * 0.015) * 12;
                  y += wave + bowShock;

                  const proj = project(x, y, z);
                  if (proj) {
                      // 2D Grid Lensing (matching the 3D M87 visual)
                      if (blackHole) {
                          const dx = blackHole.x - proj.sx;
                          const dy = blackHole.y - proj.sy;
                          const distance = Math.hypot(dx, dy);
                          const lensRange = Math.max(blackHoleRadius * 4, Math.hypot(w, h) * (0.12 + collapseProgress * 1.3));
                          const localLensing = Math.max(0, 1 - distance / lensRange) * Math.pow(collapseProgress, 1.35) * 0.94;
                          const lensing = Math.min(0.96, localLensing + Math.pow(collapseProgress, 3) * 0.96);
                          proj.sx += dx * lensing - dy * lensing * 0.22 * blackHole.spin;
                          proj.sy += dy * lensing + dx * lensing * 0.22 * blackHole.spin;
                      }
                      proj.intensity = Math.min(1, wellIntensity);
                      points[xi][zi] = proj;
                  }
              }
          }

          ctx.globalCompositeOperation = isDark ? 'screen' : 'multiply';
          const sortedHalos = [...activeHalos].sort((a,b) => b.z - a.z);
          
          sortedHalos.forEach(halo => {
             const proj = project(halo.x, Math.max(0, halo.mass), halo.z, -h * 0.36); 
             if(!proj) return;
             
             let radius = halo.r * proj.scale * 1.8;
             if(radius < 0) return;

             const haloOpacity = blackHole ? halo.color.a * Math.pow(1 - collapseProgress, 1.5) : halo.color.a;
             if (blackHole) {
                 const dx = blackHole.x - proj.sx;
                 const dy = blackHole.y - proj.sy;
                 const pull = Math.pow(collapseProgress, 1.6) * 0.96;
                 proj.sx += dx * pull;
                 proj.sy += dy * pull;
                 radius *= Math.max(0.08, 1 - collapseProgress * 0.9);
             }
             
             const gradient = ctx.createRadialGradient(proj.sx, proj.sy, 0, proj.sx, proj.sy, radius);
             gradient.addColorStop(0, `rgba(${halo.color.r}, ${halo.color.g}, ${halo.color.b}, ${haloOpacity})`);
             gradient.addColorStop(1, `rgba(${halo.color.r}, ${halo.color.g}, ${halo.color.b}, 0)`);

             ctx.beginPath();
             ctx.arc(proj.sx, proj.sy, radius, 0, Math.PI * 2);
             ctx.fillStyle = gradient;
             ctx.fill();
          });

          ctx.globalCompositeOperation = 'source-over';
          ctx.lineWidth = 1;
          
          const drawSeg = (p1, p2) => {
              if(!p1 || !p2) return;
              const avgScale = (p1.scale + p2.scale) / 2;
              if (avgScale < 0.1) return;
              const alphaDepth = Math.max(0, Math.min(1, (avgScale - 0.15) * 2));
              if (alphaDepth <= 0.01) return;
              const avgIntensity = (p1.intensity + p2.intensity) / 2;
              
              const r = Math.round(theme.base[0] + (theme.well[0] - theme.base[0]) * avgIntensity);
              const g = Math.round(theme.base[1] + (theme.well[1] - theme.base[1]) * avgIntensity);
              const b = Math.round(theme.base[2] + (theme.well[2] - theme.base[2]) * avgIntensity);
              const targetAlpha = theme.alphaBase + (theme.alphaGlow - theme.alphaBase) * avgIntensity;
              const finalAlpha = targetAlpha * alphaDepth;

              ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${finalAlpha.toFixed(3)})`;
              ctx.beginPath();
              ctx.moveTo(p1.sx, p1.sy);
              ctx.lineTo(p2.sx, p2.sy);
              ctx.stroke();
          };

          for (let zi = zSteps - 2; zi >= 0; zi--) {
              for (let xi = 0; xi < xSteps; xi++) {
                  if (xi < xSteps - 1) drawSeg(points[xi][zi], points[xi+1][zi]);
                  drawSeg(points[xi][zi], points[xi][zi+1]);
              }
          }

          ctx.globalCompositeOperation = isDark ? 'screen' : 'source-over';
          
          particles.forEach(p => {
              let worldX = 0, worldZ = 0, worldY = 0;
              let customColor = null;
              
              if (p.type === 'halo_dm') {
                  p.theta += p.speed;
                  const halo = activeHalos[p.haloIdx];
                  const r = p.rFactor * (halo.r * 0.65);
                  const px3d = r * Math.sin(p.phi) * Math.cos(p.theta);
                  const py3d = (r * Math.cos(p.phi)) * 0.28;
                  const pz3d = r * Math.sin(p.phi) * Math.sin(p.theta);
                  const clusterRot = time * 0.0015;
                  worldX = halo.x + px3d * Math.cos(clusterRot) - pz3d * Math.sin(clusterRot);
                  worldZ = halo.z + px3d * Math.sin(clusterRot) + pz3d * Math.cos(clusterRot);
                  worldY = py3d;
                  customColor = isDark ? (p.isBlueTint ? '150, 190, 255' : '110, 220, 255') : (p.isBlueTint ? '30, 60, 160' : '20, 95, 150');
              } else if (p.type === 'gas_plasma') {
                  p.theta += p.turbSpeed;
                  const gas = activeHalos[p.gasIdx];
                  const compression = Math.max(0.45, Math.min(1.2, Math.abs(pos) * 1.5));
                  const r = p.rFactor * (gas.r * 0.75) * compression;
                  worldX = gas.x + Math.cos(p.theta) * r + Math.sin(time * 0.02 + p.rFactor * 5) * 30;
                  worldZ = gas.z + Math.sin(p.theta) * (r * 0.65);
                  worldY = (Math.sin(p.theta * 2 + time * 0.03) * 45) * (1 - Math.abs(pos));
                  
                  if (isDark) {
                      if (p.colorVariant < 0.5) customColor = '255, 51, 75';
                      else if (p.colorVariant < 0.8) customColor = '255, 105, 180';
                      else customColor = '255, 175, 50';
                  } else {
                      if (p.colorVariant < 0.5) customColor = '180, 25, 45';
                      else if (p.colorVariant < 0.8) customColor = '150, 40, 110';
                      else customColor = '180, 90, 10';
                  }
              } else {
                  p.progress += p.speed;
                  if (p.progress > 1) p.progress -= 1;
                  if (p.progress < 0) p.progress += 1;
                  const hDM = activeHalos[p.fromHalo];
                  const hGas = activeHalos[p.toGas];
                  const baseX = hDM.x + (hGas.x - hDM.x) * p.progress;
                  const baseZ = hDM.z + (hGas.z - hDM.z) * p.progress;
                  worldX = baseX + Math.sin(p.progress * Math.PI * 2 + time * 0.01) * p.spread;
                  worldZ = baseZ + Math.cos(p.progress * Math.PI * 2 + time * 0.01) * (p.spread * 0.5);
                  worldY = Math.sin(p.progress * Math.PI) * 30;
                  customColor = isDark ? '210, 140, 255' : '120, 55, 160';
              }
              
              activeHalos.forEach(h => {
                  const dx = worldX - h.x;
                  const dz = worldZ - h.z;
                  const influence = Math.exp(-(dx*dx + dz*dz) / (h.r * h.r));
                  worldY += h.mass * influence; 
              });

              const distToCenterSq = worldX*worldX + worldZ*worldZ;
              const collisionIntensity = Math.exp(-distToCenterSq / (500 * 500)) * Math.max(0, 1 - Math.abs(pos) * 1.5);
              const bowShock = Math.sin(Math.sqrt(distToCenterSq) * 0.03 - time * 0.1) * collisionIntensity * 45;
              const wave = Math.sin(worldX * 0.002 + time * 0.015) * Math.cos(worldZ * 0.002 + time * 0.015) * 12;
              worldY += wave + bowShock;

              const proj = project(worldX, worldY, worldZ, -h * 0.36);
              
              if (proj && proj.scale > 0.05) {
                  const depthAlpha = Math.max(0, Math.min(1, (proj.scale - 0.1) * 2.5));
                  let finalAlpha = p.baseAlpha * depthAlpha;

                  if (blackHole) {
                      const dx = blackHole.x - proj.sx;
                      const dy = blackHole.y - proj.sy;
                      const pull = Math.pow(collapseProgress, 1.6) * 0.96;
                      const spiral = Math.sin(collapseProgress * Math.PI) * 0.12 * blackHole.spin;
                      proj.sx += dx * pull - dy * spiral;
                      proj.sy += dy * pull + dx * spiral;
                      const capturedDistance = Math.hypot(blackHole.x - proj.sx, blackHole.y - proj.sy);
                      finalAlpha *= Math.max(0, Math.min(1, (capturedDistance - blackHoleRadius) / 26));
                  }
                  
                  if (finalAlpha > 0.01) {
                      const size = Math.max(0.1, p.size * proj.scale);
                      ctx.fillStyle = `rgba(${customColor || theme.particleColor}, ${finalAlpha.toFixed(3)})`;
                      ctx.beginPath();
                      ctx.arc(proj.sx, proj.sy, size, 0, Math.PI * 2);
                      ctx.fill();
                  }
              }
          });

          // --- 3D M87* BLACK HOLE ANIMATION & SYNCHRONIZATION ---
          currentMouse.lerp(targetMouse, 0.05);
          uniforms.uMouse.value.copy(currentMouse);
          uniforms.uTime.value = time * 0.016; 

          if (blackHole) {
              // Rapid cinematic fade in, followed by a sudden disappearance when completely collapsed
              const fadeIn = Math.min(1, (time - blackHole.startedAt) / 45);
              const fadeOut = 1.0 - Math.pow(Math.max(0, (collapseProgress - 0.8) / 0.2), 2.0); 
              uniforms.uOpacity.value = fadeIn * fadeOut;
              
              // Scale animation: Small pop in -> normalize -> erupt massive collapse
              let s = 1.0;
              if (collapseProgress < 0.15) {
                  s = 0.01 + 0.99 * Math.pow(collapseProgress / 0.15, 0.5); 
              } else if (collapseProgress > 0.8) {
                  s = 1.0 + 8.0 * Math.pow((collapseProgress - 0.8) / 0.2, 2.0); 
              }
              uniforms.uScale.value = s;

              if (collapseProgress >= 1) {
                  blackHole = null;
                  sceneCollapsed = true;
                  uniforms.uOpacity.value = 0.0;
              }
          } else {
              uniforms.uOpacity.value = 0.0;
          }

          renderer.render(scene, camera);
          animationFrameId = requestAnimationFrame(animate);
        };

        animate();

        return () => {
          window.removeEventListener('resize', resizeCanvas);
          window.removeEventListener('mousemove', onPointerMove);
          canvas2D.removeEventListener('click', createBlackHole);
          cancelAnimationFrame(animationFrameId);
        };
      }, [isDark]);

      return (
        <div className="absolute inset-0 w-full h-full z-0 overflow-hidden">
            {/* 2D Grid & Physics Particles */}
            <canvas ref={canvas2DRef} className="absolute inset-0 w-full h-full z-0 cursor-crosshair transition-opacity duration-1000 opacity-100" />
            {/* 3D M87* Simulation Overlay */}
            <canvas ref={canvas3DRef} className="absolute inset-0 w-full h-full z-10 pointer-events-none" />
        </div>
      );
    };

      const [activeResearch, setActiveResearch] = useState(researchInterests[0].id);
      const [isScrolled, setIsScrolled] = useState(false);

      const [isMenuOpen, setIsMenuOpen] = useState(false);

      useEffect(() => { document.documentElement.classList.toggle('light-mode', !isDark); }, [isDark]);
      useEffect(() => { const handleScroll = () => setIsScrolled(window.scrollY > 20); window.addEventListener('scroll', handleScroll); return () => window.removeEventListener('scroll', handleScroll); }, []);
      useEffect(() => { document.body.classList.toggle('modal-open', !!selectedImage); }, [selectedImage]);

      const navigateTo = (e, page, sectionId = null) => {

          <i className={`fa-solid ${icon} text-xs`}></i> {label}
        </button>
      );

      const ActivityCard = ({ item, index }) => (

          <article className={`group rounded-xl border p-5 transition-all duration-300 ${isDark ? 'bg-white/[0.015] border-white/[0.06] hover:bg-white/[0.03] hover:border-glowred/30' : 'bg-cream-50 border-stone-200 hover:border-darkred-300 hover:translate-x-1'}`}>
            <div className="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
              <div className="min-w-0">
                <p className={`eyebrow mb-2 ${isDark ? 'text-glowred' : 'text-darkred-600'}`}>{item.type}</p>
                <h3 className={`text-base font-semibold leading-snug transition-colors ${isDark ? 'text-white group-hover:text-glowred' : 'text-stone-900 group-hover:text-darkred-800'}`}>{item.title}</h3>
              </div>
              <span className={`shrink-0 text-xs font-medium ${isDark ? 'text-zinc-500' : 'text-stone-400'}`}>{item.date}</span>
            </div>
            <p className={`mt-3 border-t pt-3 text-sm leading-relaxed ${isDark ? 'border-white/[0.06] text-zinc-400' : 'border-stone-100 text-stone-500'}`}>{item.details}</p>
          </article>
        </Reveal>
      );

      return (
        <div className={`min-h-screen transition-colors duration-450 ${isDark ? 'bg-cosmic-void text-zinc-300 selection:bg-glowred-soft selection:text-white' : 'bg-cream text-stone-800 selection:bg-darkred-200 selection:text-darkred-950'}`}>

          <nav className={`fixed w-full z-50 transition-all duration-300 ${isScrolled ? (isDark ? 'nav-surface bg-cosmic-void/80 backdrop-blur-lg shadow-xl border-b border-white/[0.05] py-3' : 'nav-surface bg-cream/95 backdrop-blur-md shadow-sm border-b border-stone-200/70 py-3') : 'bg-transparent py-5'}`}>
            <div className="max-w-6xl mx-auto px-6 flex justify-between items-center">
              
           

<a
  href="#"
  onClick={(e) => navigateTo(e, 'home')}
  className="flex items-center gap-3 group"
>

    className={`fa-solid fa-atom text-lg animate-spin-slow ${
      isDark ? 'text-glowred' : 'text-darkred-700'
    }`}
  ></i>

  <div className="leading-tight">
    <div
      className={`font-display font-semibold text-sm ${
        isDark ? 'text-zinc-100' : 'text-stone-900'
      }`}
    >
      Dr. Shivam Gola
    </div>

    <div
      className={`text-xs ${
        isDark ? 'text-zinc-400' : 'text-stone-500'
      }`}

      Astroparticle Physics
    </div>
  </div>
</a>



              <div className="flex items-center gap-6">
                
                <div className={`hidden md:flex items-center gap-7 text-xs font-medium tracking-wide ${isDark ? 'text-zinc-400' : 'text-stone-500'}`}>
                  <a href="#about"        onClick={(e) => navigateTo(e, 'home', 'about')}        className={`nav-link hover:text-white transition-colors ${!isDark && 'hover:text-stone-900'}`}>About</a>

                  <a href="#experience"   onClick={(e) => navigateTo(e, 'home', 'experience')}   className={`nav-link hover:text-white transition-colors ${!isDark && 'hover:text-stone-900'}`}>CV</a>
                  <a href="#publications" onClick={(e) => navigateTo(e, 'home', 'publications')} className={`nav-link hover:text-white transition-colors ${!isDark && 'hover:text-stone-900'}`}>Publications</a>
                  <a href="#conferences"  onClick={(e) => navigateTo(e, 'activities')}           className={`nav-link hover:text-white transition-colors ${!isDark && 'hover:text-stone-900'} ${currentPage === 'activities' ? (isDark ? 'text-glowred active' : 'text-darkred-700 active') : ''}`}>Activities</a>
                  <a href="#blog"         onClick={(e) => navigateTo(e, 'blog')}                 className={`nav-link hover:text-white transition-colors ${!isDark && 'hover:text-stone-900'} ${currentPage === 'blog' ? (isDark ? 'text-glowred active' : 'text-darkred-700 active') : ''}`}>Gallery</a>
                  <a href="#contact"      onClick={(e) => { e.preventDefault(); document.getElementById('contact')?.scrollIntoView({ behavior: 'smooth' }); }} className={`nav-link hover:text-white transition-colors ${!isDark && 'hover:text-stone-900'}`}>Contact</a>
                </div>

                <button type="button" onClick={() => setIsMenuOpen(!isMenuOpen)} aria-label="Toggle navigation" aria-expanded={isMenuOpen} className={`md:hidden w-9 h-9 rounded-full border transition-colors ${isDark ? 'border-white/[0.12] text-zinc-200 hover:border-glowred/60' : 'border-stone-300 text-stone-700 hover:border-darkred-400'}`}>
                  <i className={`fa-solid ${isMenuOpen ? 'fa-xmark' : 'fa-bars'} text-xs`}></i>
                </button>

                <button onClick={() => setIsDark(!isDark)} className={`flex items-center gap-2 px-3 py-1.5 rounded-full border text-xs font-medium transition-all ${isDark ? 'bg-white/[0.04] border-white/[0.1] text-zinc-300 hover:bg-white/[0.1] hover:border-glowred/50 hover:text-white' : 'bg-cream-50 border-stone-300 text-stone-600 hover:bg-cream hover:border-darkred-400 hover:text-stone-950'}`} title={isDark ? "Switch to Light Mode" : "Switch to Dark Mode"}>
                  <i className={`fa-solid ${isDark ? 'fa-sun text-yellow-400' : 'fa-moon text-darkred-700'}`}></i>
                  <span className="hidden sm:inline font-display">{isDark ? 'Light' : 'Dark'}</span>
                </button>

              </div>
            </div>
            {isMenuOpen && (
