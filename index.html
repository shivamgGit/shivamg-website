    const revealWatch = (() => {

      let listening = false;

            entry.show();
          }

      const check = () => {

        ticking = true;
        if (document.hidden) setTimeout(flush, 60);

        document.addEventListener('visibilitychange', check);

        window.removeEventListener('scroll', check);
        window.removeEventListener('resize', check);
        window.removeEventListener('load', check);
        document.removeEventListener('visibilitychange', check);
      };

        add(entry) {
          pending.add(entry);
          start();
          flush();
          // Layout (and web fonts) may not have resolved at mount, where
          // getBoundingClientRect() can still read all zeros. Re-measure as it settles.
          [0, 120, 400, 1000].forEach((t) => setTimeout(check, t));

        remove(entry) { pending.delete(entry); if (pending.size === 0) stop(); },
        poke: check
      };
    })();

    // final state with no observer, no transition and no stagger.
    const Reveal = ({ children, delay = 0, className = "", instant = false }) => {
      const ref = useRef(null);
      const [phase, setPhase] = useState(PREFERS_REDUCED || instant ? 'settled' : 'hidden');
      const activeDelay = useRef(0);

      useEffect(() => {
        if (PREFERS_REDUCED || instant) return;
        const el = ref.current;
        if (!el) return;
        let settleTimer = null;
        const DURATION = REVEAL_MS;

        const reveal = (stagger) => {
          activeDelay.current = stagger;
          setPhase('revealing');
          settleTimer = setTimeout(() => setPhase('settled'), stagger + DURATION + 60);
        };

        const vh = window.innerHeight || document.documentElement.clientHeight;
        const rect = el.getBoundingClientRect();
        const laidOut = rect.width > 0 || rect.height > 0;

        const entry = { el: () => ref.current, show: () => reveal(Math.min(delay, 200)) };

      const settled = phase === 'settled';

          className={className}

            // so hover lifts on children behave normally.
            transform: hidden ? 'translate3d(0, 18px, 0)' : 'none',
            transition: settled ? 'none' : `opacity ${REVEAL_MS}ms ${REVEAL_EASE}, transform ${REVEAL_MS}ms ${REVEAL_EASE}`,

    //  Bullet-Cluster spacetime background
    //  Physics contract (kept internally consistent):
    //    • Dark matter is collisionless  → both halos pass straight through.
    //    • Baryonic gas is collisional   → ram pressure decelerates it, it lags
    //      behind its halo, is compressed on the leading edge (bow shock) and
    //      streams a stripped tail *behind* the direction of motion.
    //    • Gas is ~15% of the cluster mass → the spacetime wells (and therefore
    //      the lensing signal) track the DARK MATTER, not the visible gas.
    //      That offset is the whole point of the Bullet Cluster.
    //    • Halo particles obey a flat rotation curve (ω ∝ 1/r).
    //    • Black hole: horizon r=1 (M=0.5), photon sphere r=1.5, ISCO r=3,

    // ─────────────────────────────────────────────────────────────────────────
    const REDUCED_MOTION = typeof window !== 'undefined' && window.matchMedia

    const SpaceTimeGridBackground = ({ isDark }) => {
      const canvas2DRef = useRef(null);

      useEffect(() => { isDarkRef.current = isDark; }, [isDark]);

          uTime: { value: 0.0 },
          uResolution: { value: new THREE.Vector2(1, 1) },

            uniform float uTime;

            vec3 m289_(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}

vec4 prm_(vec4 x){return m289_(((x*34.0)+1.0)*x);}
float sn3(vec3 v){const vec2 C=vec2(1.0/6.0,1.0/3.0);const vec4 D=vec4(0.0,0.5,1.0,2.0);
 vec3 i=floor(v+dot(v,C.yyy));vec3 x0=v-i+dot(i,C.xxx);vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.0-g;vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);

 vec4 p=prm_(prm_(prm_(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
 vec3 ns=0.142857142857*D.wyz-D.xzx;vec4 j=p-49.0*floor(p*ns.z*ns.z);vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.0*x_);
 vec4 x=x_*ns.x+ns.yyyy;vec4 y=y_*ns.x+ns.yyyy;vec4 h=1.0-abs(x)-abs(y);vec4 b0=vec4(x.xy,y.xy);vec4 b1=vec4(x.zw,y.zw);
 vec4 s0=floor(b0)*2.0+1.0;vec4 s1=floor(b1)*2.0+1.0;vec4 sh=-step(h,vec4(0.0));vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
 vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);
 vec4 nr=1.79284291400159-0.85373472095314*vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3));p0*=nr.x;p1*=nr.y;p2*=nr.z;p3*=nr.w;

            vec3 emit(float rc,float lz,float az){

        const material = new THREE.ShaderMaterial({
          vertexShader, fragmentShader, uniforms,
          transparent: true, depthWrite: false, depthTest: false

        const mesh = new THREE.Mesh(geometry, material);

        let phaseFrame = 0;

        let blackHole = null;

        let diskClock = 0;
        let visible = true;
        let paused = false;
        let rafId = null;

        simRef.current = (on) => {
          paused = !on;

          simFrame = 0;

            const t = event.touches && event.touches[0];
            const clientX = t ? t.clientX : event.clientX;
            const clientY = t ? t.clientY : event.clientY;
            if (clientX === undefined || clientY === undefined) return;

            cy = clientY - rect.top;

            if (rect.width >= 768 && cx < rect.width * 0.5) return;
          } else {
            cx = rect.width * 0.78;
            cy = rect.height * 0.72;

          const clientX = t ? t.clientX : e.clientX;
          const clientY = t ? t.clientY : e.clientY;

        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('touchmove', onPointerMove, { passive: true });

          observer = new IntersectionObserver(([entry]) => { visible = entry.isIntersecting; }, { threshold: 0 });

        }

        const darkTheme  = { base: [255, 255, 255], well: [110, 160, 255], alphaBase: 0.075, alphaGlow: 0.72, particleColor: '255, 255, 255' };
        const lightTheme = { base: [120, 95, 60],   well: [150, 50, 50],   alphaBase: 0.04,  alphaGlow: 0.32, particleColor: '123, 31, 31' };

        // The "bullet" (index 1 / primary) is ~1/3 the main cluster's mass here —
        // the real ratio is ~1:10, but that would leave the bullet invisible.

        const GAS1_MASS = 30, GAS2_MASS = 72;

        // (see the gas pass in drawFrame), not as particles.

        // its own randomly oriented plane (isotropic velocity dispersion), so the
        // halo is a roughly spherical, non-spinning cloud. Net spin is negligible.

          const haloIdx = Math.floor(Math.random() * 2);
          const rFactor = Math.pow(Math.random(), 2.2);
          const [e1, e2] = randPlane();
          particles.push({
            type: 'halo_dm', haloIdx, rFactor, e1, e2,
            theta: Math.random() * Math.PI * 2,
            speed: 0.006 / (rFactor + 0.2),
            size: Math.random() * 5.0 + 1.6,
            baseAlpha: (1 - rFactor) * 0.9,
            isBlueTint: haloIdx === 0
          });
        }

        const galCols = (ell) => ell
          ? ['245, 166, 54', '235, 150, 45']   // 70% yellow + 30% red
          : ['150, 186, 255', '120, 165, 245'];  // 60% blue + 40% white

            speed: 0.004 / (rFactor + 0.25),
            size: bcg ? (i === 1 ? 17 : 13) : 2.6 + 7.5 * Math.pow(Math.random(), 2.6),

            baseAlpha: bcg ? 1 : Math.random() * 0.35 + 0.6

        }


        for (let i = 0; i < numGasParticles; i++) {
          particles.push({
            type: 'gas_plasma', gasIdx: Math.floor(Math.random() * 2),
            rFactor: Math.pow(Math.random(), 1.6),
            theta: Math.random() * Math.PI * 2,
            turbSpeed: (Math.random() - 0.5) * 0.02,
            size: Math.random() * 6.0 + 1.8,
            baseAlpha: Math.random() * 0.85 + 0.15,

            // Elliptical: smooth, centrally concentrated (Sérsic-like) light, no arms.
            const g = g2.createRadialGradient(C, C, 0, C, C, C);
            g.addColorStop(0, `rgba(${core}, 1)`); g.addColorStop(0.06, `rgba(${core}, 0.85)`);
            g.addColorStop(0.2, `rgba(${rim}, 0.45)`); g.addColorStop(0.45, `rgba(${rim}, 0.14)`);
            g.addColorStop(0.75, `rgba(${rim}, 0.04)`); g.addColorStop(1, `rgba(${rim}, 0)`);
            g2.fillStyle = g; g2.fillRect(0, 0, S, S);
            return (spriteCache[key] = c);
          }
          blob(C, C, C * 0.95, rim, 0.18);                       // faint disk
          const arms = morph === 2 ? 3 : 2, pitch = morph === 2 ? 0.32 : 0.24;
          const r0 = morph === 1 ? C * 0.26 : C * 0.1;
          if (morph === 1) for (let i = -1; i <= 1; i += 0.08) blob(C + i * r0, C, C * 0.1, core, 0.22);   // bar
          for (let a = 0; a < arms; a++) {
            const off = (a / arms) * Math.PI * 2;
            for (let th = 0; th < Math.PI * 2.4; th += 0.05) {
              const r = r0 * Math.exp(pitch * th);
              if (r > C * 0.9) break;
              const fall = 1 - r / (C * 0.92);
              const j = (rnd() - 0.5) * r * 0.12;
              const x = C + Math.cos(th + off) * (r + j), y = C + Math.sin(th + off) * (r + j);
              blob(x, y, C * (0.06 + 0.07 * fall), rim, 0.32 * fall + 0.05);
              if (rnd() < 0.14) blob(x, y, C * 0.035, core, 0.7 * fall + 0.2);   // star-forming knots
            }
          }
          const b = g2.createRadialGradient(C, C, 0, C, C, C * 0.3);      // bulge
          b.addColorStop(0, `rgba(${core}, 1)`); b.addColorStop(0.4, `rgba(${core}, 0.6)`); b.addColorStop(1, `rgba(${rim}, 0)`);
          g2.fillStyle = b; g2.fillRect(0, 0, S, S);
          return (spriteCache[key] = c);
        };

        const drawFrame = (step) => {
          const rect = canvas2D.getBoundingClientRect();
          const w = rect.width, h = rect.height;
          if (!w || !h) return;

          // ── advance the state machine ──────────────────────────────────────
          phaseFrame += step;
          if (phase === 'run') {
            simFrame += step;
            if (simFrame >= F_RUN) { simFrame = F_RUN; setPhase('hold'); }
          } else if (phase === 'hold') {
            // No automatic black hole: the black hole is a click-only easter egg.
            // The observed configuration holds, then fades out and the loop restarts.
            if (phaseFrame >= F_HOLD) setPhase('void');
          } else if (phase === 'collapse') {
            // The hole only leaves once every galaxy has crossed the horizon.
            if (blackHole) blackHole.t += step / 60;
            if (!blackHole || blackHole.fade >= 1) { blackHole = null; setPhase('void'); }
          } else if (phase === 'void') {
            if (phaseFrame >= F_VOID) { simFrame = 0; setPhase('run'); }
          }

          const isDarkNow = isDarkRef.current;
          const theme = isDarkNow ? darkTheme : lightTheme;
          // ── Black hole (Schwarzschild, G = 1) ──────────────────────────────
          // The shader draws a hole with r_s = 2M and camera at r = 70M; its shadow
          // (b = 3√3 M) subtends 0.0742·min(w,h)·uScale px, so r_s = shadow / 2.598.
          // Geometry is self-similar in M, so uScale ∝ M as the hole feeds.
          const bh = blackHole;
          const minDim = Math.min(w, h);
          const bhIntro = bh ? 1 - Math.pow(1 - Math.min(1, bh.t / 1.3), 3) : 0;
          const bhScale = bh ? Math.max(0.01, bh.mass * bhIntro) : 0;
          const rsPhys = bh ? 0.02857 * minDim * bh.mass : 0;
          const blackHoleRadius = rsPhys * 2.598 * bhIntro;
          const cPx = 2.6 * minDim;                       // speed of light in px/s
          const GM = 0.5 * rsPhys * cPx * cPx * 2.4;            // r_s = 2GM/c²
          const collapseProgress = bh ? bh.feed : 0;

          // Re-emerge instead of dying: the sheet fades back in every cycle.
          const sceneAlpha = phase === 'void' ? 0
            : phase === 'run' ? Math.min(1, simFrame / F_FADE)
            : phase === 'hold' && !blackHole ? Math.max(0, Math.min(1, (F_HOLD - phaseFrame) / F_FADE))
            : bh ? 1 - bh.fade : 1;

          ctx.clearRect(0, 0, w, h);
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = sceneAlpha;
          if (sceneAlpha <= 0.001) { ctx.globalAlpha = 1; return; }

          const u = (simFrame / F_RUN) * 2 - 1;

          // Ram-pressure braking of the baryons (smooth sigmoid), and the small
          // gravitational deflection of both subclusters as they pass.
          const S = 1.0 / (1.0 + Math.exp(-8.0 * u));
          const deflection = 65 * Math.tanh(1.8 * u);

          // Collisionless DM (and galaxies) keep going; the gas is slowed, not
          // stopped — after the pass it lags its halo but still moves with it,
          // ending between the two DM peaks (as observed in 1E 0657-56).
          // The light bullet moves fast; the massive main cluster barely recoils.
          // Path compressed on desktop so the clusters enter and leave inside the right half.
          const pathK = w < 768 ? 1 : 0.5;
          const primaryX = u * 1900 * pathK;
          const secondaryX = -u * 750 * pathK;
          const gasPos1 = primaryX * (1 - 0.55 * S);
          const gasPos2 = secondaryX * (1 - 0.55 * S);
          const z1 = -85 + deflection;
          const z2 = 95 - deflection * 0.85;

          const activeHalos = [
            { kind: 'dm',  x: primaryX,   z: z1, r: 470, mass: DM1_MASS,  color: isDarkNow ? {r: 80, g: 125, b: 235, a: 0.52} : {r: 45, g: 85, b: 200, a: 0.30} },
            { kind: 'dm',  x: secondaryX, z: z2, r: 820, mass: DM2_MASS,  color: isDarkNow ? {r: 80, g: 125, b: 235, a: 0.52} : {r: 45, g: 85, b: 200, a: 0.30} },
            { kind: 'gas', x: gasPos1,    z: z1, r: 260, mass: GAS1_MASS },
            { kind: 'gas', x: gasPos2,    z: z2, r: 420, mass: GAS2_MASS }
          ];

          const yaw = Math.sin(elapsed * 0.09) * 0.2, yawC = Math.cos(yaw), yawS = Math.sin(yaw);
          const project = (x, y, z) => {
            const fov = 900;
            { const ZC = 900, xr = x * yawC - (z - ZC) * yawS; z = x * yawS + (z - ZC) * yawC + ZC; x = xr; }
            if (z < -800) return null;
            const sceneScale = w < 768 ? Math.min(0.5, w / 1200) : Math.min(0.29, w / 4300, h / 2500);
            const scale = (fov / (fov + z)) * sceneScale;
            return { sx: w * (w < 768 ? 0.5 : 0.72) + x * scale, sy: h * 0.52 - (z * 0.22) * scale + y * scale, scale, z };
          };

          const thetaE = bh ? blackHoleRadius * 1.45 * (1 - bh.fade) : 0;
          const lens = (proj) => {
            // Point-mass lens, primary image: θ = (β + √(β² + 4θ_E²)) / 2. Background
            // lines are pushed outward and pile up on the Einstein ring.
            if (!bh || thetaE <= 0) return;
            const dx = proj.sx - bh.x, dy = proj.sy - bh.y, beta = Math.hypot(dx, dy) || 1e-3;
            const k = 0.5 * (beta + Math.sqrt(beta * beta + 4 * thetaE * thetaE)) / beta;
            proj.sx = bh.x + dx * k; proj.sy = bh.y + dy * k;
          };

          // 3D lattice: every node is pulled toward the dark-matter halos (not the gas),
          // so the lines pinch around the lensing peaks like a curved volume.
          // Box sized from the viewport so even the back plane spans the whole hero.
          const sceneScaleG = w < 768 ? Math.min(0.5, w / 1200) : Math.min(0.29, w / 4300, h / 2500);
          const Z0 = -560, Z1 = 1500;
          const farScale = sceneScaleG * 900 / (900 + Z1);
          const halfX = (w * (w < 768 ? 0.5 : 0.72) / farScale) * 1.18, halfY = (h * 0.62 / farScale);
          const SX = Math.max(240, (2 * halfX) / 26), SY = Math.max(240, (2 * halfY) / 15), SZ = 206;
          const LX = Math.ceil(2 * halfX / SX) + 1, LY = Math.ceil(2 * halfY / SY) + 1, LZ = Math.round((Z1 - Z0) / SZ) + 1;
          const pullers = activeHalos.map(hl => ({ x: hl.x, z: hl.z, R2: Math.pow(hl.r * (hl.kind === 'dm' ? 1.7 : 1.2), 2), k: 0.62 * hl.mass / DM2_MASS }));
          const points = [];
          for (let xi = 0; xi < LX; xi++) {
            points[xi] = [];
            for (let yi = 0; yi < LY; yi++) {
              points[xi][yi] = [];
              for (let zi = 0; zi < LZ; zi++) {
                let x = (xi - (LX - 1) / 2) * SX, y = (yi - (LY - 1) / 2) * SY, z = Z0 + zi * SZ;
                let dx = 0, dy = 0, dz = 0, depth = 0;
                for (let k = 0; k < pullers.length; k++) {
                  const P = pullers[k], ex = P.x - x, ey = -y, ez = P.z - z;
                  const d2 = ex * ex + ey * ey + ez * ez;
                  if (d2 > P.R2 * 9) continue;
                  const a = P.k * Math.exp(-d2 / P.R2);
                  dx += ex * a; dy += ey * a; dz += ez * a; depth += a;
                }
                const proj = project(x + dx, y + dy, z + dz);
                if (proj) { lens(proj); proj.intensity = Math.min(1, depth * 1.6); }
                points[xi][yi][zi] = proj;
              }
            }
          }

          ctx.globalCompositeOperation = isDarkNow ? 'screen' : 'multiply';
          activeHalos.filter(hl => hl.kind === 'dm').sort((a, b) => b.z - a.z).forEach(halo => {
            const proj = project(halo.x, 0, halo.z);
            if (!proj) return;
            let radius = halo.r * proj.scale * 1.8;
            if (radius <= 0) return;
            let opacity = halo.color.a;
            if (blackHole) {
              opacity *= Math.pow(1 - collapseProgress, 1.5);
              const dx = blackHole.x - proj.sx, dy = blackHole.y - proj.sy;
              const pull = Math.pow(collapseProgress, 1.6) * 0.96;
              proj.sx += dx * pull; proj.sy += dy * pull;
              radius *= Math.max(0.08, 1 - collapseProgress * 0.9);
            }
            const gradient = ctx.createRadialGradient(proj.sx, proj.sy, 0, proj.sx, proj.sy, radius);
            gradient.addColorStop(0, `rgba(${halo.color.r}, ${halo.color.g}, ${halo.color.b}, ${opacity})`);
            gradient.addColorStop(0.5, `rgba(${halo.color.r}, ${halo.color.g}, ${halo.color.b}, ${opacity * 0.55})`);
            gradient.addColorStop(1, `rgba(${halo.color.r}, ${halo.color.g}, ${halo.color.b}, 0)`);
            ctx.beginPath();
            ctx.arc(proj.sx, proj.sy, radius, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
          });

          ctx.globalCompositeOperation = 'source-over';
          ctx.lineWidth = 1;

          // Segments are bucketed by colour/alpha so ~15k lines cost a few dozen strokes.
          const buckets = new Map();
          const addSeg = (p1, p2) => {
            if (!p1 || !p2) return;
            if ((p1.sx < -40 && p2.sx < -40) || (p1.sx > w + 40 && p2.sx > w + 40) || (p1.sy < -40 && p2.sy < -40) || (p1.sy > h + 40 && p2.sy > h + 40)) return;
            const ratio = (p1.scale + p2.scale) / 2 / sceneScaleG;
            const alphaDepth = Math.max(0.3, Math.min(1, 0.3 + (ratio - 0.37) * 0.45));
            const key = Math.round(((p1.intensity + p2.intensity) / 2) * 9) * 16 + Math.round(alphaDepth * 9);
            let arr = buckets.get(key); if (!arr) buckets.set(key, arr = []);
            arr.push(p1.sx, p1.sy, p2.sx, p2.sy);
          };
          for (let xi = 0; xi < LX; xi++) for (let yi = 0; yi < LY; yi++) for (let zi = 0; zi < LZ; zi++) {
            const p = points[xi][yi][zi];
            if (xi < LX - 1) addSeg(p, points[xi + 1][yi][zi]);
            if (yi < LY - 1) addSeg(p, points[xi][yi + 1][zi]);
            if (zi < LZ - 1) addSeg(p, points[xi][yi][zi + 1]);
          }
          buckets.forEach((arr, key) => {
            const t = Math.floor(key / 16) / 9, d = (key % 16) / 9;
            const r = Math.round(theme.base[0] + (theme.well[0] - theme.base[0]) * t);
            const g = Math.round(theme.base[1] + (theme.well[1] - theme.base[1]) * t);
            const b = Math.round(theme.base[2] + (theme.well[2] - theme.base[2]) * t);
            const a = (theme.alphaBase * 0.75 + (theme.alphaGlow - theme.alphaBase) * t) * d;
            ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${a.toFixed(3)})`;
            ctx.beginPath();
            for (let i = 0; i < arr.length; i += 4) { ctx.moveTo(arr[i], arr[i + 1]); ctx.lineTo(arr[i + 2], arr[i + 3]); }
            ctx.stroke();
          });

          ctx.globalCompositeOperation = isDarkNow ? 'screen' : 'source-over';

          const shock = Math.exp(-6.0 * u * u);   // peaks at closest approach

          // ── X-ray gas: diffuse clouds. Core compressed at the leading edge (bow
          // shock), ram-pressure-stripped tail streaming behind. Pink, as in the
          // Chandra composite; DM is blue (lensing map), galaxies gold.
          const wellY = (x, z) => {
            let y = 0;
            for (let k = 0; k < activeHalos.length; k++) {
              const hl = activeHalos[k], dx = x - hl.x, dz = z - hl.z;
              y += hl.mass * Math.exp(-(dx * dx + dz * dz) / (hl.r * hl.r));
            }
            return y;
          };
          const gasRGB = isDarkNow ? '255, 60, 55' : '190, 25, 25';
          // Gas is present all along, but faint before impact: shock heating at
          // collision makes it X-ray bright, and it stays hot afterwards.
          const heat = 0.3 + 0.7 * Math.max(shock, S);
          const gasA = (isDarkNow ? 0.58 : 0.36) * heat;
          const blobs = [];
          // Main cluster gas: larger, fainter. The "bullet": smaller, denser, brighter.
          [[gasPos1, z1, 1, 220, 1.0], [gasPos2, z2, -1, 360, 0.8]].forEach(([gx, gz, lead, gr, br]) => {
            blobs.push({ x: gx + lead * 40 * shock, z: gz, r: gr * (1 - 0.15 * shock), a: gasA * br });
            for (let k = 1; k <= 2; k++) {

            }
          });
          blobs.forEach((b, bi) => {
            if (b.a <= 0.005) return;
            const proj = project(b.x, 0, b.z);
            if (!proj) return;
            let rx = b.r * proj.scale * 1.6, a = b.a;
            if (blackHole) {
              a *= Math.pow(1 - collapseProgress, 1.5);
              const dx = blackHole.x - proj.sx, dy = blackHole.y - proj.sy;
              const pull = Math.pow(collapseProgress, 1.6) * 0.96;
              proj.sx += dx * pull; proj.sy += dy * pull;
              rx *= Math.max(0.08, 1 - collapseProgress * 0.9);
            }
            if (rx <= 0) return;
            ctx.save();
            ctx.translate(proj.sx, proj.sy);
            // Turbulent cloud: a core plus drifting, breathing puffs, so the
            // outline is irregular instead of a clean ellipse.
            const puffs = [[0, 0, rx * 0.7, a * 0.7]];
            for (let k = 0; k < 7; k++) {
              const ang = k * 0.8976 + bi * 1.3 + elapsed * 0.12 * (k % 2 ? 1 : -1);
              const d = rx * 0.38 * (1 + 0.35 * Math.sin(elapsed * 0.7 + k * 1.7 + bi));
              const pr = rx * 0.5 * (0.75 + 0.3 * Math.sin(elapsed * 0.55 + k * 2.3 + bi * 0.7));
              puffs.push([Math.cos(ang) * d, Math.sin(ang) * d * 0.7, pr, a * 0.42]);
            }
            puffs.forEach(([px, py, pr, pa]) => {
              const g = ctx.createRadialGradient(px, py, 0, px, py, pr);
              g.addColorStop(0, `rgba(${gasRGB}, ${pa})`);
              g.addColorStop(0.5, `rgba(${gasRGB}, ${pa * 0.5})`);
              g.addColorStop(1, `rgba(${gasRGB}, 0)`);
              ctx.fillStyle = g;
              ctx.beginPath();
              ctx.arc(px, py, pr, 0, Math.PI * 2);
              ctx.fill();
            });
            ctx.restore();
          });

          // DM core pass, drawn over the gas: before the collision the gas sits
          // inside its halo and would otherwise hide the blue completely.
          activeHalos.filter(hl => hl.kind === 'dm').forEach(halo => {
            const proj = project(halo.x, 0, halo.z);
            if (!proj) return;
            let radius = halo.r * proj.scale * 0.95;
            let a = halo.color.a * 0.6;
            if (blackHole) {
              a *= Math.pow(1 - collapseProgress, 1.5);
              const dx = blackHole.x - proj.sx, dy = blackHole.y - proj.sy;
              const pull = Math.pow(collapseProgress, 1.6) * 0.96;
              proj.sx += dx * pull; proj.sy += dy * pull;
              radius *= Math.max(0.08, 1 - collapseProgress * 0.9);
            }
            if (radius <= 0) return;
            const c = `${halo.color.r}, ${halo.color.g}, ${halo.color.b}`;
            const g = ctx.createRadialGradient(proj.sx, proj.sy, 0, proj.sx, proj.sy, radius);
            g.addColorStop(0, `rgba(${c}, ${a})`);
            g.addColorStop(1, `rgba(${c}, 0)`);
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(proj.sx, proj.sy, radius, 0, Math.PI * 2);
            ctx.fill();
          });

          // Bow shock: a thin bright arc running ahead of the bullet's gas once it
          // has punched through the main cluster.
          const shockOn = S * Math.min(1, Math.max(0, u * 3));
          if (false && shockOn > 0.02) {
            const sx = gasPos1 + 260;
            const sp = project(sx, wellY(sx, z1) * 0.6, z1);
            if (sp) {
              let a = (isDarkNow ? 0.75 : 0.55) * shockOn;
              let rr = 300 * sp.scale * 1.6;
              if (blackHole) {
                a *= Math.pow(1 - collapseProgress, 1.5);
                const dx = blackHole.x - sp.sx, dy = blackHole.y - sp.sy;
                const pull = Math.pow(collapseProgress, 1.6) * 0.96;
                sp.sx += dx * pull; sp.sy += dy * pull;
                rr *= Math.max(0.08, 1 - collapseProgress * 0.9);
              }
              ctx.save();
              ctx.translate(sp.sx - rr, sp.sy);
              ctx.scale(1, 0.55);
              ctx.lineCap = 'round';
              [[5, 0.25], [1.6, 1]].forEach(([lw, k]) => {
                ctx.strokeStyle = `rgba(${isDarkNow ? '255, 190, 225' : '200, 30, 110'}, ${(a * k).toFixed(3)})`;
                ctx.lineWidth = lw;
                ctx.beginPath();
                ctx.arc(0, 0, rr, -0.85, 0.85);
                ctx.stroke();
              });
              ctx.restore();
            }
          }

          particles.forEach(p => {
            let worldX = 0, worldY = 0, worldZ = 0, customColor = null;

            if (p.type === 'halo_dm' || p.type === 'galaxy') {
              p.theta += p.speed * step;
              const halo = activeHalos[p.haloIdx];
              const r = p.rFactor * (halo.r * (p.type === 'galaxy' ? 0.9 : 0.65));
              const c = Math.cos(p.theta), s = Math.sin(p.theta);
              worldX = halo.x + r * (c * p.e1[0] + s * p.e2[0]);
              // Keep galaxies on the sheet: a large vertical offset makes them look
              // detached from the spacetime grid.
              worldY = r * (c * p.e1[1] + s * p.e2[1]) * (p.type === 'galaxy' ? 0.45 : 0.55);
              worldZ = halo.z + r * (c * p.e1[2] + s * p.e2[2]);
              if (p.type === 'galaxy') {
                customColor = isDarkNow ? p.colD : p.colL;
              } else {
                customColor = isDarkNow ? '130, 175, 255' : '30, 70, 190';
              }

            } else if (p.type === 'gas_plasma') {
              p.theta += p.turbSpeed * step;
              const isPrimary = p.gasIdx === 0;
              const lead = isPrimary ? 1 : -1;      // direction of travel in x
              const r = p.rFactor * 340;
              // Bow shock: the leading hemisphere is compressed, the trailing
              // one is drawn out — the classic "bullet" cone.
              const nose = Math.tanh(3.0 * Math.cos(p.theta) * lead);
              const squash = 1 - shock * (0.45 * Math.max(0, nose) - 0.35 * Math.max(0, -nose));
              worldX = (isPrimary ? gasPos1 : gasPos2) + Math.cos(p.theta) * r * squash;
              worldZ = (isPrimary ? z1 : z2) + Math.sin(p.theta) * (r * 0.65) * (1 + 0.45 * shock);
              worldY = Math.sin(p.theta * 2 + elapsed * 1.2) * 25 * (1 - S * 0.5);
              if (isDarkNow) {
                customColor = p.colorVariant < 0.5 ? '255, 51, 75' : p.colorVariant < 0.8 ? '255, 105, 180' : '255, 175, 50';
              } else {
                customColor = p.colorVariant < 0.5 ? '180, 25, 45' : p.colorVariant < 0.8 ? '150, 40, 110' : '180, 90, 10';
              }

            } else {
              // Ram-pressure stripped plasma trails BEHIND the moving gas cloud,
              // i.e. opposite to its direction of travel.
              p.progress += p.speed * step;
              if (p.progress > 1) p.progress -= 1;
              const isPrimary = p.side > 0;
              const lead = isPrimary ? 1 : -1;
              const gasX = isPrimary ? gasPos1 : gasPos2;
              worldX = gasX - lead * (380 * S) * p.progress;
              worldZ = (isPrimary ? z1 : z2) + Math.sin(p.progress * Math.PI * 2 + elapsed * 0.6) * (p.spread * 0.4);
              worldY = Math.sin(p.progress * Math.PI) * 20 * S;
              customColor = isDarkNow ? '210, 140, 255' : '120, 55, 160';
            }

            let proj = project(worldX, worldY, worldZ);
            let tidal = null, redshift = 1;
            if (bh && p.type === 'galaxy') {
              // Geodesic infall in the Paczyński–Wiita potential Φ = −GM/(r − r_s): it reproduces
              // the Schwarzschild ISCO (3 r_s) and marginally-bound orbit (2 r_s), so anything
              // inside ~3 r_s plunges. Dynamical friction bleeds off angular momentum.
              if (!p.bh) {
                bh.total++;
                if (!proj || proj.scale <= 0.05) { p.bh = { eaten: true }; bh.eaten++; return; }
                const rx = proj.sx - bh.x, ry = proj.sy - bh.y, r = Math.max(rsPhys * 3, Math.hypot(rx, ry));
                const vc = Math.sqrt(GM * r) / (r - rsPhys), vt = 0.25 * vc * (Math.random() * 0.6 + 0.7);
                p.bh = { x: rx, y: ry, vx: -ry / r * vt, vy: rx / r * vt, scale: proj.scale, depth: Math.max(0, Math.min(1, (proj.scale - 0.1) * 2.5)) };
              }
              const st = p.bh;
              if (st.eaten) return;
              const gamma = 1.2 + Math.max(0, bh.t - 7) * 0.56;
              const dtF = step / 60 * 0.504;
              const r0 = Math.hypot(st.x, st.y);
              const n = Math.min(60, Math.max(1, Math.ceil(dtF * Math.hypot(st.vx, st.vy) / Math.max(1.5, 0.12 * (r0 - rsPhys)))));
              const hs = dtF / n;
              for (let i = 0; i < n; i++) {
                const r = Math.hypot(st.x, st.y);
                if (r <= rsPhys * 1.02) { st.eaten = true; break; }
                const a = GM / ((r - rsPhys) * (r - rsPhys));
                st.vx -= a * st.x / r * hs; st.vy -= a * st.y / r * hs;
                const vr = (st.vx * st.x + st.vy * st.y) / r, fr = Math.min(1, gamma * hs);
                st.vx -= (st.vx - vr * st.x / r) * fr; st.vy -= (st.vy - vr * st.y / r) * fr;
                const v = Math.hypot(st.vx, st.vy);
                if (v > cPx) { st.vx *= cPx / v; st.vy *= cPx / v; }
                st.x += st.vx * hs; st.y += st.vy * hs;
              }
              if (st.eaten) { bh.eaten++; return; }
              const r = Math.hypot(st.x, st.y);
              // Gravitational redshift g = √(1 − r_s/r) dims and reddens; tides ∝ r⁻³ stretch radially.
              redshift = Math.sqrt(Math.max(0, 1 - rsPhys / r));
              const e = Math.min(4.5, 1 + 10 * Math.pow(rsPhys / r, 2));
              if (e > 1.03) tidal = { ang: Math.atan2(st.y, st.x), e };
              proj = { sx: bh.x + st.x, sy: bh.y + st.y, scale: st.scale };
            }
            if (!proj || proj.scale <= 0.05) return;

            const depthAlpha = Math.max(0, Math.min(1, (proj.scale - 0.1) * 2.5));
            let finalAlpha = p.baseAlpha * depthAlpha;
            if (p.type === 'stripped_gas') finalAlpha *= S * (1 - p.progress * 0.65);

            if (finalAlpha > 0.01 && p.type === 'galaxy') {
              // Tiny tilted elliptical galaxy: bright core fading into a soft glow.
              // Per-morphology factor so every type reads ~10% larger than the old blob.
              const gr = Math.max(0.7, p.size * proj.scale * 2.2 * [1.02, 0.77, 0.75, 1.08][p.morph ?? 0] * (isDarkNow ? 1 : 1.3));
              ctx.save();
              ctx.translate(proj.sx, proj.sy);
              if (tidal) { ctx.rotate(tidal.ang); ctx.scale(tidal.e, p.aspect / Math.sqrt(tidal.e)); }
              else { ctx.rotate(p.tilt); ctx.scale(1, p.aspect); }
              ctx.globalAlpha = Math.min(1, sceneAlpha * finalAlpha * redshift * (isDarkNow ? 1 : 1.6));
              ctx.drawImage(galaxySprite(isDarkNow ? (p.morph === 3 ? '255, 245, 225' : '245, 248, 255') : (p.morph === 3 ? '255, 225, 40' : '255, 255, 255'), customColor, p.morph), -gr, -gr, gr * 2, gr * 2);
              if (redshift < 0.97) {
                ctx.globalAlpha = sceneAlpha * finalAlpha * (1 - redshift) * 0.9;
                ctx.drawImage(galaxySprite(isDarkNow ? '255, 150, 90' : '170, 40, 20', isDarkNow ? '255, 70, 40' : '150, 30, 20', p.morph), -gr, -gr, gr * 2, gr * 2);
              }
              ctx.restore();
            } else if (finalAlpha > 0.01) {
              ctx.fillStyle = `rgba(${customColor || theme.particleColor}, ${finalAlpha.toFixed(3)})`;
              ctx.beginPath();
              ctx.arc(proj.sx, proj.sy, Math.max(0.1, p.size * proj.scale), 0, Math.PI * 2);
              ctx.fill();
            }
          });

          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = 'source-over';

          // ── accretion-disk shader pass (only while a black hole exists) ─────
          currentMouse.lerp(targetMouse, 0.05);
          uniforms.uMouse.value.copy(currentMouse);
          uniforms.uTime.value = diskClock;

          let opacity = 0;
          if (bh) {
            // Accreted galaxies add mass: M grows smoothly toward 1 + 1.6·(fraction eaten).
            const frac = bh.total ? bh.eaten / bh.total : 0;
            const ease = 1 - Math.exp(-step / 57);
            bh.feed += (frac - bh.feed) * ease;
            bh.mass += (1 + 1.6 * frac - bh.mass) * ease;
            if (bh.total && bh.eaten >= bh.total) bh.doneT += step / 60;
            if (bh.doneT > 1.0) bh.fade = Math.min(1, bh.fade + step / 100);
            const f = bh.fade * bh.fade * (3 - 2 * bh.fade);
            opacity = Math.min(1, bh.t / 0.6) * (1 - f);
            uniforms.uScale.value = bhScale;
          }
          uniforms.uOpacity.value = opacity;

          if (renderer) {
            if (opacity > 0.002) renderer.render(scene, camera);
            else renderer.clear();
          }
        };

        // Fixed timestep: identical pacing on 60 Hz and 120 Hz+ displays.
        const tick = (ts) => {
          rafId = requestAnimationFrame(tick);
          if (lastTs === null) lastTs = ts;
          const dt = ts - lastTs;
          lastTs = ts;
          if (!visible || paused) return;
          const step = Math.max(0, Math.min(3, dt / 16.667));
          elapsed += step / 60;
          // Mass grows as uScale, so proper-time at fixed r/M dilates by the same factor.
          diskClock += (step / 60) / Math.max(0.25, uniforms.uScale.value);
          drawFrame(step);
        };

        if (REDUCED_MOTION) {
          // One static frame at the moment of closest approach — the offset is
          // the informative part, and nothing moves.
          setTimeout(() => { simFrame = F_RUN * 0.62; drawFrame(0); }, 60);
        } else {
          rafId = requestAnimationFrame(tick);
        }

        return () => {
          window.removeEventListener('resize', resizeCanvas);
          window.removeEventListener('mousemove', onPointerMove);
          window.removeEventListener('touchmove', onPointerMove);
          canvas2D.removeEventListener('click', onCanvasClick);
          if (observer) observer.disconnect();
          if (resizeObserver) resizeObserver.disconnect();
          if (rafId) cancelAnimationFrame(rafId);
          geometry.dispose();
          material.dispose();
          if (renderer) renderer.dispose();
          simRef.current = null;
        };
      }, []);

      return (
        <div className="absolute inset-0 w-full h-full z-0 overflow-hidden">
          <div className="absolute inset-0" style={{ WebkitMaskImage: 'linear-gradient(to bottom, transparent 0, transparent 96px, #000 200px)', maskImage: 'linear-gradient(to bottom, transparent 0, transparent 96px, #000 200px)' }}>

          >
            <i className={`fa-solid ${simOn ? 'fa-eye-slash' : 'fa-eye'} text-[11px]`}></i>
          </button>
        </div>
      );
    };

    // Album row: one horizontal line of photos, scroll-snap + arrow buttons.
    function PhotoSlider({ images, title, isDark, onOpen }) {
      const ref = useRef(null);
      const [edge, setEdge] = useState({ start: true, end: false });

        const el = ref.current; if (!el || el.clientWidth === 0) return;
        setEdge({ start: el.scrollLeft < 4, end: el.scrollLeft + el.clientWidth >= el.scrollWidth - 4 });
      };
      useEffect(() => {
        // Re-measure whenever the row or its content changes size (fonts, images, reveal).
        const el = ref.current; if (!el) return;
        const ro = new ResizeObserver(update);
        ro.observe(el); Array.from(el.children).forEach(c => ro.observe(c));
        requestAnimationFrame(update);
        return () => ro.disconnect();
      }, []);

                <div className="absolute inset-0 bg-cosmic-void/0 group-hover/img:bg-cosmic-void/30 transition-all duration-300 flex items-center justify-center"><div className={`w-8 h-8 rounded-full backdrop-blur-md flex items-center justify-center opacity-0 group-hover/img:opacity-100 transition-all duration-300 ${isDark ? 'bg-white/10' : 'bg-white/20'}`}><i className="fa-solid fa-expand text-white text-xs drop-shadow"></i></div></div>
              </div>
            ))}
          </div>
          {btn(1, edge.end)}
        </div>
      );

                              </h3>
                              {item.by && <span className={`shrink-0 text-xs font-medium ${isDark ? 'text-zinc-400' : 'text-stone-500'}`}>{item.by}</span>}
                            </div>
                            <p className={`mt-3 border-t pt-3 text-sm leading-relaxed ${isDark ? 'border-white/[0.06] text-zinc-400' : 'border-stone-100 text-stone-500'}`}>{item.note}</p>
                          </a>
                        </Reveal>
                      ))}
                    </div>
                  </section>
                ))}
              </div>
            </div>
          )}

          {currentPage === 'blog' && (
            <div className={`pt-28 pb-16 min-h-screen animate-fade-in ${isDark ? 'bg-cosmic-void' : 'bg-cream'}`}>
              <div className="max-w-6xl mx-auto px-6">
                <div className="mb-12"><SectionHeader instant eyebrow="Gallery" title="Travel & Photography" /><p className={`text-xs mt-4 ${isDark ? 'text-zinc-500' : 'text-stone-500'}`}>Memories from various trips and places.</p></div>

                {/* Single-photo posts pair up side by side; multi-photo albums span the full row. */}
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-5 md:gap-6 grid-flow-row-dense">
                  {blogPosts.map((post, idx) => {
                    const single = !post.images || post.images.length <= 1;
                    // Only big albums need the full row; small ones (≤3, e.g. portraits) share a row.
                    const wide = post.images && post.images.length > 3;
                    return (
                    <Reveal key={post.id} instant className={wide ? 'md:col-span-2 lg:col-span-6' : single ? 'h-full lg:col-span-2' : 'h-full lg:col-span-4'}>
                      <div className={`h-full flex flex-col rounded-xl border overflow-hidden transition-colors duration-300 ${isDark ? 'bg-white/[0.035] border-white/[0.08] hover:border-white/[0.14]' : 'bg-[#FDFBF5]/85 border-stone-200 hover:border-stone-300'}`}>
                        {post.images && post.images.length > 0 && (
                          <div className={`${wide ? 'p-3 md:p-4' : 'p-2 md:p-3'} border-b ${isDark ? 'bg-white/[0.01] border-white/[0.04]' : 'bg-[#F3EFE3] border-stone-200'}`}>
                            {post.images.length >= 3 ? (
                              <PhotoSlider images={post.images} title={post.title} isDark={isDark} onOpen={setSelectedImage} />
                            ) : (
                            <div className={`grid gap-2 ${post.images.length === 1 ? 'grid-cols-1' : post.images.length === 2 ? 'grid-cols-2' : 'grid-cols-2 sm:grid-cols-3'}`}>
                              {post.images.map((imgUrl, index) => {
                                const rotations = ['rotate-[-1deg]', 'rotate-[1deg]', 'rotate-[-0.5deg]', 'rotate-[0.5deg]'];
                                const rotClass = post.images.length > 1 ? rotations[index % 4] : '';
                                return (
                                  <div key={index} className={`relative aspect-[4/3] overflow-hidden rounded-lg shadow-md cursor-pointer group/img transition-all duration-500 hover:z-20 hover:scale-[1.03] hover:rotate-0 border-2 ${isDark ? 'bg-zinc-900 border-white/10' : 'bg-[#EBE5D6] border-[#FDFBF5]'} ${rotClass}`} onClick={() => setSelectedImage(imgUrl)}>
                                    <img src={imgUrl} alt={`${post.title} ${index + 1}`} className="w-full h-full object-cover transition-transform duration-500 group-hover/img:scale-105" onError={(e) => { if (!e.target.dataset.fallbackTriggered) { e.target.dataset.fallbackTriggered = "true"; e.target.src = "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=800&q=80"; }}} />
                                    <div className="absolute inset-0 bg-cosmic-void/0 group-hover/img:bg-cosmic-void/30 transition-all duration-300 flex items-center justify-center"><div className={`w-8 h-8 rounded-full backdrop-blur-md flex items-center justify-center opacity-0 group-hover/img:opacity-100 transition-all duration-300 ${isDark ? 'bg-white/10' : 'bg-white/20'}`}><i className="fa-solid fa-expand text-white text-xs drop-shadow"></i></div></div>
                                  </div>
                                );
                              })}
                            </div>
                            )}
                          </div>
                        )}
                        <div className={`${wide ? 'px-4 py-2.5 md:px-5' : 'px-3 py-2 md:px-4 md:py-2.5'} flex-1`}>
                          <div className="flex items-center gap-2 mb-1"><span className={`eyebrow ${isDark ? 'text-glowred' : 'text-darkred-700'}`}>{post.type}</span><span className={`text-xs ${isDark ? 'text-white/[0.1]' : 'text-stone-500'}`}>·</span><span className={`text-xs ${isDark ? 'text-zinc-500' : 'text-stone-500'}`}>{post.date}</span></div>
                          <h3 className={`text-base font-semibold ${isDark ? 'text-white' : 'text-stone-900'}`}>{post.title}</h3>
                          {post.content && post.content.trim() !== "" && <p className={`text-sm leading-relaxed mt-2 ${isDark ? 'text-zinc-400' : 'text-stone-500'}`}>{post.content}</p>}
                        </div>
                      </div>
                    </Reveal>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {selectedImage && (
            <div className={`fixed inset-0 z-[100] flex items-center justify-center backdrop-blur-md p-4 md:p-12 animate-fade-in-modal cursor-zoom-out ${isDark ? 'bg-black/95' : 'bg-stone-950/97'}`} onClick={() => setSelectedImage(null)}>
              <button className="absolute top-4 right-4 md:top-6 md:right-6 text-zinc-300 hover:text-glowred z-10 w-9 h-9 flex items-center justify-center rounded-full border border-white/[0.14] bg-white/5 hover:border-glowred/50 transition-colors duration-300" onClick={() => setSelectedImage(null)}><i className="fa-solid fa-xmark text-xs"></i></button>
              <img src={selectedImage} alt="Expanded view" className="max-w-full max-h-full rounded-lg shadow-2xl object-contain animate-scale-up-modal cursor-default border border-white/10" onClick={(e) => e.stopPropagation()} onError={(e) => { if (!e.target.dataset.fallbackTriggered) { e.target.dataset.fallbackTriggered = "true"; e.target.src = "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1600&q=80"; }}} />
            </div>
          )}

          <footer id="contact" className={`transition-colors duration-450 py-14 border-t-2 ${isDark ? 'bg-cosmic-dust text-zinc-400 border-glowred/30 shadow-inner' : 'bg-darkred-700 text-darkred-100 border-darkred-900/50'}`}>
            <div className="max-w-5xl mx-auto px-6">
              <Reveal instant>
                <div>
                  <p className={`eyebrow mb-4 ${isDark ? 'text-zinc-600' : 'text-darkred-300'}`}>Contact</p>
                  <h2 className="font-display text-2xl font-semibold text-white mb-6">Get in Touch</h2>
                  <div className="flex flex-col gap-4">
                    <a href="mailto:shivamg.phy@gmail.com" className={`flex items-center gap-3 text-sm transition-colors group ${isDark ? 'hover:text-glowred' : 'hover:text-white'}`}>
                      <div className={`w-8 h-8 rounded-full border flex items-center justify-center transition-all shrink-0 ${isDark ? 'bg-white/[0.03] border-white/[0.08] group-hover:border-glowred/50' : 'bg-white/10 border-white/20 group-hover:border-white/60'}`}>
                        <i className={`fa-solid fa-envelope text-xs transition-colors ${isDark ? 'text-zinc-400 group-hover:text-glowred' : 'text-darkred-100 group-hover:text-white'}`}></i>
                      </div>
                      shivamg.phy@gmail.com
                    </a>
                    <div className="flex items-center gap-3 text-sm cursor-default">
                      <div className={`w-8 h-8 rounded-full border flex items-center justify-center shrink-0 ${isDark ? 'bg-white/[0.03] border-white/[0.08]' : 'bg-white/10 border-white/20'}`}>
                        <i className={`fa-solid fa-location-dot text-xs ${isDark ? 'text-zinc-400' : 'text-darkred-100'}`}></i>
                      </div>
                      IIT Bombay, Mumbai, Maharashtra 400076
                    </div>
                  </div>
                </div>
              </Reveal>
            </div>
            <Reveal instant>
              <div className={`max-w-5xl mx-auto px-6 mt-10 pt-6 border-t text-xs flex flex-col sm:flex-row justify-between items-center gap-4 ${isDark ? 'border-white/[0.05] text-zinc-500' : 'border-white/10 text-darkred-200'}`}>
                <p className="whitespace-nowrap">© 2026 Dr. Shivam Gola</p>
                <div className="flex gap-5">
                  <a href="https://inspirehep.net/authors/1867679" target="_blank" rel="noopener noreferrer" className={`transition-colors ${isDark ? 'hover:text-glowred' : 'hover:text-white'}`}>iNSPIRE-HEP</a>
                  <a href="https://scholar.google.com/scholar?q=%22Shivam+Gola%22" target="_blank" rel="noopener noreferrer" className={`transition-colors ${isDark ? 'hover:text-glowred' : 'hover:text-white'}`}>Google Scholar</a>
                </div>
              </div>
            </Reveal>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
