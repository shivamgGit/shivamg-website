    const Reveal = ({ children, delay = 0, className = "" }) => {
      const ref = useRef(null);
      const [isVisible, setIsVisible] = useState(false);
      useEffect(() => {
        const fallbackTimer = setTimeout(() => setIsVisible(true), 600 + delay);
        const observer = new IntersectionObserver(
          ([entry]) => { if (entry.isIntersecting) { setIsVisible(true); clearTimeout(fallbackTimer); observer.unobserve(entry.target); } },
          { threshold: 0.05 }
        );
        if (ref.current) observer.observe(ref.current);
        return () => { clearTimeout(fallbackTimer); if (ref.current) observer.unobserve(ref.current); };
      }, [delay]);
      return (
        <div ref={ref} className={`transition-all duration-700 ease-out ${isVisible ? "opacity-100 translate-y-0" : "opacity-0 translate-y-8"} ${className}`} style={{ transitionDelay: `${delay}ms` }}>
          {children}
        </div>
      );

    const ParticleBackground = () => {
      const canvasRef = useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        const resizeCanvas = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        const particlesArray = [];
        const smColors = ['#7B1F1F', '#c04040', '#10b981', '#c9a63e', '#8b5cf6'];
        class Particle {
          constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.vx = (Math.random() - 0.5) * 2;
            this.vy = (Math.random() - 0.5) * 2;
            this.radius = Math.random() * 1.5 + 1;
            this.color = smColors[Math.floor(Math.random() * smColors.length)];
          }
          update() {
            this.x += this.vx; this.y += this.vy;
            if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
            if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;
          }
          draw() {
            ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.color; ctx.fill();
            ctx.shadowBlur = 6; ctx.shadowColor = this.color;
          }
        }
        for (let i = 0; i < 70; i++) particlesArray.push(new Particle());
        for (let f = 0; f < 180; f++) particlesArray.forEach(p => p.update());
        const animate = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          particlesArray.forEach((pi, i) => {
            pi.update(); pi.draw();
            particlesArray.slice(i).forEach(pj => {
              const dx = pi.x - pj.x, dy = pi.y - pj.y, dist = Math.sqrt(dx*dx + dy*dy);
              if (dist < 120) {
                ctx.beginPath(); ctx.strokeStyle = pi.color;
                ctx.globalAlpha = 0.65 * (1 - dist / 120); ctx.lineWidth = 0.5;
                ctx.moveTo(pi.x, pi.y); ctx.lineTo(pj.x, pj.y); ctx.stroke();
                ctx.globalAlpha = 1; ctx.shadowBlur = 0;
              }
            });
          });
          animationFrameId = requestAnimationFrame(animate);
        };
        animate();
        return () => { window.removeEventListener('resize', resizeCanvas); cancelAnimationFrame(animationFrameId); };
      }, []);
      return <canvas ref={canvasRef} className="absolute inset-0 z-0 opacity-30 pointer-events-none" />;
    };

                  </div>
                  <div className="grid md:grid-cols-3 gap-4">
                    {researchInterests.map((item, idx) => (
                      <Reveal key={item.id} delay={idx * 110} className="h-full">
                        <button
                          onClick={() => setActiveResearch(item.id)}
                          className={`group w-full h-full text-left p-6 rounded-xl transition-all duration-200 border ${
                            activeResearch === item.id
                              ? 'bg-cream shadow-md border-darkred-200'
                              : 'bg-cream/60 hover:bg-cream border-stone-200 hover:border-stone-300'
                          }`}
                        >
                          <div className="mb-4">{item.icon}</div>
                          <h3 className={`text-sm font-semibold mb-1 transition-colors ${activeResearch === item.id ? 'text-darkred-800' : 'text-stone-700'}`}>
                            {item.title}
                          </h3>
                          {activeResearch === item.id
                            ? <p className="text-stone-500 text-xs leading-relaxed mt-3 animate-fade-in">{item.description}</p>
                            : <p className="text-stone-300 text-xs mt-1">Tap to expand</p>
                          }
                        </button>
                      </Reveal>
                    ))}
                  </div>
                </div>
              </section>

              {/* Experience / Education / Achievements */}
              <section id="experience" className="py-24 bg-cream border-t border-stone-200/50">
                <div className="max-w-4xl mx-auto px-6">
                  <div className="mb-10">
                    <SectionHeader eyebrow="Background" title="Experience & Education" />
                  </div>

                  {/* Underline tabs */}
                  <Reveal>
                    <div className="flex items-center gap-8 mb-12 border-b border-stone-200">
                      <TabBtn label="Experience"    icon="fa-briefcase"     value="experience"    state={activeTab} setState={setActiveTab} />
                      <TabBtn label="Education"     icon="fa-graduation-cap" value="education"    state={activeTab} setState={setActiveTab} />
                      <TabBtn label="Achievements"  icon="fa-award"          value="achievements" state={activeTab} setState={setActiveTab} />
                    </div>
                  </Reveal>

                  {/* Timeline */}
                  <div className="space-y-4 relative before:absolute before:inset-0 before:ml-[1.1rem] before:h-full before:w-px before:bg-gradient-to-b before:from-stone-200 before:via-stone-100 before:to-transparent">
                    {activeTab === 'achievements' ? (
                      achievements.map((item, idx) => (
                        <Reveal key={idx} delay={idx * 90}>
                          <div className="relative flex items-center gap-5 group">
                            <div className="flex items-center justify-center w-9 h-9 rounded-full border-2 border-stone-200 bg-cream text-darkred-600 shrink-0 z-10 group-hover:border-darkred-300 group-hover:bg-darkred-50 transition-all">
                              <i className="fa-solid fa-award text-xs"></i>
                            </div>
                            <div className="flex-1 bg-cream-50 p-4 rounded-xl border border-stone-200 group-hover:border-stone-300 transition-all">
                              <p className="text-sm text-stone-700 font-medium">{item}</p>
                            </div>
                          </div>
                        </Reveal>
                      ))
                    ) : (
                      (activeTab === 'experience' ? experience : education).map((item, idx) => (
                        <Reveal key={idx} delay={idx * 120}>
                          <div className="relative flex items-start gap-5 group">
                            <div className="mt-1 flex items-center justify-center w-9 h-9 rounded-full border-2 border-stone-200 bg-cream text-darkred-600 shrink-0 z-10 group-hover:border-darkred-300 group-hover:bg-darkred-50 transition-all">
                              {activeTab === 'experience'
                                ? <i className="fa-solid fa-briefcase text-xs"></i>
                                : <i className="fa-solid fa-graduation-cap text-xs"></i>}
                            </div>
                            <div className="flex-1 bg-cream-50 p-5 rounded-xl border border-stone-200 group-hover:border-stone-300 transition-all">
                              <div className="flex flex-col md:flex-row md:items-start justify-between gap-2 mb-2">
                                <h4 className="text-sm font-semibold text-stone-900">{item.role || item.degree}</h4>
                                <span className="text-xs px-2.5 py-1 bg-stone-100 text-stone-400 rounded-full whitespace-nowrap font-medium">{item.period}</span>
                              </div>
                              <p className="text-xs text-stone-400 font-medium mb-2">{item.institution}</p>
                              {(item.description || item.details) && (
                                <p className="text-xs text-stone-400 leading-relaxed pt-2 border-t border-stone-100">{item.description || item.details}</p>
                              )}
                            </div>
                          </div>
                        </Reveal>
                      ))
                    )}
                  </div>
                </div>
              </section>

              {/* Publications */}
              <section id="publications" className="py-24 bg-cream-50 border-t border-stone-200/50">
                <div className="max-w-5xl mx-auto px-6">
                  <Reveal>
                    <div className="flex flex-col md:flex-row md:items-end justify-between mb-12 gap-5">
                      <div>
                        <p className="eyebrow mb-3">Academic Record</p>
                        <h2 className="text-3xl font-semibold text-stone-900">Selected Publications</h2>
                        <span className="section-rule"></span>
                      </div>
                      <div className="flex flex-wrap gap-2">
                        {[
                          { label: 'arXiv', href: 'https://arxiv.org/search/?query=%22Shivam+Gola%22&searchtype=author' },
                          { label: 'iNSPIRE-HEP', href: 'https://inspirehep.net/authors/1867679' },
                          { label: 'Google Scholar', href: 'https://scholar.google.com/scholar?q=%22Shivam+Gola%22' },
                        ].map(({ label, href }) => (
                          <a key={label} href={href} target="_blank" rel="noopener noreferrer"
                            className="px-3 py-1.5 bg-cream border border-stone-200 rounded-md text-xs font-medium text-stone-500 hover:text-darkred-700 hover:border-darkred-200 transition-all flex items-center gap-1">
                            {label} <i className="fa-solid fa-arrow-up-right-from-square text-[8px]"></i>
                          </a>
                        ))}
                      </div>
                    </div>
                  </Reveal>

                  <Reveal delay={150}>
                    <div className="space-y-3">
                      {publications.map((pub, idx) => (
                        <div key={idx} className="flex items-start gap-5 p-6 bg-cream rounded-xl border border-stone-200 hover:border-stone-300 hover:translate-x-1 transition-all duration-200 group">
                          <span className="font-display text-2xl font-bold text-stone-200 shrink-0 leading-none mt-0.5 w-7 text-right tabular-nums">
                            {String(idx + 1).padStart(2, '0')}
                          </span>
                          <div>
                            <p className="text-xs text-stone-400 mb-1">{pub.authors}</p>
                            <a href={pub.link} className="text-sm font-semibold text-stone-800 group-hover:text-darkred-800 transition-colors leading-snug block mb-1.5">
                              {pub.title}
                            </a>
                            <p className="text-xs italic text-stone-400">{pub.journal}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </Reveal>
                </div>
              </section>
            </>
          )}

          {/* ══ ACTIVITIES PAGE ══ */}
          {currentPage === 'activities' && (
            <div className="pt-28 pb-16 min-h-screen bg-cream animate-fade-in">
              <div className="max-w-4xl mx-auto px-6">

                <div className="mb-10">
                  <SectionHeader eyebrow="Activities" title="Academic Activities" />
                </div>

                <Reveal delay={100}>
                  <div className="flex items-center gap-8 mb-10 border-b border-stone-200">
                    <TabBtn label="Conferences & Seminars" icon="fa-users"  value="conferences" state={activeActivityTab} setState={setActiveActivityTab} />
                    <TabBtn label="Research Visits"         icon="fa-plane"  value="visits"      state={activeActivityTab} setState={setActiveActivityTab} />
                  </div>
                </Reveal>

                <Reveal delay={200}>
                  <div className="space-y-6">
                    {(activeActivityTab === 'conferences' ? conferencesList : visitsList).map((item, idx) => (
                      <div key={idx} className="relative pl-5 border-l-2 border-stone-200 group hover:border-darkred-400 transition-colors duration-250 animate-fade-in" style={{ animationDelay: `${idx * 0.04}s` }}>
                        <div className="absolute w-2.5 h-2.5 bg-stone-300 rounded-full -left-[7px] top-1.5 group-hover:bg-darkred-600 transition-all duration-250"></div>
                        <div className="flex flex-wrap items-center gap-2 mb-1.5">
                          <span className="eyebrow text-darkred-600">{item.type}</span>
                          <span className="text-stone-300 text-xs">·</span>
                          <span className="text-stone-400 text-xs">{item.date}</span>
                        </div>
                        <h3 className="text-sm font-semibold text-stone-900 mb-1 group-hover:text-darkred-800 transition-colors">{item.title}</h3>
                        <p className="text-stone-400 text-sm leading-relaxed">{item.details}</p>
                      </div>
                    ))}
                  </div>
                </Reveal>
              </div>
            </div>
          )}

          {/* ══ GALLERY PAGE ══ */}
          {currentPage === 'blog' && (
            <div className="pt-28 pb-16 min-h-screen bg-cream animate-fade-in">
              <div className="max-w-5xl mx-auto px-6">

                <div className="mb-12">
                  <SectionHeader eyebrow="Gallery" title="Travel & Photography" />
                  <p className="text-stone-400 text-xs mt-4">Memories from various trips and places.</p>
                </div>

                <div className="grid grid-cols-1 gap-10">
                  {blogPosts.map((post, idx) => (
                    <Reveal key={post.id} delay={idx * 100}>
                      <div className="bg-cream-50 rounded-2xl border border-stone-200 overflow-hidden hover:border-stone-300 transition-all duration-300">

                        {post.images && post.images.length > 0 && (
                          <div className="bg-stone-100/80 p-6 md:p-8">
                            <div className={`grid gap-4 ${
                              post.images.length === 1 ? 'grid-cols-1 max-w-2xl mx-auto' :
                              post.images.length === 2 ? 'grid-cols-2' :
                              'grid-cols-2 sm:grid-cols-3'
                            }`}>
                              {post.images.map((imgUrl, index) => {
                                const rotations = ['rotate-[-1.5deg]', 'rotate-[1.5deg]', 'rotate-[-0.8deg]', 'rotate-[1deg]'];
                                const rotClass = post.images.length > 1 ? rotations[index % 4] : '';
                                return (
                                  <div
                                    key={index}
                                    className={`relative aspect-[4/3] overflow-hidden rounded-lg bg-stone-200 shadow-sm cursor-pointer group/img transition-all duration-400 hover:z-20 hover:shadow-md hover:scale-105 hover:rotate-0 border-4 border-white ${rotClass}`}
                                    onClick={() => setSelectedImage(imgUrl)}
                                  >
                                    <img
                                      src={imgUrl}
                                      alt={`${post.title} ${index + 1}`}
                                      className="w-full h-full object-cover transition-transform duration-500 group-hover/img:scale-105"
                                      onError={(e) => { if (!e.target.dataset.fallbackTriggered) { e.target.dataset.fallbackTriggered = "true"; e.target.src = "https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=800&q=80"; }}}
                                    />
                                    <div className="absolute inset-0 bg-stone-900/0 group-hover/img:bg-stone-900/15 transition-all duration-300 flex items-center justify-center">
                                      <div className="w-8 h-8 rounded-full bg-white/20 backdrop-blur-sm flex items-center justify-center opacity-0 group-hover/img:opacity-100 transition-all duration-300">
                                        <i className="fa-solid fa-expand text-white text-xs drop-shadow"></i>
                                      </div>
                                    </div>
                                  </div>
                                );
                              })}
                            </div>
                          </div>
                        )}

                        <div className="p-6 md:p-8">
                          <div className="flex items-center gap-2 mb-2">
                            <span className="eyebrow text-darkred-600">{post.type}</span>
                            <span className="text-stone-300 text-xs">·</span>
                            <span className="text-stone-400 text-xs">{post.date}</span>
                          </div>
                          <h3 className="text-lg font-semibold text-stone-900">{post.title}</h3>
                          {post.content && post.content.trim() !== "" && (
                            <p className="text-stone-400 text-sm leading-relaxed mt-1">{post.content}</p>
                          )}
                        </div>
                      </div>
                    </Reveal>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* ── LIGHTBOX ── */}
          {selectedImage && (
            <div
              className="fixed inset-0 z-[100] flex items-center justify-center bg-stone-950/97 backdrop-blur-sm p-4 md:p-12 animate-fade-in-modal cursor-zoom-out"
              onClick={() => setSelectedImage(null)}
            >
              <button
                className="absolute top-4 right-4 md:top-6 md:right-6 text-stone-400 hover:text-white z-10 w-9 h-9 flex items-center justify-center rounded-full bg-stone-800 hover:bg-darkred-800 transition-colors"
                onClick={() => setSelectedImage(null)}
              >
                <i className="fa-solid fa-xmark text-xs"></i>
              </button>
              <img
                src={selectedImage}
                alt="Expanded view"
                className="max-w-full max-h-full rounded-lg shadow-2xl object-contain animate-scale-up-modal cursor-default"
                onClick={(e) => e.stopPropagation()}
                onError={(e) => { if (!e.target.dataset.fallbackTriggered) { e.target.dataset.fallbackTriggered = "true"; e.target.src = "https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1600&q=80"; }}}
              />
            </div>
          )}

          {/* ── FOOTER ── */}
          <footer id="contact" className="bg-stone-950 text-stone-400 py-16 border-t-2 border-darkred-900/50">
            <div className="max-w-6xl mx-auto px-6 grid md:grid-cols-2 gap-12">
              <Reveal>
                <div>
                  <p className="eyebrow text-stone-600 mb-4">Contact</p>
                  <h2 className="font-display text-xl font-semibold text-stone-200 mb-6">Get in Touch</h2>
                  <div className="space-y-3">
                    <a href="mailto:shivamgola17@gmail.com" className="flex items-center gap-3 text-sm hover:text-stone-200 transition-colors group">
                      <div className="w-7 h-7 rounded-full bg-stone-800 flex items-center justify-center group-hover:bg-darkred-800 transition-colors shrink-0">
                        <i className="fa-solid fa-envelope text-xs"></i>
                      </div>
                      shivamgola17@gmail.com
                    </a>
                    <div className="flex items-center gap-3 text-sm cursor-default">
                      <div className="w-7 h-7 rounded-full bg-stone-800 flex items-center justify-center shrink-0">
                        <i className="fa-solid fa-location-dot text-xs"></i>
                      </div>
                      IIT Bombay, Mumbai, Maharashtra 400076
                    </div>
                  </div>
                </div>
              </Reveal>
            </div>
            <Reveal delay={150}>
              <div className="max-w-6xl mx-auto px-6 mt-12 pt-8 border-t border-stone-800 text-xs flex flex-col sm:flex-row justify-between items-center gap-4 text-stone-500">
                <p>© {new Date().getFullYear()} Dr. Shivam Gola. All rights reserved.</p>
                <div className="flex gap-5">
                  <a href="https://inspirehep.net/authors/1867679"                                           target="_blank" rel="noopener noreferrer" className="hover:text-stone-300 transition-colors">iNSPIRE-HEP</a>
                  <a href="https://arxiv.org/search/?query=%22Shivam+Gola%22&searchtype=author"              target="_blank" rel="noopener noreferrer" className="hover:text-stone-300 transition-colors">arXiv</a>
                  <a href="https://scholar.google.com/scholar?q=%22Shivam+Gola%22"                          target="_blank" rel="noopener noreferrer" className="hover:text-stone-300 transition-colors">Google Scholar</a>
                </div>
              </div>
            </Reveal>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
