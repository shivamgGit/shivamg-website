    // Canvas-based Standard Model / Early Universe Particle Interaction Background
    const ParticleBackground = () => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        // Resize handler
        const resizeCanvas = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particlesArray = [];
        // Updated colors replacing blue with dark red
        const smColors = ['#781919', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6']; 

        class Particle {
          constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            // Higher velocity to mimic early universe thermal bath
            this.vx = (Math.random() - 0.5) * 2.5; 
            this.vy = (Math.random() - 0.5) * 2.5;
            this.radius = Math.random() * 2 + 1.5;
            this.color = smColors[Math.floor(Math.random() * smColors.length)];
          }

          update() {
            this.x += this.vx;
            this.y += this.vy;

            // Bounce off edges
            if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
            if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;
          }

          draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
            
            // Subtle glow for high energy
            ctx.shadowBlur = 8;
            ctx.shadowColor = this.color;
          }
        }

        // Initialize primordial soup
        for (let i = 0; i < 90; i++) {
          particlesArray.push(new Particle());
        }

        // Fast-forward simulation by ~3 seconds (180 frames at 60fps) to skip the initial clustering
        for (let frame = 0; frame < 180; frame++) {
          for (let i = 0; i < particlesArray.length; i++) {
            particlesArray[i].update();
          }
        }

        const animate = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          
          for (let i = 0; i < particlesArray.length; i++) {
            particlesArray[i].update();
            particlesArray[i].draw();
            
            // Draw interactions (Feynman-like lines) when particles get close
            for (let j = i; j < particlesArray.length; j++) {
              const dx = particlesArray[i].x - particlesArray[j].x;
              const dy = particlesArray[i].y - particlesArray[j].y;
              const distance = Math.sqrt(dx * dx + dy * dy);
              
              if (distance < 130) {
                ctx.beginPath();
                // Interaction line color blends based on the originating particle
                ctx.strokeStyle = particlesArray[i].color; 
                ctx.globalAlpha = 1 - (distance / 130);
                ctx.lineWidth = 0.8;
                ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
                ctx.lineTo(particlesArray[j].x, particlesArray[j].y);
                ctx.stroke();
                
                // Reset alpha and shadow
                ctx.globalAlpha = 1; 
                ctx.shadowBlur = 0; 
              }
            }
          }
          animationFrameId = requestAnimationFrame(animate);
        };

        animate();

        return () => {
          window.removeEventListener('resize', resizeCanvas);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return (
        <canvas 
          ref={canvasRef} 
          className="absolute inset-0 z-0 opacity-40 pointer-events-none" 
        />
      );
    };

                      <button

                        className={`px-4 py-3 md:px-6 md:py-3.5 rounded-xl font-bold transition-all flex items-center gap-2 ${activeTab === 'education' ? 'bg-cream text-darkred-800 shadow-sm ring-1 ring-stone-200/50' : 'text-stone-500 hover:text-stone-700 hover:bg-stone-200/50'}`}
                      >
                        <i className="fa-solid fa-graduation-cap text-lg"></i>
                        Education <span className="hidden sm:inline">Background</span>
                      </button>
                      <button 
                        onClick={() => setActiveTab('achievements')}
                        className={`px-4 py-3 md:px-6 md:py-3.5 rounded-xl font-bold transition-all flex items-center gap-2 ${activeTab === 'achievements' ? 'bg-cream text-darkred-800 shadow-sm ring-1 ring-stone-200/50' : 'text-stone-500 hover:text-stone-700 hover:bg-stone-200/50'}`}
                      >
                        <i className="fa-solid fa-award text-lg"></i>
                        Key Achievements
                      </button>
                    </div>
                  </div>

                  {/* Active Tab Content (Timeline) */}
                  <div className="space-y-8 relative before:absolute before:inset-0 before:ml-[1.125rem] before:h-full before:w-1 before:bg-cream-100 before:rounded-full">
                    {activeTab === 'achievements' ? (
                      achievements.map((item, idx) => (
                        <div key={idx} className="relative flex items-center gap-6 group animate-fade-in" style={{ animationDelay: `${idx * 0.1}s` }}>
                          <div className="flex items-center justify-center w-10 h-10 rounded-full border-4 border-cream bg-darkred-50 text-darkred-800 shadow-sm shrink-0 z-10 group-hover:bg-darkred-800 group-hover:text-cream transition-colors duration-300">
                            <i className="fa-solid fa-award text-sm"></i>
                          </div>
                          <div className="flex-1 bg-cream p-5 md:p-6 rounded-2xl border border-stone-200 shadow-sm hover:shadow-xl hover:border-darkred-200 hover:-translate-y-1 transition-all duration-300">
                            <h4 className="text-lg font-bold text-stone-900">{item}</h4>
                          </div>
                        </div>
                      ))
                    ) : (
                      (activeTab === 'experience' ? experience : education).map((item, idx) => (
                        <div key={idx} className="relative flex items-start gap-6 group animate-fade-in" style={{ animationDelay: `${idx * 0.1}s` }}>
                          
                          {/* Timeline Node */}
                          <div className="flex items-center justify-center w-10 h-10 rounded-full border-4 border-cream bg-darkred-50 text-darkred-800 shadow-sm shrink-0 z-10 group-hover:bg-darkred-800 group-hover:text-cream transition-colors duration-300">
                            {activeTab === 'experience' ? <i className="fa-solid fa-briefcase text-sm"></i> : <i className="fa-solid fa-graduation-cap text-sm"></i>}
                          </div>
                          
                          {/* Content Card */}
                          <div className="flex-1 bg-cream p-6 md:p-8 rounded-2xl border border-stone-200 shadow-sm hover:shadow-xl hover:border-darkred-200 hover:-translate-y-1 transition-all duration-300">
                            <div className="flex flex-col md:flex-row md:items-center justify-between mb-4 gap-3">
                              <h4 className="text-xl font-bold text-stone-900">{item.role || item.degree}</h4>
                              <span className="inline-flex items-center px-3 py-1 bg-darkred-50 text-darkred-900 text-sm font-semibold rounded-full whitespace-nowrap">
                                {item.period}
                              </span>
                            </div>
                            <div className="text-stone-700 font-semibold mb-3 flex items-center gap-2">
                              <i className="fa-solid fa-location-dot text-stone-400"></i>
                              {item.institution}
                            </div>
                            {item.description || item.details ? (
                              <p className="text-stone-600 leading-relaxed">
                                {item.description || item.details}
                              </p>
                            ) : null}
                          </div>

                        </div>
                      ))
                    )}
                  </div>

                </div>
              </section>




              {/* Publications */}
              <section id="publications" className="py-20 bg-cream-50">
                <div className="max-w-5xl mx-auto px-6">
                  <div className="flex items-center justify-between mb-12">
                    <h2 className="text-3xl font-bold text-stone-900 flex items-center gap-2">
                      <i className="fa-solid fa-book-open text-3xl text-darkred-800"></i>
                      Selected Publications
                    </h2>
                    <div className="hidden sm:flex gap-2">
                      <a href="https://arxiv.org/search/?query=%22Shivam+Gola%22&searchtype=author" target="_blank" rel="noopener noreferrer" className="px-3 py-1 bg-cream border border-stone-200 rounded-full text-xs font-medium text-stone-600 flex items-center gap-1 cursor-pointer hover:bg-cream-100 transition-colors">
                        arXiv <i className="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                      </a>
                      <a href="https://inspirehep.net/authors/1867679" target="_blank" rel="noopener noreferrer" className="px-3 py-1 bg-cream border border-stone-200 rounded-full text-xs font-medium text-stone-600 flex items-center gap-1 cursor-pointer hover:bg-cream-100 transition-colors">
                        iNSPIRE-HEP <i className="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                      </a>
                      <a href="https://scholar.google.com/scholar?q=%22Shivam+Gola%22" target="_blank" rel="noopener noreferrer" className="px-3 py-1 bg-cream border border-stone-200 rounded-full text-xs font-medium text-stone-600 flex items-center gap-1 cursor-pointer hover:bg-cream-100 transition-colors">
                        Google Scholar <i className="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                      </a>
                    </div>
                  </div>

                  {/* Simple Publication List */}
                  <div className="bg-cream p-8 md:p-10 rounded-3xl border border-stone-200 shadow-sm">
                    <ol className="list-decimal pl-5 space-y-6 text-stone-700 marker:text-darkred-800 marker:font-bold">
                      {publications.map((pub, idx) => (
                        <li key={idx} className="pl-3 leading-relaxed text-lg">
                          <span className="font-semibold text-stone-900">{pub.authors}</span>.{" "}
                          <a href={pub.link} className="text-darkred-800 hover:text-darkred-600 hover:underline transition-colors">
                            "{pub.title}"
                          </a>
                          . <span className="italic text-stone-600">{pub.journal}</span>.
                        </li>
                      ))}
                    </ol>
                  </div>
                </div>
              </section>
            </>
          )}

          {/* ----- ACTIVITIES PAGE CONTENT ----- */}
          {currentPage === 'activities' && (
            <div className="pt-24 pb-12 min-h-screen bg-cream">
              {/* Academic Activities (Tabs) */}
              <section id="conferences" className="py-10 bg-cream">
                <div className="max-w-5xl mx-auto px-6">
                  <div className="flex items-center justify-center mb-10">
                    <h2 className="text-3xl font-bold text-stone-900 flex items-center gap-3">
                      <i className="fa-solid fa-microphone-lines text-3xl text-darkred-800"></i>
                      Academic Activities
                    </h2>
                  </div>

                  {/* Activity Tab Selector */}
                  <div className="flex justify-center mb-10">
                    <div className="bg-cream-100 p-1.5 rounded-2xl inline-flex shadow-inner gap-1 border border-stone-100">
                      <button 
                        onClick={() => setActiveActivityTab('conferences')}
                        className={`px-5 py-2.5 md:px-8 md:py-3 rounded-xl font-bold transition-all flex items-center gap-2 ${activeActivityTab === 'conferences' ? 'bg-cream text-darkred-800 shadow-sm ring-1 ring-stone-200/50' : 'text-stone-500 hover:text-stone-700 hover:bg-stone-200/50'}`}
                      >
                        <i className="fa-solid fa-users text-lg"></i>
                        Conferences & Seminars
                      </button>
                      <button 
                        onClick={() => setActiveActivityTab('visits')}
                        className={`px-5 py-2.5 md:px-8 md:py-3 rounded-xl font-bold transition-all flex items-center gap-2 ${activeActivityTab === 'visits' ? 'bg-cream text-darkred-800 shadow-sm ring-1 ring-stone-200/50' : 'text-stone-500 hover:text-stone-700 hover:bg-stone-200/50'}`}
                      >
                        <i className="fa-solid fa-plane text-lg"></i>
                        Research Visits
                      </button>
                    </div>
                  </div>

                  {/* Timeline Activity List */}
                  <div className="bg-cream-50 p-8 md:p-10 rounded-3xl border border-stone-200 shadow-sm">
                    <div className="space-y-8">
                      {(activeActivityTab === 'conferences' ? conferencesList : visitsList).map((item, idx) => (
                        <div key={idx} className="relative pl-6 border-l-2 border-darkred-200 animate-fade-in" style={{ animationDelay: `${idx * 0.05}s` }}>
                          <div className="absolute w-3 h-3 bg-darkred-500 rounded-full -left-[7px] top-1.5 ring-4 ring-cream-50"></div>
                          <div className="flex flex-wrap items-center gap-3 mb-1">
                            <span className="px-2.5 py-0.5 bg-darkred-100 text-darkred-900 text-xs font-bold rounded uppercase tracking-wider">
                              {item.type}
                            </span>
                            <span className="text-darkred-800 font-semibold text-sm">
                              {item.date}
                            </span>
                          </div>
                          <h3 className="text-xl font-bold text-stone-900 mb-2">{item.title}</h3>
                          <p className="text-stone-700 leading-relaxed text-lg">
                            {item.details}
                          </p>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </section>
            </div>
          )}



{/* ----- BLOG & GALLERY PAGE CONTENT ----- */}
{currentPage === 'blog' && (
  <div className="pt-24 pb-12 min-h-screen bg-cream">
    <section id="blog" className="py-10 bg-cream">
      <div className="max-w-6xl mx-auto px-6">
        <div className="text-center mb-12">
          <h2 className="text-3xl font-bold text-stone-900 flex items-center justify-center gap-3">
            <i className="fa-solid fa-camera-retro text-3xl text-darkred-800"></i>
            Gallery
          </h2>
        </div>

        <div className="grid grid-cols-1 gap-12">
          {blogPosts.map((post) => (
            <div key={post.id} className="bg-cream-50 rounded-3xl border border-stone-200 shadow-sm overflow-hidden flex flex-col">
              
              {/* --- New Photo Array Grid --- */}
              {post.images && post.images.length > 0 && (
                <div className={`grid gap-2 p-2 ${
                  post.images.length === 1 ? 'grid-cols-1' : 
                  post.images.length === 2 ? 'grid-cols-2' : 'grid-cols-2 md:grid-cols-3'
                }`}>
                  {post.images.map((imgUrl, index) => (
                    <div key={index} className="aspect-video overflow-hidden rounded-xl">
                      <img 
                        src={imgUrl} 
                        alt={`${post.title} ${index + 1}`} 
                        className="w-full h-full object-cover hover:scale-105 transition-transform duration-500" 
                      />
                    </div>
                  ))}
                </div>
              )}

              <div className="p-8">
                <div className="flex items-center gap-3 mb-4">
                  <span className="px-3 py-1 bg-darkred-50 text-darkred-900 text-xs font-bold rounded-full uppercase tracking-wider">
                    {post.type}
                  </span>
                  <span className="text-stone-500 text-sm font-medium">
                    <i className="fa-regular fa-calendar mr-2"></i>{post.date}
                  </span>
                </div>
                <h3 className="text-2xl font-bold text-stone-900 mb-3">{post.title}</h3>
                <p className="text-stone-600 leading-relaxed text-lg">
                  {post.content}
                </p>
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>
  </div>
)}



          {/* Footer / Contact */}
          <footer id="contact" className="bg-stone-900 text-stone-400 py-16 border-t-4 border-darkred-800">
            <div className="max-w-6xl mx-auto px-6 grid md:grid-cols-2 gap-12">
              
              <div>
                <h2 className="text-2xl font-bold text-cream mb-6">Get in Touch</h2>
                <div className="space-y-3">
                  <a href="mailto:shivamgola17@gmail.com" className="flex items-center gap-3 hover:text-cream transition-colors">
                    <i className="fa-solid fa-envelope w-5 text-center"></i> shivamgola17@gmail.com
                  </a>
                  <div className="flex items-center gap-3">
                    <i className="fa-solid fa-phone w-5 text-center"></i> +91 9917353630
                  </div>
                  <div className="flex items-center gap-3">
                    <i className="fa-solid fa-location-dot w-5 text-center"></i> IIT Bombay, Mumbai, Maharashtra 400076
                  </div>
                </div>
              </div>

              <div>
                <h2 className="text-xl font-bold text-cream mb-6">References</h2>
                <div className="grid sm:grid-cols-2 gap-6">
                  <div>
                    <div className="font-semibold text-stone-200">Prof. V Ravindran</div>
                    <div className="text-sm mt-1">PhD Supervisor<br/>IMSc, Chennai</div>
                  </div>
                  <div>
                    <div className="font-semibold text-stone-200">Prof. Nita Sinha</div>
                    <div className="text-sm mt-1">PhD Co-Supervisor<br/>IMSc, Chennai</div>
                  </div>
                </div>
              </div>

            </div>
            
            <div className="max-w-6xl mx-auto px-6 mt-16 pt-8 border-t border-stone-800 text-sm flex flex-col sm:flex-row justify-between items-center">
              <p>© {new Date().getFullYear()} Dr. Shivam Gola. All rights reserved.</p>
              <div className="flex gap-4 mt-4 sm:mt-0">
                <a href="https://inspirehep.net/authors/1867679" target="_blank" rel="noopener noreferrer" className="hover:text-cream transition-colors">iNSPIRE-HEP</a>
                <a href="https://arxiv.org/search/?query=%22Shivam+Gola%22&searchtype=author" target="_blank" rel="noopener noreferrer" className="hover:text-cream transition-colors">arXiv</a>
                <a href="https://scholar.google.com/scholar?q=%22Shivam+Gola%22" target="_blank" rel="noopener noreferrer" className="hover:text-cream transition-colors">Google Scholar</a>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
